const DAYS=[{"date":"21 March 2027","title":"Arrival in Hanoi & City Tour","stay":"Hanoi","desc":"Welcome to Vietnam. Arrive at Noi Bai International Airport, take your private hotel transfer and explore Hanoi on a shared shuttle-bus city sightseeing tour.","points":["🛬 Arrive at Noi Bai International Airport","🚘 Private transfer to Hanoi hotel","🚌 Hanoi City Tour by shared shuttle bus","🏨 Check-in & overnight in Hanoi"],"photos":[["https://d1pllr5sjb7ywk.cloudfront.net/uploads/f5d275d2-445f-2d77-8f5c-3a2286a1799d/PackageMedia/3314335b-242e-4cc9-8cfc-b20c2fa9e3a6_Noi-Bai-International-Airport-01_R.webp","Noi Bai International Airport"],["https://dynamic-media.tacdn.com/media/photo-o/2e/d3/a7/93/caption.jpg?w=1100&h=800&s=1","Private Airport Transfer"],["https://vietnamstory.in/wp-content/uploads/2024/08/4-3.jpg","Hanoi City Sightseeing"],["https://vietnamdiscovery.com/wp-content/uploads/2020/09/legendary-hanoi-city-tour-1.jpg","Hanoi City Tour"]]},{"date":"22 March 2027","title":"Ha Long Bay Deluxe Cruise","stay":"Hanoi","desc":"Enjoy an unforgettable Ha Long Bay Deluxe Cruise, with spectacular limestone-island views, kayaking, local lunch and a sunset party before returning to Hanoi.","points":["🚢 Ha Long Bay Deluxe Cruise","🛶 Kayaking experience","🍽️ Local lunch on the cruise","🌅 Sunset party included","🏨 Return to Hanoi for overnight stay"],"photos":[["https://vivuhalong.com/wp-content/uploads/2024/08/Halong-Bay-cruise-day-boat-7.jpg","Ha Long Bay Deluxe Cruise"],["https://lyracruises.com/wp-content/uploads/2025/07/kayaking-in-halong-bay-1-1024x683.jpg","Kayaking in Ha Long Bay"],["https://halongviolet.com/images/photos/limestone-pillars_c8de1.jpg","Ha Long Bay Limestone Islands"]]},{"date":"23 March 2027","title":"Ninh Binh: Bai Dinh, Trang An & Mua Caves","stay":"Hanoi","desc":"A scenic full-day Ninh Binh tour covering Bai Dinh Pagoda, the waterways of Trang An and the viewpoints around Mua Caves, with buffet lunch.","points":["⛩️ Bai Dinh Pagoda complex","🚣 Trang An scenic landscape","⛰️ Mua Caves and viewpoints","🍽️ Buffet lunch included","🏨 Return to Hanoi for overnight stay"],"photos":[["https://authentikvietnam.com/media/ckeditor/pagode-bai-dinh.jpeg","Bai Dinh Pagoda"],["https://i.pinimg.com/1200x/16/25/1f/16251f1e73ddc15c5e08da7c2a40a92f.jpg","Trang An Ninh Binh"],["https://i.pinimg.com/1200x/0e/33/94/0e3394b41c90539d4eda5c00642b3e2c.jpg","Mua Caves"]]},{"date":"24 March 2027","title":"Fly to Da Nang & Visit Ba Na Hills","stay":"Da Nang","desc":"Transfer to the airport for your separately booked flight to Da Nang. Continue to Ba Na Hills for Golden Bridge, Fantasy Park, French Village and a cable-car ride.","points":["🚘 Airport transfer in Hanoi","✈️ Hanoi → Da Nang flight (not included)","🚡 Ba Na Hills cable car ride","🌉 Golden Bridge & French Village","🎡 Fantasy Park visit; overnight Da Nang"],"photos":[["https://www.holidaymonk.com/wp-content/uploads/2024/09/Vietnam-Escape-Da-Nang-and-Hanoi-Package-Tour-3-1024x650.webp","Da Nang"],["https://res.klook.com/images/fl_lossy.progressive,q_65/c_fill,w_1295,h_728/w_80,x_15,y_15,g_south_west,l_Klook_water_br_trans_yhcmh3/activities/lkmywmmniwngfhlsnvil/BaNaHillsandGoldenBridgeDayTourfromDaNang.jpg","Golden Bridge at Ba Na Hills"],["https://danangfantasticity.com/wp-content/uploads/2024/04/mercure-danang-french-village-bana-hills-005.jpg","Ba Na Hills French Village"],["https://img.avianexperiences.com/attractions/9e420f5e-9bc2-4cba-826b-939d6012b31c","Fantasy Park"]]},{"date":"25 March 2027","title":"Coconut Forest & Hoi An","stay":"Da Nang","desc":"Discover the Coconut Forest on a traditional basket-boat ride, wander through Hoi An Ancient Town and enjoy a memorable lantern-boat experience.","points":["🛶 Coconut Forest basket-boat ride","🏮 Explore Hoi An Ancient Town","🚣 Lantern Boat Ride experience","🚌 Shared sightseeing service","🏨 Overnight in Da Nang"],"photos":[["https://i.pinimg.com/1200x/88/d2/7b/88d27ba325e90633a677b3861ed0332d.jpg","Coconut Forest Basket Boat"],["https://ak-d.tripcdn.com/images/0352012000pnq1nfvD8E7_C_1000_1000_Q50.jpg_.webp","Hoi An Ancient Town"],["https://res.klook.com/images/fl_lossy.progressive,q_65/c_fill,w_1295,h_971/w_80,x_15,y_15,g_south_west,l_Klook_water_br_trans_yhcmh3/activities/umo2z5jjeiscj8mv0lox/BoatRideTicketandReleaseLanternatHoairiverinHoiAn.jpg","Hoi An Lantern Boat Ride"]]},{"date":"26 March 2027","title":"Da Nang to Phu Quoc","stay":"Phu Quoc","desc":"Travel to Da Nang airport for your separately booked domestic flight to Phu Quoc. On arrival, enjoy a private transfer to the hotel and time at leisure.","points":["🚘 Airport transfer in Da Nang","✈️ Da Nang → Phu Quoc flight (not included)","🛬 Arrive at Phu Quoc Airport","🚘 Private hotel transfer on arrival","🌴 Rest of the day at leisure"],"photos":[["https://www.holidaymonk.com/wp-content/uploads/2024/09/Vietnam-Escape-Da-Nang-and-Hanoi-Package-Tour-3-1024x650.webp","Da Nang Departure"],["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSf_9nBQboAW3WbfqKmBj2pwZAVwXVsWFG9Odk_iEAixKNxdv2O4vTktKOZ&s=10","Phu Quoc Airport"],["https://dynamic-media.tacdn.com/media/photo-o/2e/d3/a7/93/caption.jpg?w=1100&h=800&s=1","Private Hotel Transfer"],["https://d1pllr5sjb7ywk.cloudfront.net/uploads/f5d275d2-445f-2d77-8f5c-3a2286a1799d/PackageMedia/a2937b95-4dce-4242-813b-3cc4f95378e2_phuu_R.webp","Phu Quoc Island"]]},{"date":"27 March 2027","title":"Phu Quoc Northern Island Tour","stay":"Phu Quoc","desc":"Explore the natural beauty of northern Phu Quoc, including Cua Can River kayaking and the serene Rach Vem Beach, with lunch included.","points":["🌿 Explore Cua Can River","🛶 Kayaking experience","🏖️ Rach Vem / Starfish Beach","🍽️ Lunch included on the tour","🏨 Return to your Phu Quoc hotel"],"photos":[["https://images.myguide-cdn.com/phuquoc/activities/phu-quoc-northern-island-tour-with-kayaking-and-lunch/large/phu-quoc-northern-island-tour-with-kayaking-and-lunch-7287381.jpg","Cua Can River Kayaking"],["https://i.pinimg.com/736x/cf/bc/38/cfbc38f5ba438b7fc7712a0ea8a0572d.jpg","Rach Vem Beach"],["https://d1pllr5sjb7ywk.cloudfront.net/uploads/f5d275d2-445f-2d77-8f5c-3a2286a1799d/PackageMedia/a2937b95-4dce-4242-813b-3cc4f95378e2_phuu_R.webp","Phu Quoc Northern Island"]]},{"date":"28 March 2027","title":"Phu Quoc 4-Island Hopping","stay":"Phu Quoc","desc":"Spend the day island hopping by speedboat, enjoy sweeping sea views from the cable car and visit Aquatopia Water Park, with a local lunch included.","points":["🚤 Four-island speedboat tour","🏝️ Scenic island-hopping experience","🚡 Cable car experience","💦 Aquatopia Water Park","🍽️ Local lunch included"],"photos":[["https://i.pinimg.com/1200x/52/a0/4e/52a04ee25d993d93d5c154d3c805483d.jpg","Four-Island Speedboat Tour"],["https://i.pinimg.com/1200x/56/88/1e/56881ef5411d833dcd03d95f515a1f51.jpg","Phu Quoc Island Waters"],["https://i.pinimg.com/1200x/85/49/69/854969be9c23594242b6f62a0790d3cc.jpg","Phu Quoc Cable Car"],["https://sun-ecommerce-cdn.azureedge.net/ecommerce/service-sites/thumbnail/SunParadiseLandPhuQuoc/_default_upload_bucket/73561/image-thumb__73561__1600/3_1770019121.jpg","Aquatopia Water Park"]]},{"date":"29 March 2027","title":"Departure from Phu Quoc","stay":"Tour Ends","desc":"After breakfast, check out and enjoy your private transfer to Phu Quoc International Airport for the onward journey.","points":["🍳 Breakfast at hotel","🧳 Hotel check-out & luggage","🚘 Private airport transfer","🛫 Departure from Phu Quoc Airport"],"photos":[["https://static.toiimg.com/thumb/106057438/Hotel-checkout.jpg?width=1200&height=900","Hotel Checkout"],["https://dynamic-media.tacdn.com/media/photo-o/2e/d3/a7/93/caption.jpg?w=1100&h=800&s=1","Private Airport Transfer"],["https://m.media-amazon.com/images/I/71nXbtmuQlL.jpg","Airport Departure"]]}];

function gallery(d,i){return `<div class="gallery"><div class="track" id="t${i}" data-index="0">${d.photos.map(([src,alt])=>`<div class="frame"><img src="${src.replace(/&/g,'&amp;')}" alt="${alt}" loading="eager"><span class="caption">${alt}</span></div>`).join('')}</div><button class="arrow prev" type="button" onclick="move(${i},-1)" aria-label="Previous photo">❮</button><button class="arrow next" type="button" onclick="move(${i},1)" aria-label="Next photo">❯</button><span class="counter" id="c${i}">1 / ${d.photos.length}</span></div>`}
