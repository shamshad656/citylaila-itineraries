/* ============================================================
   FUNCTION: EASY-EDIT CAROUSEL
   Add/remove/reorder images in DAY N.images only.
   ============================================================ */
function gallery(day,index){
  const images=day.images;

  if(!images.length){
    return `<div class="gallery"></div>`;
  }

  return `
    <div class="gallery">
      <div class="track" id="track-${index}" data-index="0">
        ${images.map(photo=>`
          <div class="frame">
            <img
              src="${photo.url.replace(/&/g,"&amp;")}"
              alt="${photo.caption}"
              loading="eager">
            <span class="caption">${photo.caption}</span>
          </div>
        `).join("")}
      </div>

      ${images.length>1?`
        <button class="arrow prev" type="button"
          onclick="moveImage(${index},-1)"
          aria-label="Previous image">❮</button>

        <button class="arrow next" type="button"
          onclick="moveImage(${index},1)"
          aria-label="Next image">❯</button>

        <span class="count" id="count-${index}">
          1 / ${images.length}
        </span>
      `:""}
    </div>
  `;
}

/* FUNCTION: PREVIOUS / NEXT */
function moveImage(dayIndex,direction){
  const track=document.getElementById(`track-${dayIndex}`);
  if(!track)return;

  const total=DAYS[dayIndex].images.length;
  if(total<2)return;

  const current=Number(track.dataset.index)||0;
  const next=(current+direction+total)%total;

  track.dataset.index=next;
  track.style.transform=`translateX(-${next*100}%)`;

  const counter=document.getElementById(`count-${dayIndex}`);
  if(counter){
    counter.textContent=`${next+1} / ${total}`;
  }
}
