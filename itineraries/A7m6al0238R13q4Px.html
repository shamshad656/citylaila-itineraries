/* =====================================================

===================================================== */
function gallery(day,index){
  const images=day.images||[];
  if(!images.length){ return `<div class="gallery"></div>`; }

  const frames=images.map((im,i)=>`
    <div class="gallery-frame">
      <img src="${esc(im.url)}" alt="${esc(im.caption)}" loading="${i===0?"eager":"lazy"}">
      <span class="gallery-caption">${esc(im.caption)}</span>
    </div>
  `).join("");

  return `
    <div class="gallery">
      <div class="gallery-track" id="gallery-${index}" data-index="0">${frames}</div>
      ${images.length>1?`
      <button type="button" class="gallery-btn prev" onclick="moveGallery(${index},-1)" aria-label="Previous image">❮</button>
      <button type="button" class="gallery-btn next" onclick="moveGallery(${index},1)" aria-label="Next image">❯</button>
      <span class="gallery-counter" id="counter-${index}">1 / ${images.length}</span>
      `:""}
    </div>`;
}

function moveGallery(index,direction){
  const track=document.getElementById(`gallery-${index}`);
  if(!track)return;
  const count=track.querySelectorAll(".gallery-frame").length;
  if(count<=1)return;
  const current=Number(track.dataset.index||0);
  const next=(current+direction+count)%count;
  track.dataset.index=next;
  track.style.transform=`translateX(-${next*100}%)`;
  const counter=document.getElementById(`counter-${index}`);
  if(counter){ counter.textContent=`${next+1} / ${count}`; }
}

        </div>

        ${day.note?`<div class="day-note">ℹ️ ${esc(day.note)}</div>`:""}
      </div>
      ${gallery(day,index)}
    </div>
  `,index+5);
}

/* =====================================================
   PAGE 12: MEAL SUMMARY
===================================================== */
function mealsPage(){
  const rows=MEALS.map(m=>`
    <tr>
      <td><strong>Day ${m.day}</strong></td>
      <td>${esc(m.date)}</td>
      <td>${esc(m.experience)}</td>
      <td>${m.meal.toLowerCase().includes("breakfast")?`<span class="meal-yes">${esc(m.meal)}</span>`:esc(m.meal)}</td>
    </tr>
  `).join("");

  return page(`
    <h2 class="page-title">Meal Plan <span>Summary</span></h2>
    <p class="subtitle">
      Breakfasts are linked to the guest's self-booked hotel arrangements and are not separately priced within this land package quotation.
    </p>

    <table class="meal-table">
      <thead>
        <tr>
          <th>Day</th>
          <th>Date</th>
          <th>Programme</th>
          <th>Meal Arrangement</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>

    <div class="meal-note">
      <strong>Meal Clarification:</strong> The daily breakfast references are based on the guest's self-booked hotels
      (Ramada Hotel and Novotel Almaty City Center). The quoted package cost focuses on guide services, vehicle, tours and transfers.
      Any breakfast entitlement depends on the guest's direct hotel booking terms.
    </div>
  `,12);
}

/* =====================================================
   PAGE 13: INCLUSIONS, EXCLUSIONS & CLARIFICATIONS
===================================================== */
function coveragePage(){
  return page(`
    <h2 class="page-title">Package <span>Inclusions & Clarifications</span></h2>

    <div class="coverage">
      <div class="coverage-panel good">
        <h3>✅ Package Inclusions</h3>
        <div class="coverage-items">
          ${INCLUSIONS.map(item=>`<div>${esc(item)}</div>`).join("")}
        </div>
      </div>

      <div class="coverage-panel warn">
        <h3>❌ Exclusions & Important Notes</h3>
        <div class="coverage-items">
          ${EXCLUSIONS.concat(CLARIFICATIONS).map(item=>`<div>${esc(item)}</div>`).join("")}
        </div>
      </div>
    </div>


  `,13);
}

/* =====================================================
   PAGE 14: PACKAGE COST
===================================================== */
function pricePage(){
  return page(`
    <h2 class="cost-title">Package Cost <span>& Grand Total</span></h2>

    <div class="cost-card">
      <div class="cost-label">TOTAL PACKAGE PRICE</div>
      <div class="cost-amount"><small>INR</small> ${PRICE.amount}</div>
      <div class="cost-basis">TOTAL FOR 13 PERSONS</div>

      <div class="cost-facts">
        <div>👥 Group Size<strong>13 Persons</strong></div>
        <div>🏨 Hotels<strong>Self Booked by Guest</strong></div>
        <div>🚐 Vehicle<strong>Private Toyota HiAce</strong></div>
        <div>🧑‍🏫 Guide<strong>English-Speaking Guide</strong></div>
      </div>
    </div>

    <div class="price-note">
      <strong>Price Note:</strong> ${esc(PRICE.note)}
      <br>
      Entrance tickets, eco-post fees, national park fees and personal expenses are excluded.
      Hotel names have been added by date only to clarify the stay arrangements and transfer planning.
    </div>
  `,14,false,"cost-page");
}

/* =====================================================
   PAGE 15: GLOBAL PRESENCE
===================================================== */
function globalPage(){
  const locations=GLOBAL.map(g=>`
    <div class="location" style="background-image:url('${g.image}')">
      <h3>${g.name}</h3>
      <p>${g.info}</p>
    </div>
  `).join("");

  return page(`
    <h2 class="page-title">📍 Global Presence <span>& Contact Us</span></h2>

    <div class="global-layout">
      <div class="locations">${locations}</div>

      <div class="inquiry">
        <div class="inquiry-title">🎧 INSTANT TOUR CONCIERGE</div>

        <div class="inquiry-item">
          <b style="color:#63B3ED">B2B Partnerships</b>
          <small>b2b@citylaila.com<br>+971 4 4451 625</small>
        </div>

        <div class="inquiry-item">
          <b style="color:#FF9933">Marketing & Media</b>
          <small>marketing@citylaila.com</small>
        </div>

        <div class="inquiry-item">
          <b style="color:#68D391">Direct Traveler Desk</b>
          <small>info@citylaila.com<br>+971 55 536 5508</small>
        </div>
      </div>
    </div>

    <div class="features">
      <div>🌍 Global Holidays</div>
      <div>🏨 Hotel Packages</div>
      <div>🎟️ Tours & Activities</div>
      <div>🚐 Transfers</div>
      <div>🎧 Travel Support</div>
    </div>
  `,15);
}

/* =====================================================
   RENDER
===================================================== */
function renderItinerary(){
  const pages=[
    coverPage(),
    whyPage(),
    overviewPage(),
    hotelPage(),
    ...DAYS.map((day,index)=>dayPage(day,index)),
    mealsPage(),
    coveragePage(),
    pricePage(),
    globalPage()
  ];
  document.getElementById("app").innerHTML=pages.join("");
}
renderItinerary();
</script>
</body>
</html>
