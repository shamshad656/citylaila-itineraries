<style>
:root{--navy:#0b2039;--blue:#0669bf;--orange:#ef6f20;--line:#dce5ee;--light:#f7f9fc;--ink:#30445b}
*{box-sizing:border-box}html,body{margin:0}
body{background:#edf1f6;color:var(--ink);font-family:Montserrat,Arial,'Segoe UI Emoji',sans-serif;padding:10px 0}
.page{position:relative;width:297mm;height:210mm;margin:0 auto 14px;padding:15px 28px 40px;display:flex;flex-direction:column;background:white;overflow:hidden;break-after:page;page-break-after:always;box-shadow:0 4px 18px #0b203918}
.head{height:41px;flex:0 0 41px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:9px}
.head img{height:36px;max-width:147px;object-fit:contain}.head small{font-size:9.5px;letter-spacing:1px;font-weight:800;color:#7a899b}
.main{flex:1;min-height:0;display:flex;flex-direction:column}.foot{position:absolute;bottom:0;left:0;right:0;height:32px;padding:0 28px;border-top:1px solid var(--line);background:var(--light);display:flex;align-items:center;justify-content:space-between;font-size:9.7px;font-weight:800;color:#748498}
.heading{color:var(--navy);font-size:21px;font-weight:900;line-height:1.1;margin:0 0 10px}.heading em{color:var(--blue);font-style:normal}
.hero{height:103px;flex:0 0 103px;border-radius:12px;padding:12px 18px;color:#fff;margin-bottom:9px;display:grid;grid-template-columns:1.24fr .76fr;gap:12px;align-items:center;background:linear-gradient(110deg,#071c36f2,#154f70cb),url('https://vivuhalong.com/wp-content/uploads/2024/08/Halong-Bay-cruise-day-boat-7.jpg') center/cover}
.hero small{font-size:9px;color:#ffd08b;font-weight:900;letter-spacing:1px}.hero h1{font-size:25px;line-height:1.1;margin:4px 0 5px;font-weight:900}.hero p{margin:0;font-weight:750;font-size:10.6px;line-height:1.4}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:5px}.facts div{background:#071a35c9;border:1px solid #ffffff56;border-radius:6px;padding:7px 8px;font-size:9.1px;font-weight:820;line-height:1.2}.facts .wide{grid-column:1/-1}
.cards{flex:1;min-height:0;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:9px}
.card{min-height:0;display:grid;grid-template-columns:1.10fr .90fr;gap:11px;padding:9px;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:0 2px 8px #081b3609}
.copy{min-height:0;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.date{background:var(--orange);color:white;border-radius:5px;padding:4px 9px;font-weight:900;font-size:9.4px}
.copy h3{font-size:15.4px;color:var(--navy);line-height:1.15;font-weight:900;margin:5px 0 5px}
.desc{width:100%;display:flex;flex-direction:column;gap:2px;font-size:10.2px;color:#566980;font-weight:650;line-height:1.23;margin:0 0 7px}.desc span{display:block;white-space:nowrap;max-width:100%}
.points{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:5px;list-style:none;padding:0;margin:0}.points li{padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--light);font-size:9.45px;line-height:1.18;font-weight:760;overflow-wrap:anywhere}
.gallery{position:relative;height:100%;width:100%;min-height:0;overflow:hidden;border-radius:9px;background:#0b253e}.track{height:100%;display:flex;transition:transform .3s ease}.frame{width:100%;height:100%;flex:0 0 100%;min-width:0}.frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:29px;height:29px;border-radius:50%;border:1px solid #fff8;background:#091c35e3;color:#fff;font-size:16px;cursor:pointer}.prev{left:8px}.next{right:8px}.count{position:absolute;right:9px;bottom:8px;background:#091d35eb;border-radius:17px;padding:5px 8px;color:#fff;font-size:9.5px;font-weight:900;z-index:2}
.price{display:grid;grid-template-columns:1.07fr .93fr;gap:12px;flex:0 0 111px;margin-bottom:11px}.total{border-radius:12px;background:linear-gradient(125deg,#0a1d38,#21458b);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center}.total small{color:#ffce57;font-size:10px;font-weight:900;letter-spacing:1px}.total strong{font-size:36px;margin:5px 0 3px;font-weight:900}.total span{font-size:11px;color:#ffe88e;font-weight:820}.summ{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;border-radius:11px;border:1px solid var(--line);border-left:5px solid var(--blue);background:var(--light);align-content:center}.summ div{border-radius:6px;border:1px solid var(--line);padding:8px;background:white;font-size:10px;font-weight:800}
.split{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.stay{background:var(--light);border:1px solid var(--line);border-radius:7px;padding:9px 10px}.stay b{display:block;font-size:10.4px;color:var(--navy)}.stay span{font-size:9.3px;color:#63778c;font-weight:760;display:block;margin-top:3px}
.summary-panels{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-top:4px solid #35a27d}.panel.right{border-top-color:#daa338;background:#fffdf8}.panel h4{margin:0 0 7px;color:var(--navy);font-size:12px}.gridpoints{display:grid;grid-template-columns:1fr 1fr;gap:5px}.gridpoints div{padding:7px;background:var(--light);border:1px solid var(--line);border-radius:6px;font-size:9.45px;font-weight:735;line-height:1.25}.right .gridpoints div{background:#fff;border-color:#eee0c0}
.scenic{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;flex:1;min-height:70px;margin-top:10px}.scenic figure{margin:0;position:relative;overflow:hidden;border-radius:9px;background:#112b43}.scenic img{width:100%;height:100%;object-fit:cover}.scenic figcaption{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#071b36e6);color:#fff;font-size:10px;font-weight:900;padding:15px 10px 8px}
@media print{@page{size:A4 landscape;margin:0}body{background:#fff;padding:0;print-color-adjust:exact;-webkit-print-color-adjust:exact}.page{margin:0;box-shadow:none}.arrow{display:none}}
</style>

<body>
<main id="pages"></main>
<script>
const LOGO='https://shamshad656.github.io/citylaila-itineraries/images/logo.png';
const IMG={
 airport:'https://d1pllr5sjb7ywk.cloudfront.net/uploads/f5d275d2-445f-2d77-8f5c-3a2286a1799d/PackageMedia/3314335b-242e-4cc9-8cfc-b20c2fa9e3a6_Noi-Bai-International-Airport-01_R.webp',

 sapa:'https://lp-cms-production.imgix.net/2019-06/95b30ef0f0c72cd3268d2fad4b0836eddb77b4e1e71486f444c5a2f768f04c07.jpg?auto=format%2Ccompress&crop=faces%2Cedges&fit=crop&q=72&w=1095',
 catcat:'https://mir-s3-cdn-cf.behance.net/project_modules/1400/5f06f6100832771.5f26a289a486d.jpg',
 nhatrang:'https://cdn.sanity.io/images/nxpteyfv/goguides/56c6da0e58db640fff86af4198b7f6a527377cdd-1600x1066.jpg',
 beach:'https://images.squarespace-cdn.com/content/v1/5c9e66e1d7819e21e09450be/72156146-3a94-46c7-a705-d99f3e8f2426/16%2BThe%2BAnam%2B-%2BEarly%2BMorning%2BBeach.jpg',
 checkout:'https://static.toiimg.com/thumb/106057438/Hotel-checkout.jpg?width=1200&height=900',
 exit:'https://www.aviationplus.asia/wp-content/uploads/International-Terminal-of-Tan-Son-Nhat-International-Airport.jpg'
};

// Day-wise itinerary: two description lines per day.
const DAYS=[
 {date:'29 NOV',title:'Arrival in Hanoi',lines:['Welcome to Hanoi! Meet your representative on arrival at Noi Bai International Airport.','Enjoy a private hotel transfer, settle into your room and relax for the evening.'],points:['🛬 Airport arrival & meet-and-greet','🚘 Private transfer to Hanoi hotel','🏨 Check-in & leisure time','🌙 Overnight in Hanoi'],photos:[IMG.airport,IMG.transfer,IMG.hanoi]},
 {date:'30 NOV',title:'Ha Long Bay Cruise & Hanoi',lines:['Cruise across Ha Long Bay with kayaking, buffet lunch and a delightful sunset party.','Return to Hanoi for a city tour, if time permits after the cruise and transfer.'],points:['🚢 Ha Long Bay cruise','🛶 Kayaking & buffet lunch','🌅 Sunset party','🏙️ Hanoi city tour • timing dependent'],photos:[IMG.halong,IMG.kayak,IMG.hanoi]},
 {date:'01 DEC',title:'Fly to Da Nang & Ba Na Hills',lines:['Check out and fly from Hanoi to Da Nang, followed by your arrival transfer.','Discover Golden Bridge, Fantasy Park and French Village as flight timings allow.'],points:['✈️ Hanoi → Da Nang flight','🚡 Ba Na Hills cable car','🌉 Golden Hands Bridge','🏨 Overnight in Da Nang'],photos:[IMG.bana,IMG.golden,IMG.french]},
 {date:'02 DEC',title:'Coconut Forest & Hoi An',lines:['Explore the beautiful Coconut Forest on a traditional Vietnamese basket-boat ride.','Continue to Hoi An Ancient Town and enjoy its magical evening lantern-boat experience.'],points:['🥥 Coconut Forest','🛶 Traditional basket boat','🏮 Hoi An Ancient Town','🚣 Evening lantern boat'],photos:[IMG.coconut,IMG.hoian,IMG.lantern]},
 {date:'03 DEC',title:'Da Nang to Ho Chi Minh City',lines:['Fly to Ho Chi Minh City, enjoy your hotel transfer and settle into Saigon.','Explore the selected Cu Chi and Mekong Delta or Saigon city excursion, as confirmed.'],points:['✈️ Da Nang → Ho Chi Minh flight','🚘 Airport to hotel transfer','🏛️ Selected sightseeing excursion','🌃 Overnight in Ho Chi Minh City'],photos:[IMG.saigon,IMG.cuchi,IMG.mekong]},
 {date:'04 DEC',title:'Ho Chi Minh City at Leisure',lines:['Enjoy breakfast and explore vibrant Ho Chi Minh City at your own relaxed pace.','A car is available as arranged; attraction entry tickets are separate unless listed.'],points:['🍳 Breakfast at hotel','🚘 Car at disposal • per booking','🌆 Saigon city exploration','🎟️ Unlisted entry tickets extra'],photos:[IMG.hanoi]},
 {date:'05 DEC',title:'Fly to Hanoi & Continue to Sapa',lines:['Depart Ho Chi Minh City by air and continue by private road transfer to Sapa.','Explore Cat Cat Village in the afternoon if travel and arrival timings permit.'],points:['✈️ Flight to Hanoi','🚘 Private transfer to Sapa','🏡 Cat Cat Village • time permitting','🏨 Overnight stay in Sapa'],photos:[IMG.sapa2,IMG.catcat,IMG.transfer]},
 {date:'06 DEC',title:'Sapa to Ha Long Bay',lines:['Leave Sapa after breakfast for a scenic journey across northern Vietnam to Ha Long.','Check in on arrival and enjoy your listed dinner coupon after a day of travel.'],points:['🍳 Breakfast & hotel check-out','🚐 Road transfer to Ha Long Bay','🍽️ Dinner coupon as quoted','🏨 Overnight stay in Ha Long Bay'],photos:[IMG.sapa,IMG.halong]},
 {date:'07 DEC',title:'Ha Long Bay at Leisure',lines:['Wake up to the spectacular coastal scenery and peaceful atmosphere of Ha Long Bay.','Enjoy a leisurely day around the waterfront before returning to your hotel.'],points:['🍳 Breakfast at hotel','🌊 Relax by Ha Long Bay','📸 Scenic coastal viewpoints','🏨 Overnight in Ha Long Bay'],photos:[IMG.halong,IMG.kayak]},
 {date:'08 DEC',title:'Ha Long Bay to Da Nang',lines:['Travel to Hanoi’s Noi Bai Airport and take your flight onwards to Da Nang.','Continue by private transfer towards Ba Na Hills for your scheduled overnight stay.'],points:['🧳 Ha Long Bay hotel check-out','🚘 Transfer to Noi Bai Airport','✈️ Hanoi → Da Nang flight','🏨 Ba Na Hills area stay • to confirm'],photos:[IMG.transfer,IMG.bana]},
 {date:'09 DEC',title:'Ba Na Hills & Hoi An',lines:['Enjoy Ba Na Hills, Golden Bridge, Fantasy Park and the charming French Village.','Later travel onwards to Hoi An, check in at your hotel and relax in the evening.'],points:['🚡 Cable car & Golden Bridge','🎡 Fantasy Park','🏰 French Village','🏨 Overnight stay in Hoi An'],photos:[IMG.golden,IMG.hoian]},
 {date:'10 DEC',title:'Hoi An at Leisure',lines:['Spend a relaxed day among Hoi An’s lantern-lined streets, cafés and heritage scenery.','An additional Ba Na Hills visit is possible only if included in the final programme.'],points:['🍳 Breakfast at hotel','🏮 Hoi An exploration at leisure','🛍️ Markets & local cafés','🌉 Additional sightseeing if confirmed'],photos:[IMG.hoian,IMG.lantern]},
 {date:'11 DEC',title:'Hoi An to Nha Trang',lines:['After breakfast, travel from Hoi An to Nha Trang along Vietnam’s beautiful coast.','Check in at your hotel and enjoy a peaceful evening in this seaside destination.'],points:['🍳 Breakfast & hotel check-out','🚐 Transfer to Nha Trang','🏖️ Coastal views & leisure','🏨 Overnight stay in Nha Trang'],photos:[IMG.nhatrang,IMG.beach]},
 {date:'12 DEC',title:'Nha Trang at Leisure',lines:['Enjoy a relaxed day exploring Nha Trang’s lovely waterfront and coastal atmosphere.','Take time for beachside walks, local cafés and independent sightseeing at your pace.'],points:['🍳 Breakfast at hotel','🌴 Beachfront and promenade','📸 Scenic coast & city views','🏨 Overnight in Nha Trang'],photos:[IMG.beach]},
 {date:'13 DEC',title:'Departure from Vietnam',lines:['Enjoy breakfast, complete hotel check-out and prepare for your onward flight.','Travel to the departure airport as arranged and take home unforgettable memories.'],points:['🍳 Breakfast & hotel check-out','🧳 Collect luggage','🚘 Departure airport transfer','✈️ Onward journey'],photos:[IMG.checkout,IMG.transfer,IMG.nhatrang]}
];

const HOTEL_STAYS=[
 ['Hanoi','2 nights'],
 ['Da Nang','2 nights'],
 ['Ho Chi Minh City','2 nights'],
 ['Sapa','1 night'],
 ['Ha Long Bay','2 nights'],
 ['Ba Na Hills area','1 night'],
 ['Hoi An','2 nights'],
 ['Nha Trang','2 nights']
];

function header(){
 return `<header class="head">
  <img src="${LOGO}" alt="CityLaila logo">
  <small>WHERE LUXURY MEETS AFFORDABILITY</small>
 </header>`;
}

function footer(n){
 return `<footer class="foot">
  <span>www.citylaila.com</span>
  <span>Page ${String(n).padStart(2,'0')}</span>
 </footer>`;
}

function page(n,content){
 return `<section class="page">
  ${header()}
  <div class="main">${content}</div>
  ${footer(n)}
 </section>`;
}

function carousel(d,i){
 return `<div class="gallery">
  <div class="track" id="g${i}" data-index="0">
   ${d.photos.map((url,j)=>`
    <div class="frame">
     <img src="${url.replaceAll('&','&amp;')}"
          alt="${d.title} – photo ${j+1}" loading="lazy">
    </div>`).join('')}
  </div>
  <button class="arrow prev" aria-label="Previous photo"
    onclick="move(${i},-1)">❮</button>
  <button class="arrow next" aria-label="Next photo"
    onclick="move(${i},1)">❯</button>
  <span class="count" id="c${i}">1 / ${d.photos.length}</span>
 </div>`;
}

function dayCard(d,i){
 return `<article class="card">
  <div class="copy">
   <span class="date">DAY ${String(i+1).padStart(2,'0')} • ${d.date}</span>
   <h3>${d.title}</h3>
   <p class="desc">
    <span>${d.lines[0]}</span>
    <span>${d.lines[1]}</span>
   </p>
   <ul class="points">
    ${d.points.map(p=>`<li>${p}</li>`).join('')}
   </ul>
  </div>
  ${carousel(d,i)}
 </article>`;
}

/* PAGE 1 — COVER AND DAYS 1–3 */

const hero=`
<section class="hero">
 <div>
  <small>VIETNAM PRIVATE HOLIDAY • 14 NIGHTS / 15 DAYS</small>
  <h1>🇻🇳 The Ultimate Vietnam Experience</h1>
  <p>
   Hanoi • Ha Long Bay • Da Nang • Hoi An • Sapa • Nha Trang
   <br>29 November – 13 December 2026
  </p>
 </div>
 <div class="facts">
  <div>👤 Mr. Ayman Yousif</div>
  <div>👥 2 Adults</div>
  <div class="wide">🌏 Eight beautiful destination stays</div>
  <div class="wide">Lead ID-0198</div>
 </div>
</section>`;

let pages=[];

const headings=[
 '',
 'Scenery, Heritage & Saigon',
 'Sapa and Ha Long Bay',
 'Golden Bridge & Hoi An',
 'Nha Trang & Farewell'
];

/* PAGES 1–5 — THREE DAYS PER PAGE */

for(let p=0;p<5;p++){
 const content=
  (p===0
   ? hero
   : `<h2 class="heading">${headings[p]}
      <em>• Days ${p*3+1}–${p*3+3}</em></h2>`)
  + `<div class="cards">
     ${DAYS.slice(p*3,p*3+3)
       .map((d,j)=>dayCard(d,p*3+j)).join('')}
     </div>`;

 pages.push(page(p+1,content));
}

/* PAGE 6 — PACKAGE COST AND STAY PLAN */

const p6=`
<h2 class="heading">
 Your Vietnam Holiday <em>• Package Summary</em>
</h2>

<div class="price">
 <div class="total">
  <small>GRAND TOTAL PACKAGE COST • 2 ADULTS</small>
  <strong>₹1,86,937</strong>
  <span>15 Days / 14 Nights • Vietnam</span>
 </div>

 <div class="summ">
  <div>👤 Mr. Ayman Yousif</div>
  <div>👥 2 Adults</div>
  <div>📆 29 Nov – 13 Dec 2026</div>
  <div>🏨 Eight destination stays</div>
 </div>
</div>

<h2 class="heading" style="font-size:15px;margin:0 0 7px">
 🏨 Accommodation Plan <em>• 14 Nights</em>
</h2>

<div class="split">
 ${HOTEL_STAYS.map(([name,n])=>`
  <div class="stay">
   <b>${name}</b>
   <span>${n}</span>
  </div>`).join('')}
</div>

<div class="summary-panels">
 <div class="panel">
  <h4>✅ Your Holiday Highlights</h4>
  <div class="gridpoints">
   <div>🏨 Fourteen hotel nights across the itinerary</div>
   <div>🍳 Hotel breakfasts as listed</div>
   <div>🚢 Ha Long Bay cruise with buffet lunch</div>
   <div>🌉 Golden Bridge, Coconut Forest & Hoi An visits</div>
   <div>🏔️ Sapa, Cat Cat Village & Nha Trang leisure</div>
   <div>🚘 Airport transfers and touring as detailed</div>
  </div>
 </div>

 <div class="panel right">
  <h4>📋 Travel & Booking Information</h4>
  <div class="gridpoints">
   <div>✈️ Flight sectors and timings to be confirmed</div>
   <div>🏨 Exact hotels and room categories on booking</div>
   <div>🗺️ Day 5 excursion option to be finalized</div>
   <div>🚡 Ba Na Hills visits follow confirmed programme</div>
   <div>🛬 Departure airport per onward flight details</div>
   <div>🎟️ Only expressly confirmed entry tickets included</div>
  </div>
 </div>
</div>

<div class="scenic">
 <figure>
  <img src="${IMG.halong}" alt="Ha Long Bay">
  <figcaption>🚢 Ha Long Bay</figcaption>
 </figure>
 <figure>
  <img src="${IMG.sapa}" alt="Sapa Mountains">
  <figcaption>🏔️ Sapa</figcaption>
 </figure>
 <figure>
  <img src="${IMG.nhatrang}" alt="Nha Trang">
  <figcaption>🏖️ Nha Trang</figcaption>
 </figure>
</div>`;

pages.push(page(6,p6));

/* RENDER ALL SIX PAGES */

document.getElementById('pages').innerHTML=pages.join('');

/* WORKING IMAGE CAROUSEL CONTROLS */

function move(i,delta){
 const t=document.getElementById('g'+i);
 if(!t)return;

 const n=t.children.length;
 if(!n)return;

 const k=(Number(t.dataset.index||0)+delta+n)%n;

 t.dataset.index=String(k);
 t.style.transform=`translateX(-${k*100}%)`;

 document.getElementById('c'+i).textContent=
  `${k+1} / ${n}`;
}
</script>
</body>
</html>
