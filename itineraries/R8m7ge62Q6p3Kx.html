<meta name="description" content="Georgia holiday for Hamza, 14–21 November 2026. Tbilisi 5 nights, Batumi 2 nights, 2 adults, one child and one infant.">

<style>
:root{
  --navy:#0b1d36;
  --blue:#0869bf;
  --orange:#f36c19;
  --line:#dce5f0;
  --light:#f7f9fc;
  --ink:#2e4158;
}

*{box-sizing:border-box}
html,body{margin:0}

body{
  padding:12px 0;
  background:#edf2f8;
  color:var(--ink);
  font-family:Arial,'Segoe UI Emoji',
    'Apple Color Emoji',sans-serif;
}

/* A4 LANDSCAPE */

.page{
  width:297mm;
  height:210mm;
  margin:0 auto 16px;
  padding:16px 30px 42px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  background:white;
  break-after:page;
  page-break-after:always;
  box-shadow:0 5px 18px #081d3616;
}

/* HEADER & FOOTER */

.head{
  height:41px;
  flex:0 0 41px;
  margin-bottom:10px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.head img{
  height:35px;
  max-width:146px;
  object-fit:contain;
}

.head span{
  color:#7889a0;
  letter-spacing:1px;
  font-size:10px;
  font-weight:800;
}

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
}

.foot{
  height:33px;
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:var(--light);
  border-top:1px solid var(--line);
  padding:0 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#73849a;
  font-size:10px;
  font-weight:800;
}

.heading{
  font-size:22px;
  line-height:1.15;
  color:var(--navy);
  font-weight:900;
  margin:0 0 10px;
}

.heading em{
  color:var(--blue);
  font-style:normal;
}

/* PREMIUM COVER */

.hero{
  flex:0 0 113px;
  margin-bottom:10px;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:12px;
  align-items:center;
  border-radius:13px;
  padding:14px 20px;
  color:#fff;

  background:
    linear-gradient(110deg,#071a33ee,#123b65c4),
    url('https://images.trvl-media.com/place/6108462/67b224c1-3d2a-47c8-9f38-bfdbae2492fd.jpg')
    center/cover;
}

.hero small{
  font-size:9.5px;
  letter-spacing:1.2px;
  font-weight:900;
  color:#ffc88b;
}

.hero h1{
  font-size:27px;
  line-height:1.08;
  font-weight:900;
  margin:5px 0;
}

.hero p{
  font-size:11px;
  line-height:1.35;
  margin:0;
  font-weight:750;
}

.facts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.facts div{
  border:1px solid #ffffff50;
  background:#071d39c7;
  border-radius:7px;
  padding:8px;
  font-size:10px;
  line-height:1.23;
  font-weight:800;
}

.facts .wide{
  grid-column:1/-1;
}

/* DAY CARDS */

.days{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:10px;
}

.daycard{
  min-height:0;
  display:grid;
  grid-template-columns:1.06fr .94fr;
  gap:11px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  background:#fff;
  box-shadow:0 2px 10px #071b320a;
}

.copy{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:flex-start;
}

.tag{
  background:var(--orange);
  border-radius:5px;
  color:white;
  font-weight:900;
  font-size:10px;
  padding:5px 9px;
}

.copy h3{
  color:var(--navy);
  font-size:17.5px;
  line-height:1.16;
  margin:6px 0;
  font-weight:900;
}

/* EXACTLY TWO DESCRIPTION LINES */

.desc{
  width:100%;
  margin:0 0 8px;
  display:flex;
  flex-direction:column;
  gap:3px;
  color:#536781;
  font-size:11px;
  line-height:1.22;
  font-weight:650;
}

.desc span{
  display:block;
  white-space:nowrap;
}

/* HIGHLIGHTS */

.points{
  width:100%;
  margin:0;
  padding:0;
  list-style:none;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.points li{
  font-size:10.2px;
  line-height:1.23;
  font-weight:740;
  padding:7px;
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--light);
  overflow-wrap:anywhere;
}

/* LARGE FULL-SIZE IMAGE CAROUSELS */

.gallery{
  height:100%;
  width:100%;
  min-height:0;
  position:relative;
  border-radius:10px;
  overflow:hidden;
  background:#0b263e;
}

.track{
  height:100%;
  display:flex;
  transition:transform .32s ease;
}

.frame{
  height:100%;
  min-width:0;
  flex:0 0 100%;
  width:100%;
}

.frame img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

.arrow{
  position:absolute;
  z-index:2;
  top:50%;
  transform:translateY(-50%);
  background:#0b1f38dd;
  border:1px solid #ffffff65;
  color:white;
  border-radius:50%;
  width:31px;
  height:31px;
  cursor:pointer;
  font-size:17px;
}

.prev{left:8px}
.next{right:8px}

.count{
  position:absolute;
  z-index:2;
  right:9px;
  bottom:9px;
  background:#0b1f38ed;
  color:white;
  border-radius:17px;
  padding:5px 9px;
  font-size:10px;
  font-weight:900;
}

/* PAGE 4: COMPACT DETAILS */

.lastdays{
  margin-bottom:8px;
  gap:8px;
}

.lastdays .daycard{
  padding:8px 10px;
}

.lastdays .copy h3{
  font-size:16px;
  margin:5px 0;
}

.lastdays .points li{
  padding:5px 6px;
  font-size:9.7px;
}

.lastdays .desc{
  font-size:10.8px;
  margin-bottom:5px;
}

.lastdays .tag{
  padding:4px 8px;
}

/* HOTEL STAY AND CONDITIONS */

.details{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:.95fr 1.05fr;
  gap:9px;
}

.detail{
  border:1px solid var(--line);
  border-radius:9px;
  padding:8px 10px;
}

.detail h4{
  margin:0 0 5px;
  color:var(--navy);
  font-size:11.5px;
}

.detail.hotels{
  border-top:4px solid #217bc6;
}

.detail.conditions{
  background:#fffdf7;
  border-top:4px solid #d6a238;
}

.nights{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.nights div{
  padding:7px 6px;
  background:var(--light);
  border:1px solid var(--line);
  border-radius:6px;
  font-size:9.5px;
  font-weight:800;
  text-align:center;
}

.nights b{
  display:block;
  color:var(--blue);
  margin-bottom:2px;
}

.rules{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.rules span{
  display:block;
  border:1px solid #efdbb5;
  background:white;
  border-radius:6px;
  padding:6px;
  font-size:9px;
  line-height:1.18;
  font-weight:740;
}

.endnote{
  margin-top:7px;
  border:1px solid #f0d8ac;
  background:#fffaf1;
  border-radius:7px;
  padding:6px 9px;
  font-size:9.2px;
  font-weight:750;
  color:#855b29;
  line-height:1.3;
}

/* PRINT */

@media print{
  @page{
    size:A4 landscape;
    margin:0;
  }

  body{
    padding:0;
    background:white;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  .page{
    margin:0;
    box-shadow:none;
  }

  .arrow{
    display:none;
  }
}
</style>
</head>

/* DATE LABELS */

const dates=[
  '14','15','16','17',
  '18','19','20','21'
];

/* HEADER */

function head(){
  return `
    <header class="head">

      <img src="${LOGO}" alt="CityLaila logo">

      <span>
        WHERE LUXURY MEETS AFFORDABILITY
      </span>

    </header>
  `;
}

/* FOOTER */

function foot(n){
  return `
    <footer class="foot">

      <span>www.citylaila.com</span>

      <span>
        Page ${String(n).padStart(2,'0')}
      </span>

    </footer>
  `;
}

/* PAGE */

function page(n,content){
  return `
    <section class="page">

      ${head()}

      <div class="main">
        ${content}
      </div>

      ${foot(n)}

    </section>
  `;
}

/* DAY CARD WITH IMAGE CAROUSEL */

function card(d,i){

  return `
    <article class="daycard">

      <div class="copy">

        <span class="tag">
          DAY ${i+1} • ${dates[i]} NOV
        </span>

        <h3>${d.title}</h3>

        <p class="desc">
          <span>${d.lines[0]}</span>
          <span>${d.lines[1]}</span>
        </p>

        <ul class="points">

          ${d.points.map(x=>`
            <li>${x}</li>
          `).join('')}

        </ul>

      </div>

      <div class="gallery">

        <div class="track"
             id="g${i}"
             data-index="0">

          ${d.photos.map(([url,alt])=>`

            <div class="frame">

              <img
                src="${url.replaceAll('&','&amp;')}"
                alt="${alt}"
                loading="lazy">

            </div>

          `).join('')}

        </div>

        <button
          class="arrow prev"
          type="button"
          aria-label="Previous photo"
          onclick="move(${i},-1)">❮</button>

        <button
          class="arrow next"
          type="button"
          aria-label="Next photo"
          onclick="move(${i},1)">❯</button>

        <span class="count" id="c${i}">
          1 / ${d.photos.length}
        </span>

      </div>

    </article>
  `;
}

      </div>

  </div>

`;

/* WORKING CAROUSEL CONTROLS */

function move(i,delta){

  const t=document.getElementById('g'+i);

  if(!t)return;

  const n=t.children.length;

  const k=
    (Number(t.dataset.index||0)+delta+n)%n;

  t.dataset.index=String(k);

  t.style.transform=
    `translateX(-${k*100}%)`;

  document.getElementById('c'+i).textContent=
    `${k+1} / ${n}`;

}

</script>

</body>
</html>
