<style>

.logo{max-height:48px;max-width:220px;object-fit:contain}

.footer{position:absolute;bottom:0;left:0;right:0;padding:13px 42px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--b);background:var(--l);font-size:12px;color:#64748b;font-weight:800}

.ov-right{text-align:right;font-size:13px;font-weight:800;color:#24556c}

.nights-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.nav{position:absolute;top:50%;transform:translateY(-50%);background:#0a192fd0;color:white;border:1px solid #ffffff65;border-radius:50%;width:37px;height:37px;font-size:22px;cursor:pointer;z-index:2}
.prev{left:10px}
.next{right:10px}
.count{position:absolute;bottom:12px;right:14px;background:#0a192fdc;color:white;border-radius:14px;padding:7px 11px;font-size:11px;font-weight:800}

.price-total .eyebrow{font-size:15px;color:#cbd5e1;font-weight:900}

.snapshot{background:var(--l);border:1px solid var(--b);border-left:5px solid var(--p);border-radius:16px;padding:23px;display:flex;flex-direction:column;justify-content:center;gap:12px}

.price-note{margin-top:14px;background:#fff7ed;border:1px solid #fbd38d;border-radius:10px;padding:12px 15px;font-size:12.5px;color:#9c4221;font-weight:750;line-height:1.5}

.global-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;flex:1;min-height:0}
.global-cities{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:11px}
.city{position:relative;isolation:isolate;overflow:hidden;background-color:#163458;background-size:cover;background-position:center;border-radius:13px;color:white;padding:16px;display:flex;justify-content:flex-end;flex-direction:column}
.city:before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(#09193244,#091932dd)}
.city b,.city small{position:relative;z-index:1}
.city b{font-size:20px}
.city small{font-size:11px;font-weight:750;margin-top:8px;color:#e2e8f0}
.city:nth-child(1){background-image:url('https://shamshad656.github.io/citylaila-itineraries/images/countries/dubai.jpg')}
.city:nth-child(2){background-image:url('https://media.assettype.com/outlooktraveller/2024-07/34203ad1-fd27-4b76-b45b-ef066154f574/Ras%20Al%20Khaimah?w=1200&auto=format%2Ccompress&fit=max&format=webp&dpr=1.0')}
.city:nth-child(3){background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Egypt%2C%20Alexandria%2C%20The%20Corniche%20of%20Alexandria.jpg')}
.city:nth-child(4){background-image:url('https://ayxhtlzyhpsjykxxnqqh.supabase.co/storage/v1/object/public/area_images/hsr-layout-bangalore/image-5.jpg')}
.city:nth-child(5){background-image:url('https://shamshad656.github.io/citylaila-itineraries/images/countries/singapore.webp')}
.city:nth-child(6){background-image:url('https://shamshad656.github.io/citylaila-itineraries/images/countries/global.avif')}
.contactbox{background:var(--d);color:white;border-radius:14px;padding:22px;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.contactbox b{color:#ffac65}
.contactbox strong{font-size:17px}
.features{display:flex;justify-content:space-around;background:var(--l);border:1px solid var(--b);border-radius:11px;padding:13px;margin-top:15px;font-size:12px;font-weight:800;color:#294663}

@page{size:A4 landscape;margin:0}
@media print{
html,body{background:white;margin:0;padding:0;print-color-adjust:exact;-webkit-print-color-adjust:exact}

.city{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const root=document.getElementById('pages');
let pageNumber=0;

function header(){
return `<header class="header">
<img class="logo" src="${LOGO_URL}" alt="CityLaila">
<div class="tagline">WHERE LUXURY MEETS AFFORDABILITY</div>
</header>`;
}
function footer(n){
return `<footer class="footer">
<div class="contacts">
<span>📞 +971 55 536 5508</span>
<span>✉️ info@citylaila.com</span>
</div>
<span>Page ${String(n).padStart(2,'0')}</span>
</footer>`;
}
function addPage(html,cls=''){
pageNumber++;
root.insertAdjacentHTML('beforeend',
`<section class="slide ${cls}">
${cls==='cover'?'':header()}
<div class="content">${html}</div>
${footer(pageNumber)}
</section>`);
}
function photo(url,alt){
return `<img src="${esc(url)}" alt="${esc(alt)}" loading="eager">`;
}
function activityEmoji(label,index){
const a=label.toLowerCase();
if(/breakfast/.test(a))return '🍳';
if(/international airport|airport|arrival/.test(a))return '🛬';
if(/departure|onward flight/.test(a))return '✈️';
if(/check.out|check-out|check out/.test(a))return '🧳';
if(/hotel|overnight/.test(a))return '🏨';
if(/driver|transfer|mini van|transport/.test(a))return '🚐';
if(/4x4|4×4|jeep/.test(a))return '🚙';
if(/cable car/.test(a))return '🚠';
if(/old baths|sulfur|abanotubani/.test(a))return '♨️';
if(/narikala|castle|fortress/.test(a))return '🏰';
if(/peace bridge|bridge/.test(a))return '🌉';
if(/clock/.test(a))return '🕰️';
if(/reservoir|jinvali|zhinvali|lake/.test(a))return '🏞️';
if(/river|aragvi/.test(a))return '🌊';
if(/monastery|cathedral|church|sioni|anchiskhati|metekhi|sameba|svetitskhoveli|jvari|gergeti/.test(a))return '⛪';
if(/kazbegi|gudauri|mountain|caucasus|panorama|friendship|viewpoint/.test(a))return '🏔️';
if(/shardeni|street|square|tbilisi|meidani/.test(a))return '🏙️';
return ['🛬','🏙️','🏔️','⛪','🕍','✈️'][index]||'📍';
}

/* PAGE 1 — COVER */
addPage(`

<div class="cover-sub">Tbilisi • Gudauri • Kazbegi • Mtskheta</div>
<div class="cover-tags">

<div class="cover-meta">

<div><small>Land Package</small><strong>AED 2,799 Total</strong></div>
</div>

/* IMAGE CAROUSEL */
document.querySelectorAll('.photo-box').forEach(box=>{
const track=box.querySelector('.photo-track');
const imgs=[...track.querySelectorAll('img')];
let n=0;

function update(){
track.style.transform=`translateX(-${n*100}%)`;
box.querySelector('.count').textContent=`${n+1} / ${imgs.length}`;
box.querySelector('.photocap').textContent=imgs[n].alt;
}
box.querySelector('.prev').addEventListener('click',()=>{
n=(n-1+imgs.length)%imgs.length;
update();
});
box.querySelector('.next').addEventListener('click',()=>{
n=(n+1)%imgs.length;
update();
});
});
</script>
