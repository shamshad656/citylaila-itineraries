.next {

.arrow:hover {

/* =====================================================
   FUNCTION: SAFE HTML
===================================================== */

function esc(value) {
  return String(value).replace(/[&<>"']/g,ch=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[ch]));
}

/* =====================================================
   FUNCTION: CAROUSEL
   Image arrays automatically control all slides,
   captions, navigation and counters.
===================================================== */

function gallery(day,index) {
  const images = day.images;
  const single = images.length <= 1;

  return `
    <div class="gallery ${single?"single":""}">

      <div class="track"
           id="track-${index}"
           data-index="0">

        ${images.map(photo=>`
          <div class="frame">

            <img src="${esc(photo.url)}"
                 alt="${esc(photo.caption)}"
                 loading="eager">

          </div>
        `).join("")}

      </div>

      ${single?"":`

        <button class="arrow prev"
                type="button"
                onclick="moveSlide(${index},-1)"
                aria-label="Previous image">
          ❮
        </button>

        <button class="arrow next"
                type="button"
                onclick="moveSlide(${index},1)"
                aria-label="Next image">
          ❯
        </button>

      `}

      <span class="caption" id="caption-${index}">
        ${esc(images[0]?.caption || "")}
      </span>

      <span class="print-caption">
        ${esc(images[0]?.caption || "")}
      </span>

      <span class="count" id="counter-${index}">
        1 / ${images.length}
      </span>

    </div>
  `;
}

/* =====================================================
   FUNCTION: CAROUSEL NAVIGATION
===================================================== */

function moveSlide(index,direction) {
  const track = document.getElementById(`track-${index}`);

  if(!track) return;

  const images = DAYS[index].images;
  const total = images.length;

  if(total <= 1) return;

  const current = Number(track.dataset.index || 0);
  const next = (current + direction + total) % total;

  track.dataset.index = String(next);
  track.style.transform = `translateX(-${next*100}%)`;

  document.getElementById(`caption-${index}`).textContent =
    images[next].caption;

  document.getElementById(`counter-${index}`).textContent =
    `${next+1} / ${total}`;
}

  `;
}
