<style>
:root{
  --navy:#0b1e38;
  --blue:#0066c4;
  --orange:#f46a14;
  --line:#dfe7f0;
  --light:#f6f9fc;
  --ink:#243951;
}
*{box-sizing:border-box}
html,body{margin:0}

body{
  padding:12px 0;
  background:#edf2f8;
  color:var(--ink);
  font-family:Arial,'Segoe UI Emoji','Apple Color Emoji',sans-serif;
}

.page{
  width:297mm;
  height:210mm;
  margin:0 auto 16px;
  padding:18px 31px 43px;
  background:white;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
  break-after:page;
  page-break-after:always;
  box-shadow:0 4px 16px #10203519;
}

.hd{
  height:42px;
  flex:0 0 42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  margin-bottom:9px;
}
.hd img{
  max-height:37px;
  max-width:145px;
  object-fit:contain;
}
.hd span{
  font-size:10.5px;
  letter-spacing:1px;
  color:#708198;
  font-weight:800;
}
.main{
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:0;
  justify-content:flex-start;
}
.ft{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:34px;
  background:var(--light);
  border-top:1px solid var(--line);
  padding:0 31px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:10px;
  font-weight:800;
  color:#6c7f96;
}

/* COVER */

.hero{
  flex:0 0 105px;
  height:105px;
  border-radius:13px;
  display:grid;
  grid-template-columns:1.24fr .76fr;
  align-items:center;
  gap:15px;
  padding:14px 21px;
  margin-bottom:9px;
  color:white;
  background:
    linear-gradient(105deg,#071e3bed,#1c5174b2),
    url('https://thebalisun.com/wp-content/uploads/2024/08/Preservation-Efforts-To-Balis-Uluwatu-Temple-Will-Encourage-More-Visits.jpg')
    center/cover;
}
.hero small{
  font-size:10px;
  letter-spacing:1px;
  color:#ffd080;
  font-weight:900;
}
.hero h1{
  font-size:29px;
  line-height:1.1;
  margin:4px 0 5px;
  font-weight:900;
}
.hero p{
  font-size:12px;
  font-weight:700;
  margin:0;
}
.hero-facts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.hero-facts div{
  padding:8px;
  background:#071b36bd;
  border-radius:8px;
  border:1px solid #ffffff48;
  font-size:10.6px;
  font-weight:800;
}
.hero-facts .wide{grid-column:1/-1}

/* DAY CARDS */

.h{
  font-size:22px;
  line-height:1.15;
  margin:0 0 9px;
  font-weight:900;
  color:var(--navy);
}
.h em{
  font-style:normal;
  color:var(--blue);
}
.daywrap{
  display:grid;
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:9px;
  flex:1;
  min-height:0;
}
.daywrap.three{
  grid-template-rows:repeat(3,minmax(0,1fr));
}
.day{
  border:1px solid var(--line);
  border-radius:12px;
  background:white;
  min-height:0;
  display:grid;
  grid-template-columns:1.07fr .93fr;
  gap:12px;
  padding:10px;
  box-shadow:0 2px 11px #10203509;
}
.copy{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:flex-start;
  min-width:0;
  min-height:0;
}
.tag{
  background:var(--orange);
  color:white;
  border-radius:5px;
  font-size:10px;
  padding:5px 9px;
  font-weight:900;
}
.copy h3{
  font-size:18px;
  font-weight:900;
  line-height:1.13;
  color:var(--navy);
  margin:7px 0 5px;
}

/* EXACTLY TWO FULL DESCRIPTION LINES */

.desc{
  font-size:12.6px;
  line-height:1.24;
  font-weight:650;
  color:#53637c;
  display:flex;
  flex-direction:column;
  gap:3px;
  margin:0 0 8px;
  width:100%;
}
.desc span{
  display:block;
  white-space:nowrap;
  max-width:100%;
}

.points{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  list-style:none;
  margin:0;
  padding:0;
}
.points li{
  border:1px solid var(--line);
  background:var(--light);
  border-radius:6px;
  padding:8px;
  font-size:11px;
  line-height:1.26;
  font-weight:750;
}

/* FULL SIZE IMAGE CAROUSELS */

.gallery{
  position:relative;
  min-height:0;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:9px;
  background:var(--navy);
}
.track{
  width:100%;
  height:100%;
  display:flex;
  transition:transform .3s ease;
}
.frame{
  min-width:0;
  flex:0 0 100%;
  width:100%;
  height:100%;
}
.frame img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center;
}
.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:30px;
  height:30px;
  border-radius:50%;
  border:1px solid #ffffff66;
  background:#071d39d5;
  color:white;
  cursor:pointer;
  z-index:2;
  font-weight:900;
  font-size:16px;
}
.prev{left:8px}
.next{right:8px}
.count{
  position:absolute;
  bottom:9px;
  right:10px;
  background:#071d39e8;
  color:white;
  border-radius:18px;
  padding:5px 9px;
  font-size:10px;
  font-weight:900;
  z-index:2;
}

/* PAGE 2 COMPACT CARDS */

.three .day{
  grid-template-columns:1.13fr .87fr;
  gap:9px;
  padding:8px;
}
.three .copy h3{
  font-size:15px;
  margin:5px 0 4px;
}
.three .tag{
  font-size:9px;
  padding:4px 8px;
}
.three .desc{
  font-size:12.3px;
  gap:2px;
  margin-bottom:6px;
}
.three .points{gap:4px}
.three .points li{
  padding:5px 7px;
  font-size:9.7px;
  line-height:1.2;
}

/* PAGE 3 SPACE OPTIMIZATION */

.finaldays{
  flex:1;
  min-height:0;
  margin-bottom:8px;
}
.finaldays .day{
  padding:8px;
  gap:11px;
}
.finaldays .copy h3{
  font-size:16px;
  margin:5px 0 4px;
}
.finaldays .desc{
  font-size:12.2px;
  gap:2px;
  margin-bottom:6px;
}
.finaldays .points{gap:4px}
.finaldays .points li{
  font-size:9.8px;
  padding:5px 7px;
}
.finaldays .tag{
  font-size:9px;
  padding:4px 8px;
}

/* PACKAGE COST */

.price{
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:10px;
  flex:0 0 92px;
  height:92px;
  margin-bottom:8px;
}
.total{
  background:linear-gradient(130deg,#0b1d38,#204789);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  color:white;
}
.total small{
  font-weight:900;
  font-size:10px;
  letter-spacing:1px;
  color:#ffcd39;
}
.total strong{
  font-size:31px;
  margin:3px 0;
}
.total span{
  color:#ffed84;
  font-size:11px;
  font-weight:800;
}
.summary{
  background:var(--light);
  border:1px solid var(--line);
  border-left:5px solid var(--blue);
  border-radius:10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  align-content:center;
  padding:9px;
}
.summary div{
  border:1px solid var(--line);
  background:white;
  border-radius:6px;
  padding:7px;
  font-size:10px;
  font-weight:800;
}

/* COMPACT INCLUSIONS / EXCLUSIONS */

.coverage{
  display:grid;
  grid-template-columns:1.07fr .93fr;
  gap:10px;
  align-items:start;
  flex:0 0 auto;
}
.panel{
  border:1px solid var(--line);
  border-radius:9px;
  padding:8px 10px;
}
.panel.y{
  border-top:4px solid #34a475;
}
.panel.n{
  border-top:4px solid #dbab38;
  background:#fffdf8;
}
.panel h4{
  font-size:12px;
  color:var(--navy);
  font-weight:900;
  margin:0 0 5px;
}
.cells{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
}
.cells div{
  background:var(--light);
  border:1px solid var(--line);
  border-radius:5px;
  font-size:9.5px;
  line-height:1.22;
  font-weight:750;
  padding:5px 7px;
}
.n .cells div{
  background:white;
  border-color:#eedfb6;
}
.note{
  margin-top:7px;
  border-radius:7px;
  background:#fff8ed;
  border:1px solid #f4d19b;
  color:#965516;
  padding:7px 9px;
  font-size:9.1px;
  line-height:1.28;
  font-weight:700;

/* A4 PRINT */

@media print{
  @page{
    size:A4 landscape;
    margin:0;
  }
  body{
    padding:0;
    background:white;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .page{
    margin:0;
    box-shadow:none;
  }
  .arrow{display:none}
}
</style>
</head>

/* HEADER & FOOTER */

function header(){
  return `
    <header class="hd">
      <img src="${BASE}logo.png" alt="CityLaila">
      <span>WHERE LUXURY MEETS AFFORDABILITY</span>
    </header>
  `;
}

function footer(n){
  return `
    <footer class="ft">
      <span>www.citylaila.com</span>
      <span>Page ${String(n).padStart(2,'0')}</span>
    </footer>
  `;
}

function page(n,body){
  return `
    <section class="page">
      ${header()}
      <div class="main">${body}</div>
      ${footer(n)}
    </section>
  `;
}

/* DAY CARD & IMAGE CAROUSEL */

function card(d,i){
  return `
    <article class="day">

      <div class="copy">

        <span class="tag">DAY ${i+1}</span>
        <h3>${d.title}</h3>

        <div class="desc">
          <span>${d.lines[0]}</span>
          <span>${d.lines[1]}</span>
        </div>

        <ul class="points">
          ${d.bullets.map(x=>`<li>${x}</li>`).join('')}
        </ul>

      </div>

      <div class="gallery">

        <div class="track" id="g${i}" data-index="0">
          ${d.photos.map(([url,alt])=>`
            <div class="frame">
              <img
                src="${url.replaceAll('&','&amp;')}"
                alt="${alt}">
            </div>
          `).join('')}
        </div>

        <button
          type="button"
          class="arrow prev"
          aria-label="Previous image"
          onclick="slide(${i},-1)">❮</button>

        <button
          type="button"
          class="arrow next"
          aria-label="Next image"
          onclick="slide(${i},1)">❯</button>

        <span class="count" id="count${i}">
          1 / ${d.photos.length}
        </span>

      </div>

    </article>
  `;
}

/* RENDER EXACTLY THREE PAGES */

document.getElementById('pages').innerHTML=
  page(1,p1)+page(2,p2)+page(3,p3);

/* WORKING CAROUSEL */

function slide(i,d){

  const t=document.getElementById('g'+i);
  if(!t)return;

  const n=t.children.length;
  const k=(Number(t.dataset.index||0)+d+n)%n;

  t.dataset.index=k;
  t.style.transform=`translateX(-${k*100}%)`;

  document.getElementById('count'+i).textContent=
    `${k+1} / ${n}`;
}
</script>
