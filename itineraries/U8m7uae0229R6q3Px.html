/* ================================================
   FUNCTION: DYNAMIC CAROUSEL
================================================ */

function gallery(day,index){
  const images=day.images||[];

  if(!images.length){
    return `<div class="gallery"></div>`;
  }

  const frames=images.map((image,i)=>`
    <div class="gallery-frame">
      <img
        src="${esc(image.url)}"
        alt="${esc(image.caption)}"
        loading="${i===0?"eager":"lazy"}">

      <span class="gallery-caption">
        ${esc(image.caption)}
      </span>
    </div>
  `).join("");

  return `
    <div class="gallery">
      <div class="gallery-track"
        id="gallery-${index}"
        data-index="0">
        ${frames}
      </div>

      ${images.length>1?`
        <button type="button"
          class="gallery-btn prev"
          onclick="moveGallery(${index},-1)"
          aria-label="Previous photo">❮</button>

        <button type="button"
          class="gallery-btn next"
          onclick="moveGallery(${index},1)"
          aria-label="Next photo">❯</button>

        <span class="gallery-counter"
          id="counter-${index}">
          1 / ${images.length}
        </span>
      `:""}
    </div>`;
}

function moveGallery(index,direction){
  const track=document.getElementById(`gallery-${index}`);
  if(!track)return;

  const frames=track.querySelectorAll(".gallery-frame");
  const count=frames.length;

  if(count<=1)return;

  let current=Number(track.dataset.index||0);
  current=(current+direction+count)%count;

  track.dataset.index=current;
  track.style.transform=`translateX(-${current*100}%)`;

  const counter=document.getElementById(`counter-${index}`);
  if(counter){
    counter.textContent=`${current+1} / ${count}`;
  }
}
