<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>CityLaila | Georgia Holiday Escape – 3N/4D | Lead ID-0207</title>
<meta property="og:title" content="CityLaila | Georgia Holiday Escape – 3N/4D | Lead ID-0207">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A192F;--blue:#0066cc;--orange:#ff6600;--paper:#f8fafc;--line:#dfe7f0;--ink:#293e53;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#edf2f7;padding:14px 0;font-family:Montserrat,'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',Arial,sans-serif;color:var(--ink)}
.page{
  position:relative;width:297mm;height:210mm;margin:0 auto 16px;padding:18px 31px 47px;
  display:flex;flex-direction:column;background:#fff;overflow:hidden;box-shadow:0 4px 18px #0a192f18;
  break-after:page;page-break-after:always
}
.header{
  height:43px;flex:0 0 43px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);margin-bottom:11px
}
.header img{max-width:164px;max-height:39px;object-fit:contain}
.tagline{font-size:10.5px;color:#718096;letter-spacing:1.05px;font-weight:850}
.content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start}
.footer{
  position:absolute;bottom:0;left:0;right:0;height:35px;background:var(--paper);border-top:1px solid var(--line);
  padding:0 31px;display:flex;align-items:center;justify-content:space-between;color:#718096;font-size:10.5px;font-weight:800
}
.heading{font-size:24px;line-height:1.18;font-weight:900;color:var(--navy);margin:0 0 9px}
.heading em{font-style:normal;color:var(--blue)}
.sub{font-size:12px;color:#60758c;font-weight:700;line-height:1.45;margin:0 0 12px}

/* COVER */
.hero{
  height:112px;flex:0 0 112px;border-radius:14px;margin-bottom:12px;padding:14px 19px;
  display:grid;grid-template-columns:1.24fr .76fr;gap:13px;align-items:center;
  background:linear-gradient(100deg,#0a192fe8,#174269b8),url('https://packageimage.s3.ap-south-1.amazonaws.com/Georgia/image_1752671312.jpg') center/cover;
  color:#fff
}
.hero small{font-size:9.6px;letter-spacing:1.2px;color:#ffcc88;font-weight:900}
.hero h1{font-size:27px;line-height:1.12;margin:5px 0 6px}
.hero p{font-size:11px;line-height:1.36;margin:0;font-weight:750}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.facts div{
  background:#061b36b9;border:1px solid #ffffff4a;border-radius:7px;padding:7px 9px;
  font-size:10px;line-height:1.3;font-weight:830
}
.facts .wide{grid-column:1/-1}

/* DAY CARDS */
.cards{flex:1;min-height:0;display:grid;grid-template-rows:repeat(2,minmax(0,1fr));gap:11px}
.card{
  min-height:0;display:grid;grid-template-columns:1.08fr .92fr;gap:12px;padding:11px;
  border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 2px 10px #0a192f08
}
.copy{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.daytag{display:inline-block;background:var(--orange);color:#fff;border-radius:5px;padding:5px 10px;font-size:10.5px;font-weight:900}
.copy h3{font-size:17.3px;line-height:1.16;margin:6px 0 5px;color:var(--navy);font-weight:900}
.desc{margin:0 0 8px;font-size:11.2px;line-height:1.33;color:#52677e;font-weight:680;overflow-wrap:anywhere;white-space:normal}
.points{list-style:none;margin:0;padding:0;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.points li{
  border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:7px 8px;
  font-size:10.55px;line-height:1.3;font-weight:750;overflow-wrap:anywhere
}
.gallery{position:relative;width:100%;height:100%;min-height:0;overflow:hidden;background:var(--navy);border-radius:10px}
.track{display:flex;width:100%;height:100%;transition:transform .3s ease}
.frame{flex:0 0 100%;width:100%;height:100%}
.frame img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.arrow{
  position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;
  border:1px solid #ffffff74;background:#0a192fdc;color:#fff;font-size:16px;font-weight:900;cursor:pointer;z-index:2
}
.prev{left:7px}.next{right:7px}
.count{
  position:absolute;bottom:9px;right:9px;border-radius:16px;background:#0a192fe8;padding:5px 10px;
  color:#fff;font-size:10.5px;font-weight:900;z-index:2
}
.cap{
  position:absolute;bottom:9px;left:9px;max-width:72%;border-radius:14px;background:#0a192fe8;padding:5px 10px;
  color:#fff;font-size:10px;font-weight:800;z-index:2;text-shadow:0 1px 1px rgba(0,0,0,.35)
}

/* FINAL PAGE */
.pricegrid{display:grid;grid-template-columns:1.04fr .96fr;gap:14px;min-height:148px;margin-bottom:13px}
.total{
  background:linear-gradient(135deg,var(--navy),#1c4789);border-radius:14px;color:white;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px
}
.total small{color:#ffd071;font-size:11px;letter-spacing:1px;font-weight:900}
.total strong{font-size:39px;margin:7px 0 3px;line-height:1.2}
.total span{font-size:13px;font-weight:850;color:#ffefb3}
.snapshot{
  border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;background:var(--paper);
  padding:11px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:center
}
.snapshot div{
  padding:10px;background:white;border:1px solid var(--line);border-radius:8px;font-size:11.4px;font-weight:780;line-height:1.35
}
.coverage{display:grid;grid-template-columns:1.1fr .9fr;gap:13px;min-height:0}
.panel{padding:14px;border:1px solid var(--line);border-radius:12px;background:white}
.panel.good{border-top:4px solid #38a169}
.panel.warn{border-top:4px solid #d6a138;background:#fffdf7}
.panel h4{margin:0 0 11px;font-size:15px;font-weight:900;color:var(--navy)}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cells div{
  border-radius:7px;border:1px solid var(--line);background:var(--paper);padding:9px;
  font-size:11.05px;font-weight:730;line-height:1.32;overflow-wrap:anywhere
}
.warn .cells div{background:#fff;border-color:#f1e0ba}
.note{
  margin-top:12px;border:1px solid #f1c987;border-radius:9px;padding:12px 13px;background:#fff8ed;
  font-size:11.2px;color:#88571c;font-weight:740;line-height:1.42
}
.last-contact{
  margin-top:auto;padding:12px 15px;background:var(--navy);color:#fff;border-radius:10px;
  display:flex;justify-content:space-around;gap:12px;font-size:11px;font-weight:850
}

/* PRINT FIX */
@page{size:A4 landscape;margin:0}
@media print{
  html,body{
    width:297mm!important;min-width:297mm!important;max-width:297mm!important;
    margin:0!important;padding:0!important;background:#fff!important;overflow:visible!important;
    print-color-adjust:exact;-webkit-print-color-adjust:exact
  }
  #pages{width:297mm!important;max-width:297mm!important;overflow:visible!important}
  .page{
    width:297mm!important;min-width:297mm!important;max-width:297mm!important;
    height:210mm!important;min-height:210mm!important;max-height:210mm!important;
    margin:0!important;box-shadow:none!important;break-inside:avoid-page!important;
    page-break-inside:avoid!important;break-after:page!important;page-break-after:always!important
  }
  .page:last-child{break-after:auto!important;page-break-after:auto!important}
  .gallery,.track{max-width:100%!important;overflow:hidden!important}
  .track{display:block!important;width:100%!important;height:100%!important;transform:none!important;transition:none!important}
  .frame{display:none!important;flex:none!important}
  .frame:first-child{display:block!important;width:100%!important;height:100%!important}
  .frame:first-child img{width:100%!important;height:100%!important;object-fit:cover!important}
  .arrow,.count{display:none!important}
}
</style>
</head>
<body>
<main id="pages"></main>
<script>
const LOGO='https://raw.githubusercontent.com/shamshad656/citylaila-itineraries/main/images/logo.png';

const DAYS=[
{
title:'Arrival in Tbilisi',
desc:'Arrive at Tbilisi International Airport. Meet the English-speaking driver and transfer by Sprinter to the hotel for check-in and rest.',
items:[
'🛬 Tbilisi International Airport arrival',
'🤝 Meet & greet with driver',
'🚌 Sprinter transfer to hotel',
'🏨 Hotel accommodation in Tbilisi'
],
photos:[
['https://eurasianet.org/sites/default/files/styles/article/public/2023-06/tav%20tbilisi%20airport.jpg?h=3f560db1&itok=A_Aetqrf','Tbilisi Airport'],
['https://dynamic-media.tacdn.com/media/photo-o/2e/d3/a7/93/caption.jpg?w=1100&h=800&s=1','Private Transfer'],
['https://images.trvl-media.com/place/6108462/67b224c1-3d2a-47c8-9f38-bfdbae2492fd.jpg','Tbilisi City']
]
},
{
title:'Tbilisi City Tour',
desc:'Discover Tbilisi’s historic and cultural landmarks including the Old Town, iconic churches, the Peace Bridge and Narikala Fortress.',
items:[
'⛪ Metekhi, Anchiskhati, Sioni & Sameba',
'♨️ Old Baths, Meidani Square & Shardeni',
'🌉 Gabriadze Clock Tower & Peace Bridge',
'🏰 Narikala Fortress by cable car'
],
photos:[
['https://commons.wikimedia.org/wiki/Special:FilePath/Narikala%20fortress%20in%20Tbilisi.jpg','Narikala Fortress'],
['https://i.pinimg.com/1200x/82/f5/48/82f548bd38fd4a7b8f48614d85c23f87.jpg','Old Tbilisi'],
['https://georgianjournal.ge/media/images/georgianews/2018/April/society/img_8918.jpg','Historic Tbilisi']
]
},
{
title:'Ananuri, Gudauri & Kazbegi',
desc:'A scenic full-day mountain excursion through the Georgian Military Highway covering Jinvali, Ananuri, Gudauri and Kazbegi with Gergeti.',
items:[
'🏞️ Jinvali Reservoir & Ananuri Castle',
'🌊 Black & White Aragvi viewpoint',
'🏔️ Gudauri Panorama / Friendship Wall',
'⛪ Kazbegi Village & Gergeti by 4x4 Jeep'
],
photos:[
['https://cdn.georgiantravelguide.com/storage/files/ananuris-kompleksi-ananuri-fortress.jpg','Ananuri Fortress'],
['https://i.pinimg.com/736x/d5/0d/d50dd00fc01abf86c4bfa862edfc8bca.jpg','Gudauri Mountains'],
['https://tourguide.ge/wp-content/uploads/2019/03/Seeing-from-Gergeti.jpg','Gergeti Trinity Church']
]
},
{
title:'Departure from Tbilisi',
desc:'After breakfast, complete hotel check-out and proceed by Sprinter transfer to Tbilisi International Airport for departure.',
items:[
'🍳 Breakfast at hotel',
'🧳 Hotel check-out',
'🚌 Airport transfer by Sprinter',
'✈️ Departure from Tbilisi'
],
photos:[
['https://static.toiimg.com/thumb/106057438/Hotel-checkout.jpg?width=1200&height=900','Hotel Checkout'],
['https://dynamic-media.tacdn.com/media/photo-o/2e/d3/a7/93/caption.jpg?w=1100&h=800&s=1','Airport Transfer'],
['https://m.media-amazon.com/images/I/71nXbtmuQlL.jpg','Departure']
]
}
];

function page(n,content){
return `<section class="page">
<header class="header">
<img src="${LOGO}" alt="CityLaila">
<span class="tagline">WHERE LUXURY MEETS AFFORDABILITY</span>
</header>
<div class="content">${content}</div>
<footer class="footer">
<span>www.citylaila.com • info@citylaila.com</span>
<span>Page ${String(n).padStart(2,'0')} / 04</span>
</footer>
</section>`;
}

function card(d,i){
return `<article class="card">
<div class="copy">
<span class="daytag">DAY ${i+1}</span>
<h3>${d.title}</h3>
<p class="desc">${d.desc}</p>
<ul class="points">${d.items.map(x=>`<li>${x}</li>`).join('')}</ul>
</div>
<div class="gallery">
<div class="track" id="g${i}" data-index="0">
${d.photos.map(([url,alt])=>`
<div class="frame">
<img src="${url.replace(/&/g,'&amp;')}" alt="${alt}" loading="eager">
</div>`).join('')}
</div>
<button class="arrow prev" type="button" onclick="move(${i},-1)" aria-label="Previous image">❮</button>
<button class="arrow next" type="button" onclick="move(${i},1)" aria-label="Next image">❯</button>
<span class="cap" id="t${i}">${d.photos[0][1]}</span>
<span class="count" id="c${i}">1 / ${d.photos.length}</span>
</div>
</article>`;
}

const cover=`
<div class="hero">
  <div>
    <small>GEORGIA HOLIDAY PACKAGE • 3 NIGHTS / 4 DAYS</small>
    <h1>🇬🇪 Georgia Holiday Escape</h1>
    <p>24–27 December • Mailene Dimaculangan
    <br>Tbilisi • Gudauri • Kazbegi</p>
  </div>
  <div class="facts">
    <div>👥 15 Adults + 2 Kids</div>
    <div>🧒 Kids: 4Y & 8Y</div>
    <div>🚌 Transport: SPRINTER</div>
    <div>🏨 3N Sole Hotel Tbilisi</div>
    <div class="wide">🍳 BB • Driver (not a guide) • Lead ID-0207</div>
  </div>
</div>

<h2 class="heading">Package Snapshot <em>• Overview</em></h2>
<p class="sub">3 nights in Tbilisi with a scenic Georgia program covering Tbilisi city sights, Ananuri, Gudauri, Kazbegi and Gergeti Trinity Church.</p>

<div class="snapshot" style="margin-top:2px">
  <div>📅 Travel Period<br><b>24/12 – 27/12</b></div>
  <div>🌙 Duration<br><b>3N / 4D</b></div>
  <div>🏨 Stay<br><b>Sole Hotel Tbilisi</b></div>
  <div>🛏️ Room Basis<br><b>Triple Sharing</b></div>
  <div>💵 Cost Per Person<br><b>AED 999</b></div>
  <div>🎟️ Extra Ticket Cost<br><b>AED 75 Per Pax</b></div>
</div>

<div class="note">
<b>Important:</b> Hotel accommodation is for 3 nights on BB basis. Transportation is by <b>SPRINTER</b> with an <b>English-speaking driver (not a guide)</b>. Separate supplement entry ticket cost covers <b>Tbilisi cable car round trip</b> and <b>4x4 Jeep to Gergeti</b>.
</div>
`;

const days12=`
<h2 class="heading">Daily Itinerary <em>• Days 1–2</em></h2>
<p class="sub">Arrival in Tbilisi followed by a full city tour with Old Town and Narikala highlights.</p>
<div class="cards">
${card(DAYS[0],0)}
${card(DAYS[1],1)}
</div>`;

const days34=`
<h2 class="heading">Daily Itinerary <em>• Days 3–4</em></h2>
<p class="sub">Mountain excursion to Kazbegi and Gergeti, followed by departure transfer to the airport.</p>
<div class="cards">
${card(DAYS[2],2)}
${card(DAYS[3],3)}
</div>`;

const inclusions=[
'🏨 3 nights hotel accommodation',
'🍳 Daily breakfast (BB)',
'🏨 3 nights at Sole Hotel Tbilisi',
'🚌 SPRINTER transportation as per program',
'🗣️ English-speaking driver (not a guide)',
'💧 2 water bottles per pax per day',
'🛬 Arrival transfer',
'🛫 Departure transfer',
'🚘 All sightseeing transfers',
'📍 Tbilisi, Gudauri & Kazbegi route'
];

const notes=[
'💵 Cost per person in triple sharing: AED 999',
'🎟️ Extra supplement entry ticket cost: AED 75 per pax',
'🚠 Includes separate cost for Tbilisi cable car 2 ways',
'🚙 Includes separate cost for Gergeti 4x4 Jeep',
'🍽️ Meals other than breakfast are not mentioned',
'🌦️ Mountain sightseeing is subject to weather conditions'
];

const finalPage=`
<h2 class="heading">Price & Coverage <em>• Final Summary</em></h2>

<div class="pricegrid">
  <div class="total">
    <small>COST PER PERSON</small>
    <strong>AED 999</strong>
    <span>Triple Sharing Room</span>
  </div>
  <div class="snapshot">
    <div>👤 Guest<br><b>Mailene Dimaculangan</b></div>
    <div>🆔 Lead ID<br><b>0207</b></div>
    <div>👥 Guests<br><b>15 Adults + 2 Kids</b></div>
    <div>🧒 Kids Ages<br><b>4Y & 8Y</b></div>
    <div>🚌 Vehicle<br><b>SPRINTER</b></div>
    <div>🏨 Stay<br><b>3N Tbilisi</b></div>
  </div>
</div>

<div class="coverage">
  <section class="panel good">
    <h4>✅ Package Inclusions</h4>
    <div class="cells">
      ${inclusions.map(x=>`<div>${x}</div>`).join('')}
    </div>
  </section>

  <section class="panel warn">
    <h4>ℹ️ Clarifications</h4>
    <div class="cells">
      ${notes.map(x=>`<div>${x}</div>`).join('')}
    </div>
  </section>
</div>

<div class="note">
<b>Separate Supplement Cost:</b> Entry tickets for the <b>Tbilisi cable car round trip</b> and <b>Gergeti 4x4 Jeep</b> are charged separately at <b>AED 75 per pax</b>. All services are subject to availability and weather conditions.
</div>

<div class="last-contact">
  <span>🌍 CITYLAILA TRAVEL</span>
  <span>📞 +971 55 536 5508</span>
  <span>✉️ info@citylaila.com</span>
  <span>www.citylaila.com</span>
</div>
`;

document.getElementById('pages').innerHTML=
page(1,cover)+
page(2,days12)+
page(3,days34)+
page(4,finalPage);

function move(i,delta){
  const t=document.getElementById('g'+i);
  if(!t)return;
  const n=t.children.length;
  if(n<2)return;
  const k=(Number(t.dataset.index||0)+delta+n)%n;
  t.dataset.index=String(k);
  t.style.transform=`translateX(-${k*100}%)`;
  document.getElementById('c'+i).textContent=`${k+1} / ${n}`;
  document.getElementById('t'+i).textContent=t.children[k].querySelector('img').alt;
}
</script>
</body>
</html>
