/* IMAGE CAROUSEL */
function gallery(n,imgs){
 return `
 <div class="gallery">
  <div class="track" id="g${n}" data-index="0">
   ${imgs.map(([url,label])=>`
    <div class="frame">
     <img
      src="${url.replace(/&/g,'&amp;')}"
      alt="${label}"
      loading="eager"
      onerror="this.style.visibility='hidden'">
     <div class="caption">${label}</div>
    </div>`).join('')}
  </div>
  ${imgs.length>1?`
   <button type="button" class="arrow prev"
    onclick="move(${n},-1)" aria-label="Previous image">❮</button>
   <button type="button" class="arrow next"
    onclick="move(${n},1)" aria-label="Next image">❯</button>
  `:''}
  <span class="counter" id="c${n}">1 / ${imgs.length}</span>
 </div>`;
}

/* CAROUSEL NAVIGATION */
function move(n,delta){
 const track=document.getElementById('g'+n);
 if(!track)return;

 const count=track.children.length;
 if(count<2)return;

 const next=(Number(track.dataset.index||0)+delta+count)%count;
 track.dataset.index=String(next);
 track.style.transform=`translateX(-${next*100}%)`;

 const counter=document.getElementById('c'+n);
 if(counter){
  counter.textContent=`${next+1} / ${count}`;
 }
}

    ': content exceeds available height'
