function esc(value) {

    "<":"&lt;",
    ">":"&gt;",

/* ======================================================
   FUNCTION: CAROUSEL BUILDER
   Image count/caption generated from day images array.
====================================================== */

function gallery(day,index) {
  const images = day.images;
  const single = images.length <= 1;

  return `
    <div class="gallery ${single?"single":""}">

      <div class="gallery-track"
           id="track-${index}"
           data-index="0">

        ${images.map(image=>`
          <div class="gallery-frame">
            <img
              src="${esc(image.url)}"
              alt="${esc(image.caption)}"
              loading="eager">
          </div>
        `).join("")}
      </div>

      ${single?"":`
        <button
          class="gallery-arrow gallery-prev"
          type="button"
          onclick="moveSlide(${index},-1)"
          aria-label="Previous photo">❮</button>

        <button
          class="gallery-arrow gallery-next"
          type="button"
          onclick="moveSlide(${index},1)"
          aria-label="Next photo">❯</button>
      `}

      <span class="gallery-caption" id="caption-${index}">
        ${esc(images[0]?.caption || "")}
      </span>

      <span class="gallery-counter" id="counter-${index}">
        1 / ${images.length}
      </span>
    </div>
  `;
}

/* ======================================================
   FUNCTION: PREVIOUS / NEXT CAROUSEL
====================================================== */

function moveSlide(index,direction) {
  const track = document.getElementById(`track-${index}`);
  if(!track) return;

  const images = DAYS[index].images;
  const count = images.length;
  if(count <= 1) return;

  const current = Number(track.dataset.index || 0);
  const next = (current + direction + count) % count;

  track.dataset.index = next;
  track.style.transform = `translateX(-${next*100}%)`;

  document.getElementById(`caption-${index}`).textContent =
    images[next].caption;

  document.getElementById(`counter-${index}`).textContent =
    `${next+1} / ${count}`;
}

function dayPage(day,index) {
  return `

      <div class="day-text">

        <span class="day-badge">
          DAY ${index+1} • ${esc(day.date).toUpperCase()}
        </span>

        <h2>${esc(day.title)}</h2>

        <p class="day-description">
          ${esc(day.description)}
        </p>

        <div class="day-highlights">
          <h3>✨ DAY HIGHLIGHTS</h3>

          <ul>
            ${day.points.map(point=>`
              <li>${esc(point)}</li>
            `).join("")}
          </ul>
        </div>

        ${day.note?`
          <div class="day-note">
            📌 ${esc(day.note)}
          </div>
        `:""}

      </div>

      ${gallery(day,index)}

    </div>
  `;
}
