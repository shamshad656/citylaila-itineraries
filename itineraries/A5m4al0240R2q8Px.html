/* =====================================================
   FUNCTION: SAFE HTML
===================================================== */

function esc(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function money(value){
  return Number(value).toLocaleString("en-US");
}

/* =====================================================

===================================================== */

function page(number,content,extraClass=""){

          alt="CityLaila Since 2019">

        <span class="tagline">
          WHERE LUXURY MEETS AFFORDABILITY
        </span>
      </header>

      <div class="content">
        ${content}
      </div>

      <footer class="footer">
        <span>
          www.citylaila.com • info@citylaila.com
        </span>

        <span>
          Page ${String(number).padStart(2,"0")} /
          ${String(TOTAL_PAGES).padStart(2,"0")}
        </span>
      </footer>

    </section>`;
}

/* =====================================================
   FUNCTION: CAROUSEL BUILDER
===================================================== */

function gallery(day,index){
  const images=day.images||[];

  if(!images.length){
    return `<div class="gallery"></div>`;
  }

  const frames=images.map(image=>`
    <div class="frame">

      <img
        src="${esc(image.url)}"
        alt="${esc(image.caption)}"
        loading="eager">

      <span class="caption">
        ${esc(image.caption)}
      </span>

    </div>
  `).join("");

  return `
    <div class="gallery">

      <div
        class="track"
        id="gallery-${index}"
        data-index="0">

        ${frames}

      </div>

      ${images.length>1?`

        <button
          type="button"
          class="arrow prev"
          onclick="moveGallery(${index},-1)"
          aria-label="Previous image">
          ❮
        </button>

        <button
          type="button"
          class="arrow next"
          onclick="moveGallery(${index},1)"
          aria-label="Next image">
          ❯
        </button>

        <span
          class="count"
          id="count-${index}">

          1 / ${images.length}

        </span>

      `:""}

    </div>`;
}

/* =====================================================
   FUNCTION: DAY CARD
===================================================== */

function card(day,index,compact=false){
  return `
    <article class="card">

      <div class="copy">

        <span class="daytag">
          DAY ${index+1} • ${esc(day.date)}
        </span>

        <h3>${esc(day.title)}</h3>

        <p class="desc">
          ${esc(day.description)}
        </p>

        <ul class="points">
          ${day.highlights.map(item=>`
            <li>${esc(item)}</li>
          `).join("")}
        </ul>

        ${compact?"":`

          <div class="stay">

            ${day.stay==="Tour Ends"
              ?"🛫 Tour Ends"
              :"🏨 Overnight: "+esc(day.stay)}

          </div>

        `}

      </div>

      ${gallery(day,index)}

    </article>`;
}

/* =====================================================
   FUNCTION: CAROUSEL NAVIGATION
===================================================== */

function moveGallery(index,direction){
  const track=document.getElementById(
    `gallery-${index}`
  );

  if(!track)return;

  const frames=track.querySelectorAll(".frame");
  const total=frames.length;

  if(total<=1)return;

  const current=Number(
    track.dataset.index||0
  );

  const next=
    (current+direction+total)%total;

  track.dataset.index=String(next);

  track.style.transform=
    `translateX(-${next*100}%)`;

  const counter=document.getElementById(
    `count-${index}`
  );

  if(counter){
    counter.textContent=
      `${next+1} / ${total}`;
  }
}
