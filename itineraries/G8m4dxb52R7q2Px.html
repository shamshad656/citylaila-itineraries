/* ========================================

======================================== */

function carousel(day){

  const items=photos[day];

  return `
    <div class="imgbox">

      <div class="track"
        id="d${day}"
        data-index="0">

        ${items.map(([url,alt])=>`
          <div class="slideimg">
            <img
              src="${url.replaceAll("&","&amp;")}"
              alt="${alt}"
              loading="lazy">
          </div>
        `).join("")}

      </div>

      <button
        class="arrow prev"
        type="button"
        aria-label="Previous image"
        onclick="moveSlide(${day},-1)">❮</button>

      <button
        class="arrow next"
        type="button"
        aria-label="Next image"
        onclick="moveSlide(${day},1)">❯</button>

      <div class="count" id="c${day}">
        1 / ${items.length}
      </div>

    </div>
  `;
}

/* ========================================
   CAROUSEL CONTROLS
======================================== */

function moveSlide(day,delta){

  const track=document.getElementById("d"+day);

  if(!track)return;

  const count=track.querySelectorAll(".slideimg").length;

  if(count<2)return;

  const index=
    (Number(track.dataset.index||0)+delta+count)%count;

  track.dataset.index=String(index);

  track.style.transform=
    "translateX(-"+(index*100)+"%)";

  const counter=document.getElementById("c"+day);

  if(counter){
    counter.textContent=(index+1)+" / "+count;
  }

}
