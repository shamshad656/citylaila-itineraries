/* FUNCTION: CAROUSEL NAVIGATION */

function moveGallery(id,offset) {
  const track=document.getElementById(`track-${id}`);
  if(!track)return;

  const total=track.querySelectorAll(".frame").length;
  if(total<2)return;

  const next=(Number(track.dataset.index||0)+offset+total)%total;

  track.dataset.index=next;
  track.style.transform=`translateX(-${next*100}%)`;

  document.getElementById(`count-${id}`).textContent=
    `${next+1} / ${total}`;
}
