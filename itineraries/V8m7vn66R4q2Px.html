function page(n,content,cls=''){
 return `<section class="sheet ${cls}">
 ${cls==='cover'?'':`<header class="hdr"><img src="${LOGO}" alt="CityLaila logo"><div class="motto">WHERE LUXURY MEETS AFFORDABILITY</div></header>`}
 <div class="body">${content}</div>
 <footer class="ftr"><span>📞 +971 55 536 5508 &nbsp; ✉️ info@citylaila.com</span><span>Page ${String(n).padStart(2,'0')}</span></footer>
 </section>`;
}

function gallery(n,imgs){
 return `<div class="gallery">
 <div class="track" id="g${n}" data-index="0">
 ${imgs.map(([src,alt,focus])=>`<div class="frame" style="--focus:${focus}">
 <img src="${src.replace(/&/g,'&amp;')}" alt="${alt}" loading="eager">
 <div class="caption">${alt}</div>
 </div>`).join('')}
 </div>
 <button class="arrow prev" type="button" aria-label="Previous photo" onclick="move(${n},-1)">❮</button>
 <button class="arrow next" type="button" aria-label="Next photo" onclick="move(${n},1)">❯</button>
 <div class="counter" id="c${n}">1 / ${imgs.length}</div>
 </div>`;
}

function move(n,delta){
 const e=document.getElementById('g'+n);
 if(!e)return;
 const c=e.children.length;
 if(!c)return;
 const j=(Number(e.dataset.index||0)+delta+c)%c;
 e.dataset.index=String(j);
 e.style.transform=`translateX(-${j*100}%)`;
 const p=document.getElementById('c'+n);
 if(p)p.textContent=`${j+1} / ${c}`;
}

});
