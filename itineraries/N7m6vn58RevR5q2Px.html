function move(n,delta){
  const t=document.getElementById('g'+n);
  if(!t)return;
  const count=t.children.length;
  if(!count)return;
  const k=(Number(t.dataset.i||0)+delta+count)%count;
  t.dataset.i=String(k);
  t.style.transform=`translateX(-${k*100}%)`;
  document.getElementById('c'+n).textContent=`${k+1} / ${count}`;
}
