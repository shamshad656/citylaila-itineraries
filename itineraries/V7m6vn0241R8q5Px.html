/* =====================================================
   FUNCTION: HELPERS
===================================================== */

function esc(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function money(value){
  return Number(value).toLocaleString("en-IN");
}

/* =====================================================
   FUNCTION: PAGE BUILDER
===================================================== */

const TOTAL_PAGES=7;

function page(number,content,classes="",label=""){
  return `
    <section class="page ${classes}">

      <header class="header">

        <img src="${LOGO}"
             alt="CityLaila Since 2019">

        <span class="tagline">
          WHERE LUXURY MEETS AFFORDABILITY
        </span>

      </header>

      <div class="content">
        ${content}
      </div>

      <footer class="footer">

        <span>
          www.citylaila.com • info@citylaila.com
        </span>

        ${label?`<span>${esc(label)}</span>`:""}

        <span>
          Page ${String(number).padStart(2,"0")} /
          ${String(TOTAL_PAGES).padStart(2,"0")}
        </span>

      </footer>

    </section>`;
}

/* =====================================================
   FUNCTION: CAROUSEL BUILDER
===================================================== */

function gallery(day,id){
  const images=day.images||[];

  const frames=images.map(image=>`
    <div class="frame">

      <img
        src="${esc(image.url)}"
        alt="${esc(image.caption)}"
        loading="eager">

      <span class="caption">
        ${esc(image.caption)}
      </span>

    </div>
  `).join("");

  return `
    <div class="gallery">

      <div class="track"
           id="gallery-${id}"
           data-index="0">

        ${frames}

      </div>

      ${images.length>1?`

        <button type="button"
                class="arrow prev"
                onclick="moveGallery('${id}',-1)"
                aria-label="Previous image">
          ❮
        </button>

        <button type="button"
                class="arrow next"
                onclick="moveGallery('${id}',1)"
                aria-label="Next image">
          ❯
        </button>

        <span class="count"
              id="count-${id}">
          1 / ${images.length}
        </span>

      `:""}

    </div>`;
}

/* =====================================================
   FUNCTION: CAROUSEL NAVIGATION
===================================================== */

function moveGallery(id,direction){
  const track=document.getElementById(
    `gallery-${id}`
  );

  if(!track)return;

  const count=track.querySelectorAll(".frame").length;

  if(count<=1)return;

  const current=Number(track.dataset.index||0);

  const next=(current+direction+count)%count;

  track.dataset.index=String(next);

  track.style.transform=
    `translateX(-${next*100}%)`;

  const counter=document.getElementById(
    `count-${id}`
  );

  if(counter){
    counter.textContent=`${next+1} / ${count}`;
  }
}

   FUNCTION: SEPARATE OPTION PRICE & INCLUSIONS
===================================================== */

function priceColumn(option){
  return `
    <div class="price-column ${option.theme}">

      <div class="price-card">

        <small>
          OPTION ${option.id} • TOTAL LAND PACKAGE
        </small>

        <strong>
          ₹${money(option.price)}
        </strong>

        <span>
          Per Person • 6 Nights / 7 Days
        </span>

        <p>
          ${esc(option.route)}
        </p>

      </div>

      <section class="panel inclusion-panel">

        <h4>
          ✅ Option ${option.id} — Package Inclusions
        </h4>

        ${cells(option.inclusions)}

      </section>

    </div>`;
}

/* =====================================================
   PAGE 7 — PACKAGE PRICES & COVERAGE
===================================================== */

function finalPage(){
  return page(7,`

    <h2 class="heading" style="margin-bottom:0">
      Package Prices <em>& Inclusions</em>
    </h2>

    <div class="pricegrid">

      ${priceColumn(OPTIONS[0])}

      ${priceColumn(OPTIONS[1])}

    </div>

    <section class="panel exclusion-panel">

      <h4>
        ❌ Package Exclusions — Applicable to Both Options
      </h4>

      ${cells(EXCLUSIONS)}

    </section>

    <div class="note">

      <strong>ℹ️ Important:</strong>

      ${esc(CONDITIONS)}

    </div>

    <div class="last-contact">

      <span>🌍 CITYLAILA TRAVEL</span>

      <span>📞 +971 55 536 5508</span>

      <span>✉️ info@citylaila.com</span>

      <span>www.citylaila.com</span>

    </div>

  `,"final-page");
}

/* =====================================================
   FUNCTION: RENDER COMPLETE 7-PAGE ITINERARY

   OPTION 1 FULLY COMPLETED FIRST.
   OPTION 2 STARTS ONLY AFTER OPTION 1 ENDS.
===================================================== */

function renderItinerary(){

  const pages=[

    /* OPTION 1 — COMPLETE PROGRAMME */

    optionIntro(OPTIONS[0],1),

    optionMiddle(OPTIONS[0],2),

    optionEnd(OPTIONS[0],3),

    /* OPTION 2 — COMPLETE PROGRAMME */

    optionIntro(OPTIONS[1],4),

    optionMiddle(OPTIONS[1],5),

    optionEnd(OPTIONS[1],6),

    /* FINAL PACKAGE PRICE & COVERAGE */

    finalPage()

  ];

  document.getElementById("pages").innerHTML=
    pages.join("");
}

renderItinerary();

</script>
