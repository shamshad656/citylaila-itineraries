/* ==========================================================
   FUNCTION: CAROUSEL
   DYNAMIC IMAGES, CAPTIONS & COUNTERS
========================================================== */

function gallery(day,index) {
  const images = day.images;
  const single = images.length <= 1;

  return `
    <div class="gallery ${single?"single":""}">

      <div
        class="gallery-track"
        id="track-${index}"
        data-index="0">

        ${images.map(image=>`
          <div class="gallery-frame">

            <img
              src="${esc(image.url)}"
              alt="${esc(image.caption)}"
              loading="eager">

            <span class="gallery-caption">
              ${esc(image.caption)}
            </span>

          </div>
        `).join("")}

      </div>

      ${single?"":`
        <button
          class="gallery-arrow gallery-prev"
          type="button"
          onclick="moveSlide(${index},-1)"
          aria-label="Previous photo">❮</button>

        <button
          class="gallery-arrow gallery-next"
          type="button"
          onclick="moveSlide(${index},1)"
          aria-label="Next photo">❯</button>
      `}

      <span
        class="gallery-counter"
        id="counter-${index}">
        1 / ${images.length}
      </span>

    </div>
  `;
}

/* ==========================================================
   FUNCTION: CAROUSEL CONTROLS
========================================================== */

function moveSlide(index,direction) {
  const track = document.getElementById(`track-${index}`);

  if(!track) return;

  const count = DAYS[index].images.length;

  if(count <= 1) return;

  const current = Number(track.dataset.index || 0);
  const next = (current + direction + count) % count;

  track.dataset.index = next;
  track.style.transform = `translateX(-${next*100}%)`;

  document.getElementById(`counter-${index}`).textContent =
    `${next+1} / ${count}`;
}
