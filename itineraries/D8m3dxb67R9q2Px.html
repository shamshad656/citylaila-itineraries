   </span>

 </section>`;
}

function gallery(n,images){
 return `
 <div class="gallery">
  <div class="track" id="g${n}" data-index="0">
   ${images.map(([src,caption,focus])=>`
    <div class="frame" style="--focus:${focus}">
     <img
      src="${src.replace(/&/g,'&amp;')}"
      alt="${caption}"
      loading="eager">
     <div class="caption">${caption}</div>
    </div>`).join('')}
  </div>
  <button
   class="arrow prev"
   onclick="move(${n},-1)"
   type="button"
   aria-label="Previous image">❮</button>
  <button
   class="arrow next"
   onclick="move(${n},1)"
   type="button"
   aria-label="Next image">❯</button>
  <div id="c${n}" class="count">
   1 / ${images.length}
  </div>
 </div>`;
}

function move(n,delta){
 const track=document.getElementById('g'+n);
 if(!track)return;
 const count=track.children.length;
 if(!count)return;

 const j=(Number(track.dataset.index||0)+delta+count)%count;
 track.dataset.index=String(j);
 track.style.transform=`translateX(-${j*100}%)`;

 const c=document.getElementById('c'+n);
 if(c)c.textContent=`${j+1} / ${count}`;
}
