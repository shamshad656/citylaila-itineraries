  return `

           id="g${i}"
           data-index="0">

        ${PHOTOS[i].map(([url,alt])=>`
          <div class="frame">

              src="${url.replaceAll('&','&amp;')}"
              alt="${alt}"
              loading="lazy">
          </div>
        `).join('')}

      </div>

      <button
        type="button"
        class="arrow prev"
        aria-label="Previous photo"
        onclick="move(${i},-1)">❮</button>

      <button
        type="button"
        class="arrow next"
        aria-label="Next photo"
        onclick="move(${i},1)">❯</button>

      <span class="counter" id="c${i}">
        1 / ${PHOTOS[i].length}
      </span>

    </div>
  `;
}

/* IMAGE CAROUSEL CONTROLS */

function move(i,delta){

  const track=document.getElementById('g'+i);

  if(!track)return;

  const n=track.children.length;

  if(!n)return;

  const next=
    (Number(track.dataset.index||0)+delta+n)%n;

  track.dataset.index=String(next);

  track.style.transform=
    `translateX(-${next*100}%)`;

  document.getElementById('c'+i).textContent=
    `${next+1} / ${n}`;

}
