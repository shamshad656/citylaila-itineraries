function moveSlide(day,delta){
  const track=document.getElementById("d"+day);
  if(!track)return;
  const count=track.querySelectorAll(".slideimg").length;
  if(count<2)return;
  const index=(Number(track.dataset.index||0)+delta+count)%count;
  track.dataset.index=String(index);
  track.style.transform="translateX(-"+(index*100)+"%)";
  const counter=document.getElementById("c"+day);
  if(counter){
    counter.textContent=(index+1)+" / "+count;
  }
}
