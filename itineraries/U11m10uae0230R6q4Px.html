/* =====================================================

===================================================== */

function esc(value) {
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

/* =====================================================
   FUNCTION: CAROUSEL
===================================================== */

function gallery(day,index) {
  const images=day.images||[];

  if(!images.length) {
    return `<div class="gallery"></div>`;
  }

  const frames=images.map((im,i)=>`
    <div class="gallery-frame">
      <img
        src="${esc(im.url)}"
        alt="${esc(im.caption)}"
        loading="${i===0?"eager":"lazy"}">

      <span class="gallery-caption">
        ${esc(im.caption)}
      </span>
    </div>
  `).join("");

  return `
    <div class="gallery">
      <div class="gallery-track"
        id="gallery-${index}"
        data-index="0">
        ${frames}
      </div>

      ${images.length>1?`
        <button type="button"
          class="gallery-btn prev"
          onclick="moveGallery(${index},-1)"
          aria-label="Previous photo">❮</button>

        <button type="button"
          class="gallery-btn next"
          onclick="moveGallery(${index},1)"
          aria-label="Next photo">❯</button>

        <span class="gallery-counter"
          id="counter-${index}">
          1 / ${images.length}
        </span>
      `:""}
    </div>`;
}

function moveGallery(index,direction) {
  const track=document.getElementById(`gallery-${index}`);

  if(!track)return;

  const count=track.querySelectorAll(".gallery-frame").length;

  if(count<=1)return;

  const current=Number(track.dataset.index||0);
  const next=(current+direction+count)%count;

  track.dataset.index=next;
  track.style.transform=`translateX(-${next*100}%)`;

  const counter=document.getElementById(`counter-${index}`);

  if(counter) {
    counter.textContent=`${next+1} / ${count}`;
  }
}
