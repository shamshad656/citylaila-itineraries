function foot(n){

    </footer>
  `;

function page(n,body,cls=''){
  return `

      ${cls==='cover'?'':head()}
      <div class="body">${body}</div>
      ${foot(n)}
    </section>
  `;
}

/* WORKING IMAGE CAROUSEL */

function carousel(i){

  return `
    <div class="gallery">

      <div class="track" id="g${i}" data-index="0">

        ${photos[i].map(([u,a])=>`
          <div class="frame">
            <img
              src="${u.replaceAll('&','&amp;')}"
              alt="${a}"
              loading="lazy">
          </div>
        `).join('')}

      </div>

      <button
        class="arrow prev"
        type="button"
        aria-label="Previous image"
        onclick="move(${i},-1)">❮</button>

      <button
        class="arrow next"
        type="button"
        aria-label="Next image"
        onclick="move(${i},1)">❯</button>

      <div class="counter" id="c${i}">
        1 / ${photos[i].length}
      </div>

    </div>
  `;
}

/* IMAGE CAROUSEL CONTROLS */

function move(i,delta){

  const el=document.getElementById('g'+i);

  if(!el)return;

  const n=el.children.length;

  if(!n)return;

  const next=
    (Number(el.dataset.index||0)+delta+n)%n;

  el.dataset.index=String(next);

  el.style.transform=
    `translateX(-${next*100}%)`;

  document.getElementById('c'+i).textContent=
    `${next+1} / ${n}`;

}
