<style>

*{box-sizing:border-box}
html,body{margin:0}

body{

  padding:12px 0;
}

/* A4 LANDSCAPE */

.page{
  width:297mm;
  height:210mm;
  margin:0 auto 16px;
  padding:16px 30px 42px;
  display:flex;
  flex-direction:column;
  position:relative;
  background:white;
  overflow:hidden;
  break-after:page;
  page-break-after:always;
  box-shadow:0 5px 16px #071b3418;
}

/* HEADER & FOOTER */

.head{
  height:41px;
  flex:0 0 41px;
  border-bottom:1px solid var(--line);
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.head img{
  height:35px;
  max-width:150px;
  object-fit:contain;
}

.head span{
  font-size:10px;
  color:#718198;
  letter-spacing:1px;
  font-weight:800;
}

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
}

.foot{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:33px;
  padding:0 30px;
  border-top:1px solid var(--line);
  background:var(--light);
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#6b7e96;
  font-size:10px;
  font-weight:800;
}

.heading{
  font-size:22px;
  line-height:1.16;
  color:var(--navy);
  font-weight:900;
  margin:0 0 10px;
}

.heading em{
  color:var(--blue);
  font-style:normal;
}

/* PREMIUM COVER */

.hero{
  height:115px;
  flex:0 0 115px;
  border-radius:13px;
  margin-bottom:10px;
  padding:14px 18px;
  display:grid;
  grid-template-columns:1.21fr .79fr;
  gap:13px;
  align-items:center;
  color:white;

.hero small{

  color:#ffcc8f;

  font-size:9.3px;
}

.hero h1{
  font-size:27px;

}

.hero p{
  font-size:11px;
  font-weight:750;
  line-height:1.32;
  margin:0;
}

.facts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.facts div{
  background:#081d36c7;
  border:1px solid #ffffff4b;
  border-radius:7px;
  padding:8px;
  font-size:9.7px;
  font-weight:800;
  line-height:1.24;
}

.facts .wide{
  grid-column:1/-1;
}

/* DAY CARDS */

.days{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:10px;
}

.daycard{
  min-height:0;
  display:grid;
  grid-template-columns:1.06fr .94fr;
  gap:11px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:white;
  box-shadow:0 2px 10px #091d3509;
}

.copy{

  min-height:0;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  flex-direction:column;
}

.tag{
  background:var(--orange);

  color:white;
  font-weight:900;
  font-size:10px;
  padding:5px 9px;
}

  font-weight:900;
  margin:6px 0;

.desc span{

  gap:5px;
  list-style:none;
  width:100%;
  padding:0;
  margin:0;

  padding:7px;
  font-size:10.1px;
  font-weight:745;
  line-height:1.22;
  overflow-wrap:anywhere;

.gallery{
  position:relative;
  height:100%;
  min-height:0;
  width:100%;
  overflow:hidden;
  border-radius:10px;
  background:#082037;
}

.track{
  height:100%;
  display:flex;
  transition:transform .32s ease;
}

.frame{
  flex:0 0 100%;
  width:100%;
  min-width:0;
  height:100%;
}

.frame img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}

.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:3;
  width:31px;
  height:31px;
  border:1px solid #ffffff70;
  background:#081e38dc;
  border-radius:50%;
  color:white;
  font-size:17px;
  cursor:pointer;
}

.prev{left:8px}
.next{right:8px}

.count{
  position:absolute;
  right:9px;
  bottom:9px;
  z-index:3;
  padding:5px 9px;
  border-radius:20px;
  background:#071b35ed;
  color:white;
  font-weight:900;
  font-size:10px;
}

/* LAST PAGE */

.last-card{
  height:265px;
  flex:0 0 265px;
  margin-bottom:10px;
}

.last-card .daycard{
  height:100%;
}

/* HOTEL PLAN & TRAVEL DETAILS */

.summary{
  display:grid;
  grid-template-columns:1.03fr .97fr;
  gap:10px;
  align-items:start;
  margin-bottom:9px;
}

.panel{
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 11px;
  background:white;
}

.panel.stay{
  border-top:4px solid var(--blue);
}

.panel.notes{
  border-top:4px solid #d59c31;
  background:#fffcf7;
}

.panel h4{
  font-size:12px;
  color:var(--navy);
  margin:0 0 8px;
}

.hotelplan{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.hotelplan div{
  padding:8px 5px;
  background:var(--light);
  border:1px solid var(--line);
  border-radius:7px;
  font-size:9.7px;
  font-weight:750;
  text-align:center;

.hotelplan b{

.notesgrid{

.notesgrid div{

/* PRINT */

  return `

          • ${DATES[i]} DEC
        </span>

        <div class="desc">
          <span>${d.lines[0]}</span>
          <span>${d.lines[1]}</span>
        </div>

        <ul class="points">
          ${d.points.map(p=>`
            <li>${p}</li>
          `).join('')}
        </ul>

      </div>

      <div class="gallery">

        <div class="track"
             id="g${i}"
             data-index="0">

          ${d.photos.map(([url,alt])=>`

            <div class="frame">
              <img
                src="${url.replaceAll('&','&amp;')}"
                alt="${alt}"
                loading="lazy">
            </div>

          `).join('')}

        </div>

        <button
          type="button"
          class="arrow prev"
          aria-label="Previous photo"
          onclick="move(${i},-1)">❮</button>

        <button
          type="button"
          class="arrow next"
          aria-label="Next photo"
          onclick="move(${i},1)">❯</button>

        <span class="count" id="c${i}">
          1 / ${d.photos.length}
        </span>

      </div>

    </article>
  `;

        src="https://commons.wikimedia.org/wiki/Special:FilePath/Flame%20towers%20from%20Baku%20boulevard.JPG"
        alt="Baku Skyline">

      <figcaption>🌆 Baku Skyline</figcaption>

    </figure>

  </div>

`;

/* GENERATE EXACTLY 4 PAGES */

document.getElementById('pages').innerHTML=
  page(1,p1)+
  page(2,p2)+
  page(3,p3)+
  page(4,p4);

/* WORKING CAROUSEL CONTROLS */

function move(i,delta){

  const t=document.getElementById('g'+i);

  if(!t)return;

  const n=t.children.length;

  const k=
    (Number(t.dataset.index||0)+delta+n)%n;

  t.dataset.index=String(k);

  t.style.transform=
    `translateX(-${k*100}%)`;

  document.getElementById('c'+i).textContent=
    `${k+1} / ${n}`;

}

</script>
