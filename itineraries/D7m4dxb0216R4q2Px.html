/* =====================================================
   FUNCTION: CAROUSEL
   Images, captions and counters update automatically.
===================================================== */

function gallery(day,index){
  const images=day.images;
  const single=images.length<=1;

  return `
    <div class="gallery ${single?"single":""}">

      <div
        class="gallery-track"
        id="track-${index}"
        data-index="0">

        ${images.map(image=>`
          <div class="gallery-frame">
            <img
              src="${esc(image.url)}"
              alt="${esc(image.caption)}"
              loading="eager">

            <span class="gallery-caption">
              ${esc(image.caption)}
            </span>
          </div>
        `).join("")}

      </div>

      ${single?"":`
        <button
          class="gallery-arrow gallery-prev"
          type="button"
          onclick="moveSlide(${index},-1)"
          aria-label="Previous photo">❮</button>

        <button
          class="gallery-arrow gallery-next"
          type="button"
          onclick="moveSlide(${index},1)"
          aria-label="Next photo">❯</button>
      `}

      <span
        class="gallery-counter"
        id="counter-${index}">
        1 / ${images.length}
      </span>

    </div>
  `;
}

/* =====================================================
   FUNCTION: CAROUSEL PREVIOUS / NEXT
===================================================== */

function moveSlide(index,direction){
  const track=document.getElementById(`track-${index}`);

  if(!track)return;

  const count=DAYS[index].images.length;

  if(count<=1)return;

  const current=Number(track.dataset.index||0);
  const next=(current+direction+count)%count;

  track.dataset.index=next;
  track.style.transform=`translateX(-${next*100}%)`;

  document.getElementById(`counter-${index}`).textContent=
    `${next+1} / ${count}`;
}

      </tr>
    </thead>

    <tbody>
      ${MEALS.map((meal,index)=>`
        <tr>

          <td>
            Day ${index+1} •
            ${DAYS[index].date.split(" ").slice(0,2).join(" ")}
          </td>

          <td class="${index===0?"meal-no":"meal-yes"}">
            ${meal.breakfast}
          </td>

          <td class="meal-no">
            ${meal.lunch}
          </td>

          <td class="${index===0||index===2?"meal-yes":"meal-no"}">
            ${meal.dinner}
          </td>

        </tr>
      `).join("")}
    </tbody>

  </table>

  <div class="meal-note">
    🍳 Daily hotel breakfast is included during the
    four-night stay. An international buffet dinner is
    included on the Marina Dhow Cruise on 15 January,
    and a BBQ buffet dinner is included with the
    Premium Desert Safari on 17 January.
    Breakfast on arrival day and unlisted meals are not included.
  </div>
`;

   PAGE 11: INCLUSIONS & EXCLUSIONS
===================================================== */

const COVERAGE_PAGE=`

`;

===================================================== */

const DAY_PAGES=DAYS.map((day,index)=>
  page(dayPage(day,index),index+5)
).join("");

document.getElementById("pages").innerHTML=
  page(COVER,1,true)+
  page(WHY_BOOK,2)+
  page(OVERVIEW,3)+
  page(HOTEL_PAGE,4)+
  DAY_PAGES+
  page(MEAL_PAGE,10)+
  page(COVERAGE_PAGE,11)+
  page(PRICE_PAGE,12)+
  page(GLOBAL_PAGE,13);

</script>
