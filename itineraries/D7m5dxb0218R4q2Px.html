/* ==================================================
   FUNCTION: CAROUSEL
   Adding/removing/reordering photos updates automatically.
================================================== */
function gallery(day,index){
  const images=day.images;
  const single=images.length<=1;
  return `
    <div class="gallery ${single?"single":""}">
      <div class="gallery-track"
           id="track-${index}"
           data-index="0">
        ${images.map(image=>`
          <div class="gallery-frame">
            <img src="${esc(image.url)}"
                 alt="${esc(image.caption)}"
                 loading="eager">
            <span class="gallery-caption">
              ${esc(image.caption)}
            </span>
          </div>
        `).join("")}
      </div>
      ${single?"":`
        <button class="gallery-arrow gallery-prev"
                type="button"
                onclick="moveSlide(${index},-1)"
                aria-label="Previous photo">❮</button>
        <button class="gallery-arrow gallery-next"
                type="button"
                onclick="moveSlide(${index},1)"
                aria-label="Next photo">❯</button>
      `}
      <span class="gallery-counter" id="counter-${index}">
        1 / ${images.length}
      </span>
    </div>
  `;
}

/* ==================================================
   FUNCTION: CAROUSEL CONTROLS
================================================== */
function moveSlide(index,direction){
  const track=document.getElementById(`track-${index}`);
  if(!track)return;
  const count=DAYS[index].images.length;
  if(count<=1)return;
  const current=Number(track.dataset.index||0);
  const next=(current+direction+count)%count;
  track.dataset.index=next;
  track.style.transform=`translateX(-${next*100}%)`;
  document.getElementById(`counter-${index}`).textContent=
    `${next+1} / ${count}`;
}

  {date:"16 Dec",breakfast:"Hotel Breakfast",lunch:"Not Included",dinner:"Not Included"},
  {date:"17 Dec",breakfast:"Hotel Breakfast",lunch:"Not Included",dinner:"Not Included"},
  {date:"18 Dec",breakfast:"Hotel Breakfast",lunch:"Not Included",dinner:"BBQ Buffet Included"},
  {date:"19 Dec",breakfast:"Hotel Breakfast",lunch:"Not Included",dinner:"Not Included"},
  {date:"20 Dec",breakfast:"Hotel Breakfast",lunch:"Not Included",dinner:"Not Included"}
];

const MEAL_PAGE=`
  <h2 class="page-title">
    Day-Wise Meal Plan <span>Summary</span>
  </h2>

  <table class="meal-table">
    <thead>
      <tr>
        <th>Day / Date</th>
        <th>Breakfast</th>
        <th>Lunch</th>
        <th>Dinner</th>
      </tr>
    </thead>
    <tbody>
      ${MEALS.map((meal,index)=>`
        <tr>
          <td>Day ${index+1} • ${meal.date}</td>
          <td class="${index===0?"meal-no":"meal-yes"}">
            ${meal.breakfast}
          </td>
          <td class="meal-no">${meal.lunch}</td>
          <td class="${index===3?"meal-yes":"meal-no"}">
            ${meal.dinner}
          </td>
        </tr>
      `).join("")}
    </tbody>
  </table>

  <div class="info-note">
    🍳 Breakfast is included with both hotel rooms
    during the five-night stay. A BBQ buffet dinner
    with vegetarian options is included with the
    Premium Desert Safari on 18 December.
    Breakfast on arrival day, lunches and other
    dinners are not included.
  </div>
`;

/* ==================================================
   PAGE 12 — INCLUSIONS / EXCLUSIONS
================================================== */
const COVERAGE_PAGE=`
  <h2 class="page-title">
    Package <span>Inclusions & Exclusions</span>
  </h2>

  <div class="inclusion-grid">
    <section class="panel included">
      <h3>✅ Package Inclusions</h3>
      <div class="inclusion-items">
        ${INCLUSIONS.map(item=>`
          <div>${esc(item)}</div>
        `).join("")}
      </div>
    </section>

    <section class="panel excluded">
      <h3>❗ Exclusions & Clarifications</h3>
      <div class="exclusion-items">
        ${EXCLUSIONS.map(item=>`
          <div>${esc(item)}</div>
        `).join("")}
      </div>
    </section>
  </div>
`;

/* ==================================================
   PAGE 13 — PACKAGE COST & CANCELLATION POLICY
================================================== */
const PRICE_PAGE=`
  <h2 class="page-title">
    Holiday Package <span>Price Summary</span>
  </h2>

  <div class="price-top">
    <div class="price-total">
      <small>GRAND TOTAL PACKAGE COST</small>
      <strong>${PRICE.currency} ${PRICE.amount}</strong>
      <span>Total for ${PRICE.guests}</span>
    </div>

    <div class="price-summary">
      <div>👥 <b>Guests:</b> 5 People</div>
      <div>🌙 <b>Duration:</b> 5 Nights / 6 Days</div>
      <div>🏨 <b>Hotel:</b> Admiral Plaza Hotel Dubai</div>
      <div>🛏️ <b>Rooms:</b> 1 Superior Triple + 1 Superior</div>
      <div>🍳 <b>Meals:</b> Breakfast + Desert Safari BBQ Dinner</div>
      <div>🛂 <b>Visas:</b> UAE Tourist Visas for 5 Guests</div>
    </div>
  </div>

  <div class="cancellation-box">
    <h3>📋 Cancellation Policy</h3>
    <ul>
      ${CANCELLATION.map(item=>`
        <li>${esc(item)}</li>
      `).join("")}
    </ul>
  </div>

  <div class="price-condition">
    📌 <b>Booking Clarifications:</b>
    INR 226,000 is the quoted total for 5 guests.
    Hotel rooms with breakfast, five UAE tourist visas
    and the specified transfers and activities form the
    package scope. Burj Khalifa, Miracle Garden and
    Global Village ticket particulars must be confirmed
    with the supplier before issuance. Day 5 is at leisure;
    no dedicated shopping transport is specified.
  </div>
`;

================================================== */

  <div class="global-section">

      <div class="locations">
        ${LOCATIONS.map(location=>`
          <div class="location"
               style="background-image:url('${esc(location.image)}')">
            <strong>${esc(location.name)}</strong>
            <span>${esc(location.contact)}</span>
          </div>
        `).join("")}
      </div>

      <div class="contact-panel">
        <h3>🎧 INSTANT TOUR CONCIERGE</h3>

        <div>
          <b>B2B Partnerships</b>
          <div>b2b@citylaila.com</div>
          <div>+971 4 4451 625</div>
        </div>

        <div>
          <b class="marketing">Marketing & Media</b>
          <div>marketing@citylaila.com</div>
        </div>

        <div>
          <b class="traveler">Direct Traveler Desk</b>

/* ==================================================
   FUNCTION: RENDER COMPLETE 14-PAGE ITINERARY
================================================== */
const DAY_PAGES=DAYS.map((day,index)=>
  page(dayPage(day,index),index+5)
).join("");

document.getElementById("pages").innerHTML=
  page(COVER,1,true)+
  page(WHY_BOOK,2)+
  page(OVERVIEW,3)+
  page(HOTEL_PAGE,4)+
  DAY_PAGES+
  page(MEAL_PAGE,11)+
  page(COVERAGE_PAGE,12)+
  page(PRICE_PAGE,13)+
  page(GLOBAL_PAGE,14);

</script>
</body>
</html>
