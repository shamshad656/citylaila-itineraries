
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">

<title>CityLaila | Singapore City &amp; Island Escape – 4N/5D | Sample Holiday</title>

<meta name="description"
content="Singapore 4 Nights / 5 Days: Night Tour, Universal Studios, Sentosa Cable Car, Singapore Zoo and Gardens by the Bay. From INR 47,999.">

<meta property="og:title"
content="CityLaila | Singapore City &amp; Island Escape – 4N/5D">

<meta property="og:description"
content="4★ Hotel • Daily Breakfast • Singapore Night Tour • Universal Studios • Sentosa • Zoo • Gardens by the Bay">

<meta property="og:image"
content="https://shamshad656.github.io/citylaila-itineraries/images/countries/singapore.webp">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#0a192f;
  --blue:#0769c8;
  --orange:#f36c19;
  --line:#dce5f0;
  --light:#f7f9fc;
  --ink:#253950;
}

*{box-sizing:border-box}

html,body{margin:0}

body{
  padding:12px 0;
  background:#edf2f7;
  color:var(--ink);
  font-family:Montserrat,Arial,'Segoe UI Emoji','Apple Color Emoji',sans-serif;
}

/* A4 LANDSCAPE - THREE PAGES */

.page{
  width:297mm;
  height:210mm;
  margin:0 auto 16px;
  padding:17px 30px 43px;
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:white;
  break-after:page;
  page-break-after:always;
  box-shadow:0 5px 17px #0a192f18;
}

/* HEADER & FOOTER */

.header{
  height:41px;
  flex:0 0 41px;
  border-bottom:1px solid var(--line);
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header img{
  height:37px;
  max-width:155px;
  object-fit:contain;
}

.header .tagline{
  font-size:10px;
  font-weight:800;
  letter-spacing:1.15px;
  color:#718096;
}

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
}

.footer{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:34px;
  padding:0 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:1px solid var(--line);
  background:var(--light);
  font-size:10px;
  font-weight:800;
  color:#6b7c95;
}

.title{
  font-size:23px;
  line-height:1.18;
  font-weight:900;
  color:var(--navy);
  margin:0 0 10px;
}

.title em{
  font-style:normal;
  color:var(--blue);
}

/* COMPACT PREMIUM COVER */

.hero{
  height:110px;
  flex:0 0 110px;
  border-radius:13px;
  margin-bottom:10px;
  padding:14px 21px;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  align-items:center;
  gap:16px;
  color:white;
  background:
    linear-gradient(100deg,#061b36e8,#0b355dbc),
    url('https://shamshad656.github.io/citylaila-itineraries/images/countries/singapore.webp')
    center/cover;
}

.hero small{
  color:#ffce88;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.2px;
}

.hero h1{
  margin:5px 0 6px;
  font-size:27px;
  line-height:1.1;
  font-weight:900;
}

.hero p{
  font-size:11px;
  font-weight:700;
  margin:0;
  line-height:1.3;
}

.facts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.facts span{
  font-size:10px;
  font-weight:800;
  line-height:1.2;
  background:#091b35c9;
  border:1px solid #ffffff4b;
  border-radius:7px;
  padding:10px;
}

.facts .wide{
  grid-column:1/-1;
}

/* DAY CARDS */

.day-list{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:10px;
}

.day-card{
  min-height:0;
  display:grid;
  grid-template-columns:1.04fr .96fr;
  gap:12px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:white;
  box-shadow:0 2px 11px #0a192f09;
}

.copy{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:flex-start;
}

.day-tag{
  background:var(--orange);
  color:white;
  font-size:10px;
  font-weight:900;
  padding:5px 10px;
  border-radius:5px;
}

.copy h3{
  margin:7px 0 6px;
  color:var(--navy);
  font-size:17px;
  font-weight:900;
  line-height:1.14;
}

/* EXACTLY TWO DESCRIPTION LINES */

.desc{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:2px;
  margin:0 0 9px;
  font-weight:650;
  font-size:11.8px;
  line-height:1.28;
  color:#526780;
}

.desc span{
  display:block;
  white-space:nowrap;
  max-width:100%;
}

/* DAY HIGHLIGHTS */

.points{
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  width:100%;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.points li{
  padding:8px 9px;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--light);
  font-size:10.95px;
  line-height:1.24;
  font-weight:750;
  overflow-wrap:anywhere;
}

/* FULL-SIZE IMAGE CAROUSELS */

.gallery{
  position:relative;
  width:100%;
  height:100%;
  min-height:0;
  overflow:hidden;
  border-radius:10px;
  background:#0b2038;
}

.track{
  display:flex;
  width:100%;
  height:100%;
  transition:transform .32s ease;
}

.frame{
  flex:0 0 100%;
  min-width:0;
  height:100%;
  width:100%;
}

.frame img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  border:1px solid #ffffff6b;
  border-radius:50%;
  background:#0b1d37d7;
  color:white;
  width:31px;
  height:31px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  z-index:2;
}

.prev{left:8px}
.next{right:8px}

.count{
  position:absolute;
  right:10px;
  bottom:10px;
  border-radius:18px;
  background:#0b1d37eb;
  color:white;
  font-size:10px;
  font-weight:900;
  padding:5px 10px;
  z-index:2;
}

/* LAST PAGE SPACE OPTIMIZATION */

.lastday{
  flex:1 1 auto;
  min-height:0;
  margin-bottom:9px;
}

.lastday .day-card{
  height:100%;
  grid-template-columns:1fr 1fr;
}

/* APPROVED PACKAGE COST */

.price{
  display:grid;
  grid-template-columns:1.07fr .93fr;
  gap:11px;
  height:94px;
  flex:0 0 94px;
  margin-bottom:9px;
}

.total{
  border-radius:11px;
  background:linear-gradient(135deg,#0a192f,#224489);
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.total small{
  font-size:10px;
  letter-spacing:1px;
  color:#ffca51;
  font-weight:900;
}

.total strong{
  font-size:32px;
  font-weight:900;
  margin:3px 0;
}

.total span{
  color:#fff089;
  font-size:11px;
  font-weight:850;
}

.snapshot{
  border:1px solid var(--line);
  border-left:5px solid var(--blue);
  background:var(--light);
  padding:9px;
  border-radius:10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  align-content:center;
}

.snapshot div{
  border:1px solid var(--line);
  border-radius:6px;
  background:white;
  padding:8px;
  font-size:10px;
  font-weight:800;
}

/* COMPACT INCLUSIONS & EXCLUSIONS */

.coverage{
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:10px;
  align-items:start;
  flex:0 0 auto;
}

.panel{
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 10px;
}

.panel.yes{
  border-top:4px solid #32a276;
}

.panel.no{
  border-top:4px solid #dfa638;
  background:#fffdf8;
}

.panel h4{
  font-size:12px;
  font-weight:900;
  color:var(--navy);
  margin:0 0 7px;
}

.cells{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.cells div{
  border-radius:6px;
  border:1px solid var(--line);
  padding:6px 7px;
  background:var(--light);
  font-size:9.5px;
  line-height:1.2;
  font-weight:750;
}

.no .cells div{
  background:white;
  border-color:#f0deb5;
}

/* BOOKING NOTES */

.note{
  margin-top:8px;
  flex:0 0 auto;
  border:1px solid #edcf9c;
  border-radius:8px;
  padding:8px 10px;
  background:#fff9ef;
  color:#955b1e;
  font-size:9.7px;
  font-weight:750;
  line-height:1.32;
}

/* PRINT SETTINGS */

@media print{
  @page{
    size:A4 landscape;
    margin:0;
  }

  body{
    padding:0;
    background:white;
    print-color-adjust:exact;
    -webkit-print-color-adjust:exact;
  }

  .page{
    margin:0;
    box-shadow:none;
  }

  .arrow{
    display:none;
  }
}
</style>
</head>

<body>

<main id="pages"></main>

<script>

/* CITYLAILA MASTER ASSETS */

const ROOT=
'https://shamshad656.github.io/citylaila-itineraries/images/';

/*
IMAGE EDITING:
Replace URLs within the relevant day's photos array.
Delete a [URL, Caption] entry to remove an image.
Carousel counters automatically update.
*/

const DAYS=[

  /* DAY 1 */

  {
    title:'Arrival in Singapore & Night Tour',

    lines:[
      'Arrive at Changi Airport and enjoy a comfortable transfer to your Singapore hotel.',
      'Explore the glowing Marina Bay skyline and vibrant city landmarks on a night tour.'
    ],

    points:[
      '🛬 Changi Airport arrival & welcome',
      '🏨 Hotel transfer and check-in',
      '🌃 Singapore Night Tour',
      '📸 Marina Bay & Merlion area (route-dependent)'
    ],

    photos:[
      [
        'https://d1pllr5sjb7ywk.cloudfront.net/uploads/f5d275d2-445f-2d77-8f5c-3a2286a1799d/PackageMedia/b621d70b-5fc2-4360-a925-adb529d0b2f7_Singapore%20Night%20Tour_R.webp',
        'Singapore Changi Airport'
      ],
      [
        'https://shamshad656.github.io/citylaila-itineraries/images/countries/singapore.webp',
        'Singapore skyline at night'
      ],
      [
        'https://www.vacationstravel.com/wp-content/uploads/2024/12/AdobeStock_294277354_Editorial_Use_Only.jpg',
        'Marina Bay skyline'
      ]
    ]
  },

  /* DAY 2 */

  {
    title:'Full-Day Universal Studios Singapore',

    lines:[
      'Enjoy a fun-filled day at Universal Studios Singapore on exciting Sentosa Island.',
      'Discover movie-themed rides, entertaining shows and memorable family attractions.'
    ],

    points:[
      '🍳 Hotel breakfast',
      '🎢 Universal Studios Singapore',
      '🎬 Themed rides, zones & shows',
      '🏨 Return to hotel in the evening'
    ],

    photos:[
      [
        'https://media1.thrillophilia.com/filestore/ma33fiyq61szgu4i5wt7mdzsrylw_Universal_Studios_Singapore_Tickets_Price_b7478270f1.jpg',
        'Universal Studios Singapore globe'
      ],
      [
        'https://commons.wikimedia.org/wiki/Special:FilePath/Universal%20Studio%20Globe%20Singapore.jpg',
        'Universal Studios entrance'
      ]
    ]
  },

  /* DAY 3 */

  {
    title:'Sentosa Island Tour & Cable Car',

    lines:[
      'Enjoy a scenic cable car ride with beautiful views of the harbour and Sentosa.',
      'Discover selected island attractions and relax along the lively waterfront.'
    ],

    points:[
      '🍳 Breakfast at hotel',
      '🚡 Singapore Cable Car ride',
      '🏝️ Half-day Sentosa sightseeing',
      '🌴 Free time after the tour'
    ],

    photos:[
      [
        'https://hblimg.mmtcdn.com/content/hubble/img/images_attractions/mmt/acme/m_Singapore%20Cable%20Car%209_l_1365_2048.jpg',
        'Sentosa cable car'
      ],
      [
        'https://cdn-imgix.headout.com/media/images/0cffab530116629da7d2e4e1e572b7b5-337-singapore-sentosa-09.jpg',
        'Sentosa Island'
      ],
      [
        'https://shamshad656.github.io/citylaila-itineraries/images/countries/singapore.webp',
        'Singapore waterfront'
      ]
    ]
  },

  /* DAY 4 */

  {
    title:'Singapore Zoo & Gardens by the Bay',

    lines:[
      'Explore Singapore Zoo and encounter wildlife in its lush rainforest-style habitats.',
      'Later, visit Gardens by the Bay for its beautiful gardens and Supertree scenery.'
    ],

    points:[
      '🍳 Hotel breakfast',
      '🦒 Singapore Zoo admission',
      '🌿 Gardens by the Bay visit',
      '🌳 Supertree Grove and scenic photo stops'
    ],

    photos:[
      [
        'https://res.klook.com/images/fl_lossy.progressive%2Cq_65/c_fill%2Cw_3000%2Ch_2002/w_80%2Cx_15%2Cy_15%2Cg_south_west%2Cl_Klook_water_br_trans_yhcmh3/activities/b2vdzehcsk2t6n6mziv0/SingaporeZooTicket%7CMandaiWildlifeReserve%2CSingapore-KlookUnitedStates.jpg',
        'Singapore Zoo'
      ],
      [
        'https://pohcdn.com/sites/default/files/styles/paragraph__hero_banner__hb_image__1880bp/public/hero_banner/Gardens-by-the-Bay.jpg',
        'Gardens by the Bay'
      ],
      [
        'https://res.klook.com/images/fl_lossy.progressive%2Cq_65/c_fill%2Cw_1295%2Ch_728/w_80%2Cx_15%2Cy_15%2Cg_south_west%2Cl_Klook_water_br_trans_yhcmh3/activities/aqt8ohbdowpsc578bnku/GardensbytheBayTicketinSingapore.jpg',
        'Gardens by the Bay Cloud Forest'
      ]
    ]
  },

  /* DAY 5 — DEPARTURE */

  {
    title:'Departure from Singapore',

    lines:[
      'After your final breakfast, check out of the hotel and collect your luggage.',
      'Continue to Changi Airport for your departure with treasured Singapore memories.'
    ],

    points:[
      '🍳 Breakfast at hotel',
      '🧳 Hotel check-out',
      '🚘 Airport transfer (basis to confirm)',
      '✈️ Onward departure'
    ],

    /* CHECKOUT → TRANSFER → AIRPORT */

    photos:[
      [
        'https://d1pllr5sjb7ywk.cloudfront.net/uploads/f5d275d2-445f-2d77-8f5c-3a2286a1799d/PackageMedia/1de17445-e890-4142-9e4c-45a418e429e3_Singapore%20Changi%20Airport_R.webp',
        'Hotel check-out'
      ],
      [
        'https://dynamic-media.tacdn.com/media/photo-o/2e/d3/a7/93/caption.jpg?w=1100&h=800&s=1',
        'Airport transfer'
      ],
      [
        'https://upload.wikimedia.org/wikipedia/commons/e/e9/JewelSingaporeVortex1.jpg',
        'Singapore Changi Airport'
      ]
    ]
  }

];

/* REUSABLE HEADER & FOOTER */

function header(){
  return `
    <header class="header">
      <img src="${ROOT}logo.png" alt="CityLaila">
      <span class="tagline">
        WHERE LUXURY MEETS AFFORDABILITY
      </span>
    </header>
  `;
}

function footer(n){
  return `
    <footer class="footer">
      <span>www.citylaila.com</span>
      <span>Page ${String(n).padStart(2,'0')}</span>
    </footer>
  `;
}

function page(n,html){
  return `
    <section class="page">
      ${header()}
      <div class="main">${html}</div>
      ${footer(n)}
    </section>
  `;
}

/* DAY CARD & CAROUSEL */

function card(d,i){
  return `
    <article class="day-card">

      <div class="copy">

        <span class="day-tag">DAY ${i+1}</span>

        <h3>${d.title}</h3>

        <div class="desc">
          <span>${d.lines[0]}</span>
          <span>${d.lines[1]}</span>
        </div>

        <ul class="points">
          ${d.points.map(p=>`<li>${p}</li>`).join('')}
        </ul>

      </div>

      <div class="gallery">

        <div class="track"
             id="track${i}"
             data-index="0">

          ${d.photos.map(([url,alt])=>`
            <div class="frame">
              <img
                src="${url.replaceAll('&','&amp;')}"
                alt="${alt}"
                loading="lazy">
            </div>
          `).join('')}

        </div>

        <button
          class="arrow prev"
          type="button"
          aria-label="Previous photo"
          onclick="slide(${i},-1)">❮</button>

        <button
          class="arrow next"
          type="button"
          aria-label="Next photo"
          onclick="slide(${i},1)">❯</button>

        <span class="count" id="count${i}">
          1 / ${d.photos.length}
        </span>

      </div>

    </article>
  `;
}

/* PAGE 1 — COVER + DAYS 1–2 */

const hero=`
  <div class="hero">

    <div>
      <small>
        SAMPLE HOLIDAY PACKAGE • 4 NIGHTS / 5 DAYS
      </small>

      <h1>🇸🇬 Singapore City &amp; Island Escape</h1>

      <p>
        Night Tour • Universal Studios • Sentosa • Zoo • Gardens by the Bay
      </p>
    </div>

    <div class="facts">
      <span>🏨 4★ Hotel</span>
      <span>🍳 Daily Breakfast</span>
      <span class="wide">
        🌙 4 Nights in Singapore
      </span>
    </div>

  </div>
`;

const p1=hero+`
  <div class="day-list">
    ${DAYS.slice(0,2)
      .map((d,i)=>card(d,i)).join('')}
  </div>
`;

/* PAGE 2 — DAYS 3–4 */

const p2=`
  <h2 class="title">
    Singapore Adventures <em>• Days 3–4</em>
  </h2>

  <div class="day-list">
    ${DAYS.slice(2,4)
      .map((d,i)=>card(d,i+2)).join('')}
  </div>
`;

/* PAGE 3 — DAY 5 + COST & COVERAGE */

const p3=`

  <h2 class="title">
    Departure &amp; <em>Package Summary</em>
  </h2>

  <div class="lastday">
    ${card(DAYS[4],4)}
  </div>

  <div class="price">

    <div class="total">
      <small>STARTING PACKAGE PRICE</small>
      <strong>₹47,999</strong>
      <span>Price basis to be confirmed</span>
    </div>

    <div class="snapshot">
      <div>🌙 4 Nights / 5 Days</div>
      <div>🏨 4★ Hotel</div>
      <div>🍳 Daily Breakfast</div>
      <div>🎟️ Featured Tours &amp; Tickets</div>
    </div>

  </div>

  <div class="coverage">

    <div class="panel yes">

      <h4>✅ Package Inclusions</h4>

      <div class="cells">

        <div>🏨 4 nights in 4★ hotel</div>
        <div>🍳 Daily breakfast</div>

        <div>🌃 Singapore Night Tour</div>
        <div>🎢 Universal Studios Singapore</div>

        <div>🚡 Sentosa Half-Day &amp; Cable Car</div>
        <div>🦒 Singapore Zoo admission</div>

        <div>🌿 Gardens by the Bay admission*</div>
        <div>🚐 Airport &amp; tour transfers*</div>

      </div>

    </div>

    <div class="panel no">

      <h4>❌ Exclusions</h4>

      <div class="cells">

        <div>✈️ International flights</div>
        <div>🛂 Singapore visa, if needed</div>

        <div>🍽️ Lunch &amp; dinner</div>
        <div>🧳 Travel insurance</div>

        <div>💳 Personal expenses, drinks &amp; tips</div>
        <div>🎟️ Optional/premium attractions</div>

        <div>🛎️ Upgrades &amp; late checkout</div>
        <div>🛍️ Shopping &amp; unlisted services</div>

      </div>

    </div>

  </div>



`;

/* RENDER EXACTLY THREE PAGES */

document.getElementById('pages').innerHTML=
  page(1,p1)+page(2,p2)+page(3,p3);

/* WORKING IMAGE CAROUSELS */

function slide(i,delta){

  const track=document.getElementById('track'+i);

  if(!track)return;

  const n=track.querySelectorAll('.frame').length;

  const next=
    (Number(track.dataset.index||0)+delta+n)%n;

  track.dataset.index=String(next);

  track.style.transform=
    `translateX(-${next*100}%)`;

  document.getElementById('count'+i).textContent=
    `${next+1} / ${n}`;

}

</script>
</body>
</html>
