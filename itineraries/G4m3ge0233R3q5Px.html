/* =====================================================
   FUNCTION: CAROUSEL NAVIGATION
===================================================== */

function moveGallery(index,direction){
  const track=document.getElementById(`gallery-${index}`);

  if(!track)return;

  const frames=track.querySelectorAll(".frame");
  const total=frames.length;

  if(total<=1)return;

  const current=Number(track.dataset.index||0);
  const next=(current+direction+total)%total;

  track.dataset.index=next;
  track.style.transform=`translateX(-${next*100}%)`;

  const counter=document.getElementById(`count-${index}`);

  if(counter){
    counter.textContent=`${next+1} / ${total}`;
  }
}
