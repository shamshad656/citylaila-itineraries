  <script>

    (function () {


      /* REMOVE DUPLICATE PRICE-SUMMARY INFORMATION */

      const priceCard =
        document.querySelector(
          ".price-summary-card"
        );


      if (priceCard) {

        Array
          .from(priceCard.children)
          .forEach(function (row) {

            const text =
              row.textContent
                .replace(/\s+/g, " ")
                .trim();


            if (
              text.startsWith("👥 Guests:") ||
              text.startsWith("🌙 Duration:") ||
              text.startsWith("📦 Package Type:")
            ) {

              row.remove();

            }

          });

      }


      /* EXACT LINK / BROWSER TITLE */

      const exactTitle =
        "CityLaila | Georgia Winter Heritage & Canyon Escape – 4N/5D | Lead ID-0154";


      document.title =
        exactTitle;


      const ogTitle =
        document.querySelector(
          'meta[property="og:title"]'
        );


      if (ogTitle) {

        ogTitle.setAttribute(
          "content",
          exactTitle
        );

      }


    })();
