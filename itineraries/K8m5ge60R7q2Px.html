  right:0;

  align-items:center;

  color:#66788e;

  font-size:10px;
}

  line-height:1.2;

  background:var(--light);
  border-radius:6px;

  width:100%;
  border-radius:10px;

.frame{

.frame img{

  object-position:center;

}

.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:2;
  width:30px;
  height:30px;
  border-radius:50%;
  border:1px solid #ffffff77;
  background:#071a31da;
  color:white;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

.prev{left:7px}
.next{right:7px}

.count{
  position:absolute;
  bottom:9px;
  right:10px;
  background:#071a31eb;
  color:#fff;
  font-size:10px;
  padding:5px 9px;

/* PAGE 3 - COMPACT DETAILS, LARGE PHOTOS */

.table tr:nth-child(even){

}

.table td:last-child{

.note-grid{

/* REUSABLE HEADER & FOOTER */

function header(){
  return `
    <header class="header">
      <img src="${BASE}logo.png" alt="CityLaila">
      <span>WHERE LUXURY MEETS AFFORDABILITY</span>
    </header>
  `;
}

function footer(n){
  return `
    <footer class="footer">
      <span>www.citylaila.com</span>
      <span>Page ${String(n).padStart(2,'0')}</span>
    </footer>
  `;
}

function page(n,body){
  return `
    <section class="page">
      ${header()}
      <div class="main">${body}</div>
      ${footer(n)}
    </section>
  `;
}

/* DAY CARD & FULL-SIZE IMAGE CAROUSEL */

function dayCard(d,i){
  return `
    <article class="daycard">

      <div class="daycopy">

        <span class="tag">
          DAY ${String(i+1).padStart(2,'0')}
        </span>

        <h3>${d.title}</h3>

        <div class="desc">
          <span>${d.lines[0]}</span>
          <span>${d.lines[1]}</span>
        </div>

        <ul class="points">
          ${d.points.map(s=>`<li>${s}</li>`).join('')}
        </ul>

      </div>

      <div class="gallery">

        <div class="track"
          id="track${i}"
          data-index="0">

          ${d.photos.map(([url,alt])=>`
            <div class="frame">
              <img
                src="${url.replaceAll('&','&amp;')}"
                alt="${alt}"
                loading="lazy">
            </div>
          `).join('')}

        </div>

        <button
          type="button"
          class="arrow prev"
          aria-label="Previous photo"
          onclick="move(${i},-1)">❮</button>

        <button
          type="button"
          class="arrow next"
          aria-label="Next photo"
          onclick="move(${i},1)">❯</button>

        <span class="count" id="counter${i}">
          1 / ${d.photos.length}
        </span>

      </div>

    </article>
  `;
}

/* PAGE 1 — COVER + DAYS 1–2 */

const hero=`
  <div class="hero">

`;

        </div>

        </div>

        <div>

          and bedding to confirm
        </div>

      </div>

`;

/* RENDER EXACTLY 3 PAGES */

document.getElementById('pages').innerHTML=

/* IMAGE CAROUSEL CONTROLS */

function move(i,d){

  const t=document.getElementById('track'+i);

  if(!t)return;

  const n=t.children.length;

  const k=
    (Number(t.dataset.index||0)+d+n)%n;

  t.dataset.index=String(k);

  t.style.transform=
    `translateX(-${k*100}%)`;

  document.getElementById('counter'+i).textContent=
    `${k+1} / ${n}`;

}
