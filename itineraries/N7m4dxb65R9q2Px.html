// Image carousel: one image at a time, keyboard-safe buttons, correct counter.
document.querySelectorAll('.photo-box').forEach(box=>{const track=box.querySelector('.photo-track');const imgs=[...track.querySelectorAll('img')];let n=0;const render=()=>{track.style.transform=`translateX(-${n*100}%)`;box.querySelector('.count').textContent=`${n+1} / ${imgs.length}`;box.querySelector('.photocap').textContent=imgs[n].alt};box.querySelector('.prev').addEventListener('click',()=>{n=(n-1+imgs.length)%imgs.length;render()});box.querySelector('.next').addEventListener('click',()=>{n=(n+1)%imgs.length;render()});});
