
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">

<!-- CITYLAILA SAMPLE • THREE PAGES • NO LEAD ID OR DATES -->

<title>CityLaila | ThaiBliss Escape – Bangkok &amp; Pattaya | 4N/5D</title>

<meta name="description" content="ThaiBliss Escape 4 nights / 5 days: Bangkok, Pattaya, Alcazar Show, city sightseeing and Coral Island. From INR 21,999.">

<meta property="og:title" content="CityLaila | ThaiBliss Escape – City Lights & Coral Island">

<meta property="og:image" content="https://cdn.forevervacation.com/uploads/destination/bangkok.jpeg">

<style>
:root{
  --navy:#0a192f;
  --blue:#0868c4;
  --orange:#f36a16;
  --line:#dce5f0;
  --light:#f7f9fc;
  --ink:#263950;
}

*{box-sizing:border-box}
html,body{margin:0}

body{
  padding:12px 0;
  background:#edf2f7;
  color:var(--ink);
  font-family:Arial,'Segoe UI Emoji','Apple Color Emoji',sans-serif;
}

/* A4 LANDSCAPE */

.page{
  width:297mm;
  height:210mm;
  margin:0 auto 16px;
  padding:17px 31px 43px;
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:white;
  break-after:page;
  page-break-after:always;
  box-shadow:0 4px 18px #0a192f14;
}

/* HEADER & FOOTER */

.header{
  height:42px;
  flex:0 0 42px;
  border-bottom:1px solid var(--line);
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header img{
  height:37px;
  max-width:150px;
  object-fit:contain;
}

.header span{
  font-size:10.6px;
  font-weight:800;
  letter-spacing:1px;
  color:#718096;
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
  justify-content:flex-start;
}

.footer{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:34px;
  padding:0 31px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--light);
  border-top:1px solid var(--line);
  font-size:10px;
  color:#6e7e93;
  font-weight:800;
}

.heading{
  font-size:23px;
  font-weight:900;
  color:var(--navy);
  margin:0 0 10px;
  line-height:1.2;
}

.heading em{
  color:var(--blue);
  font-style:normal;
}

/* PREMIUM COMPACT HERO */

.hero{
  height:111px;
  flex:0 0 111px;
  display:grid;
  grid-template-columns:1.24fr .76fr;
  gap:15px;
  align-items:center;
  border-radius:14px;
  margin-bottom:10px;
  padding:15px 21px;
  color:white;
  background:
    linear-gradient(100deg,#081a35ee,#123c61b8),
    url('https://cdn.forevervacation.com/uploads/destination/bangkok.jpeg')
    center/cover;
}

.hero small{
  display:block;
  font-size:10px;
  letter-spacing:1.25px;
  color:#ffc18c;
  font-weight:900;
}

.hero h1{
  font-size:27px;
  line-height:1.1;
  margin:5px 0 5px;
  font-weight:900;
}

.hero p{
  margin:0;
  font-size:11.6px;
  line-height:1.3;
  font-weight:700;
}

.hero-facts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.hero-facts div{
  border:1px solid #ffffff50;
  background:#071d39be;
  border-radius:8px;
  padding:9px;
  font-size:10.4px;
  font-weight:800;
}

.hero-facts .full{
  grid-column:1/-1;
}

/* DAY-WISE CARDS */

.days{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:11px;
}

.day-card{
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:12px;
  padding:10px;
  min-height:0;
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 2px 10px #071c3409;
}

.copy{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:flex-start;
}

.tag{
  display:inline-block;
  background:var(--orange);
  color:white;
  border-radius:5px;
  padding:6px 10px;
  font-size:10.5px;
  font-weight:900;
}

.copy h3{
  font-size:19px;
  line-height:1.14;
  margin:8px 0 7px;
  color:var(--navy);
  font-weight:900;
}

/* EXACTLY TWO FULL DESCRIPTION LINES */

.desc{
  display:flex;
  flex-direction:column;
  gap:3px;
  width:100%;
  margin:0 0 9px;
  font-size:12.1px;
  line-height:1.23;
  font-weight:650;
  color:#53647e;
}

.desc span{
  display:block;
  white-space:nowrap;
}

/* SHORT HIGHLIGHTS */

.points{
  list-style:none;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  width:100%;
  margin:0;
  padding:0;
}

.points li{
  font-size:11.2px;
  line-height:1.26;
  border:1px solid var(--line);
  background:var(--light);
  border-radius:7px;
  padding:9px;
  font-weight:750;
  overflow-wrap:anywhere;
}

/* LARGE FULL-SIZE IMAGE CAROUSELS */

.gallery{
  position:relative;
  height:100%;
  width:100%;
  min-height:0;
  border-radius:10px;
  overflow:hidden;
  background:#10243c;
}

.track{
  height:100%;
  display:flex;
  transition:transform .32s ease;
}

.frame{
  width:100%;
  min-width:0;
  height:100%;
  flex:0 0 100%;
}

.frame img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center;
}

.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:31px;
  height:31px;
  border-radius:50%;
  border:1px solid #ffffff66;
  background:#0a192fd9;
  color:white;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  z-index:2;
}

.prev{left:8px}
.next{right:8px}

.count{
  position:absolute;
  bottom:9px;
  right:10px;
  background:#0a192fe9;
  color:white;
  border-radius:20px;
  padding:5px 9px;
  font-size:10px;
  font-weight:900;
  z-index:2;
}

/* PAGE 3 SPACE OPTIMIZATION */

.lastday{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  margin-bottom:10px;
}

.lastday .day-card{
  flex:1;
  min-height:0;
}

/* APPROVED PACKAGE COST */

.price{
  height:100px;
  flex:0 0 100px;
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:11px;
  margin-bottom:9px;
}

.total{
  background:linear-gradient(130deg,#0a192f,#22468b);
  border-radius:11px;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.total small{
  font-size:10.4px;
  color:#fbc54d;
  letter-spacing:1.1px;
  font-weight:900;
}

.total strong{
  font-size:34px;
  font-weight:900;
  margin:4px 0;
}

.total span{
  font-size:11px;
  font-weight:800;
  color:#ffed89;
}

.snapshot{
  background:var(--light);
  border:1px solid var(--line);
  border-left:5px solid var(--blue);
  border-radius:10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  align-content:center;
  padding:9px;
}

.snapshot div{
  border:1px solid var(--line);
  background:white;
  border-radius:6px;
  padding:8px;
  font-size:10.5px;
  font-weight:800;
}

/* COMPACT INCLUSIONS & EXCLUSIONS */

.coverage{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:10px;
  align-items:start;
}

.panel{
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 11px;
}

.panel.y{
  border-top:4px solid #34a273;
}

.panel.n{
  border-top:4px solid #dba331;
  background:#fffdf8;
}

.panel h4{
  font-size:12.3px;
  font-weight:900;
  color:var(--navy);
  margin:0 0 6px;
}

.cells{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.cells div{
  border:1px solid var(--line);
  background:var(--light);
  border-radius:6px;
  padding:6px 8px;
  font-size:9.7px;
  line-height:1.24;
  font-weight:750;
}

.n .cells div{
  background:white;
  border-color:#f1e0ba;
}

/* BOOKING NOTES */

.note{
  flex:0 0 auto;
  margin-top:8px;
  background:#fff8ed;
  border:1px solid #f0d09e;
  color:#945b20;
  border-radius:8px;
  padding:8px 10px;
  font-size:10px;
  line-height:1.34;
  font-weight:750;
}

/* PRINT */

@media print{
  @page{
    size:A4 landscape;
    margin:0;
  }

  body{
    background:white;
    padding:0;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  .page{
    box-shadow:none;
    margin:0;
  }

  .arrow{
    display:none;
  }
}
</style>
</head>

<body>

<main id="pages"></main>

<script>

/* CITYLAILA MASTER ASSETS */

const ROOT=
'https://shamshad656.github.io/citylaila-itineraries/images/';

/*
 IMAGE EDITING:

 Change images by replacing the URL in photos.
 Remove one image by deleting [URL, Caption].
 Add images using another [URL, Caption] entry.

 Carousels and numbering update automatically.
*/

const DAYS=[

  /* DAY 1 */

  {
    title:'Arrival in Bangkok & Alcazar Show',

    lines:[
      'Arrive in Bangkok, meet your representative and check in for a relaxing stay at your hotel.',
      'Enjoy the colourful Alcazar Show in Pattaya, subject to confirmed show times and travel plans.'
    ],

    points:[
      '🛬 Bangkok airport arrival',
      '🚘 Hotel transfer & check-in',
      '🎭 Alcazar Show in Pattaya*',
      '🏨 Overnight stay in Bangkok'
    ],

    photos:[
     
      [
        'https://7seasfly.com/wp-content/uploads/2024/02/alcazar-scaled.jpg',
        'Alcazar Cabaret Show Pattaya'
      ],
      [
        'https://www.alcazarthailand.com/images/4ceebae23705f5b316d99e75dbf63a83.jpeg',
        'Alcazar Show Stage'
      ]
    ]
  },

  /* DAY 2 */

  {
    title:'Bangkok City Tour',

    lines:[
      'Explore the Golden Buddha Temple and its magnificent historic statue during your city tour.',
      'Visit the graceful Marble Temple and enjoy Bangkok’s vibrant city views and lively streets.'
    ],

    points:[
      '🍳 Breakfast at hotel',
      '🛕 Golden Buddha (Wat Traimit)',
      '🏛️ Marble Temple (Wat Benchamabophit)',
      '🏨 Return to Bangkok hotel'
    ],

    photos:[
      [
        'https://d1pllr5sjb7ywk.cloudfront.net/uploads/f5d275d2-445f-2d77-8f5c-3a2286a1799d/PackageMedia/b5fec5eb-26b6-492f-87c9-461c96d25edc_marble_R.webp',
        'Bangkok Temple Sightseeing'
      ],
      [
        'https://commons.wikimedia.org/wiki/Special:FilePath/Wat%20Benchamabophit%20Thailand.jpg',
        'Wat Benchamabophit Marble Temple'
      ],
      [
        'https://cdn.forevervacation.com/uploads/destination/bangkok.jpeg',
        'Bangkok City Skyline'
      ]
    ]
  },

  /* DAY 3 */

  {
    title:'Bangkok to Pattaya',

    lines:[
      'Travel by road to Pattaya, a lively coastal destination with sandy beaches and markets.',
      'Check in to your hotel and explore the waterfront or local cafés at leisure this afternoon.'
    ],

    points:[
      '🍳 Breakfast & Bangkok check-out',
      '🚘 Transfer Bangkok → Pattaya*',
      '🏖️ Pattaya Beach at leisure',
      '🏨 Overnight stay in Pattaya'
    ],

    photos:[
      [
        'https://d1pllr5sjb7ywk.cloudfront.net/uploads/f5d275d2-445f-2d77-8f5c-3a2286a1799d/PackageMedia/f4e4a7ae-af6d-4a74-b16b-939f4d96856f_banner2_R.webp',
        'Pattaya Coastal Skyline'
      ],
      [
        'https://thecoralislandpattaya.com/wp-content/uploads/2026/04/Is-Coral-Island-Pattaya-Worth-It-in-2026_-Full-Review-Before-You-Book.webp',
        'Pattaya Coast and Islands'
      ]
    ]
  },

  /* DAY 4 */

  {
    title:'Coral Island (Koh Larn) Tour',

    lines:[
      'Visit beautiful Coral Island and relax along its clear, turquoise shoreline and sandy beaches.',
      'Enjoy beach time and optional water activities before returning to Pattaya later in the day.'
    ],

    points:[
      '🍳 Breakfast & Coral Island trip',
      '🚤 Island transfer as arranged',
      '🏝️ Beach time & scenic views',
      '🌊 Watersports optional; extra cost'
    ],

    photos:[
      [
        'https://d1pllr5sjb7ywk.cloudfront.net/uploads/f5d275d2-445f-2d77-8f5c-3a2286a1799d/PackageMedia/a7b4beaa-d967-4f70-88eb-f383af1d3bf4_corl%20islad_R.webp',
        'Coral Island Koh Larn'
      ],
      [
        'https://res.klook.com/images/fl_lossy.progressive,q_65/c_fill,w_1295,h_727/w_80,x_15,y_15,g_south_west,l_Klook_water_br_trans_yhcmh3/activities/c7pxzcnrvzwiqu2an9oh/KohLarnCoralIslandFullDayPrivateTourfromBangkok.jpg',
        'Coral Island Beach'
      ],
      [
        'https://pattayacitytourcoltd.com/uploads/packagerateImage/ccb50164111421a6ce6a4f59694896d7.jpg',
        'Pattaya Coral Island Waters'
      ]
    ]
  },

  /* DAY 5 — DEPARTURE */

  {
    title:'Departure from Thailand',

    lines:[
      'Enjoy breakfast, complete hotel check-out and gather your belongings for the journey.',
      'Transfer to the departure airport and return home with happy Thailand memories to treasure.'
    ],

    points:[
      '🍳 Breakfast at hotel',
      '🧳 Hotel check-out',
      '🚘 Airport transfer as confirmed*',
      '✈️ Onward departure'
    ],

    /* CHECKOUT → TRANSFER → AIRPORT */

    photos:[
      [
        'https://d1pllr5sjb7ywk.cloudfront.net/uploads/f5d275d2-445f-2d77-8f5c-3a2286a1799d/PackageMedia/6cf5722e-a664-4a09-bc2a-b91b99f3b2ff_c81d877a-302e-4ec0-908d-fa55d43289e3_don_R_R.webp',
        'Hotel Check-out'
      ],
      [
        'https://dynamic-media.tacdn.com/media/photo-o/2e/d3/a7/93/caption.jpg?w=1100&h=800&s=1',
        'Airport Transfer'
      ],
     
    ]
  }

];

/* HEADER & FOOTER */

function header(){
  return `
    <header class="header">

      <img src="${ROOT}logo.png" alt="CityLaila">

      <span>
        WHERE LUXURY MEETS AFFORDABILITY
      </span>

    </header>
  `;
}

function footer(n){
  return `
    <footer class="footer">

      <span>www.citylaila.com</span>

      <span>Page ${String(n).padStart(2,'0')}</span>

    </footer>
  `;
}

function page(n,contents){
  return `
    <section class="page">

      ${header()}

      <div class="main">
        ${contents}
      </div>

      ${footer(n)}

    </section>
  `;
}

/* DAY CARD & WORKING CAROUSEL */

function card(d,i){
  return `
    <article class="day-card">

      <div class="copy">

        <span class="tag">
          DAY ${i+1}
        </span>

        <h3>${d.title}</h3>

        <div class="desc">
          <span>${d.lines[0]}</span>
          <span>${d.lines[1]}</span>
        </div>

        <ul class="points">

          ${d.points.map(x=>`
            <li>${x}</li>
          `).join('')}

        </ul>

      </div>

      <div class="gallery">

        <div class="track"
             id="g${i}"
             data-index="0">

          ${d.photos.map(([url,alt])=>`

            <div class="frame">

              <img
                loading="lazy"
                src="${url.replaceAll('&','&amp;')}"
                alt="${alt}">

            </div>

          `).join('')}

        </div>

        <button
          type="button"
          class="arrow prev"
          aria-label="Previous image"
          onclick="move(${i},-1)">❮</button>

        <button
          type="button"
          class="arrow next"
          aria-label="Next image"
          onclick="move(${i},1)">❯</button>

        <span class="count" id="c${i}">
          1 / ${d.photos.length}
        </span>

      </div>

    </article>
  `;
}

/* PAGE 1 — COVER + DAYS 1–2 */

const hero=`
  <div class="hero">

    <div>

      <small>
        SAMPLE HOLIDAY PACKAGE • 4 NIGHTS / 5 DAYS
      </small>

      <h1>🇹🇭 ThaiBliss Escape</h1>

      <p>
        City Lights &amp; Coral Island • Bangkok • Pattaya
      </p>

    </div>

    <div class="hero-facts">

      <div>🏨 3★ Hotels</div>

      <div>🍳 Daily Breakfast</div>

      <div class="full">
        🌙 Bangkok 2N + Pattaya 2N*
      </div>

    </div>

  </div>
`;

const p1=hero+`
  <div class="days">

    ${DAYS.slice(0,2)
      .map((d,i)=>card(d,i))
      .join('')}

  </div>
`;

/* PAGE 2 — DAYS 3–4 */

const p2=`
  <h2 class="heading">
    Seaside Getaway <em>• Days 3–4</em>
  </h2>

  <div class="days">

    ${DAYS.slice(2,4)
      .map((d,i)=>card(d,i+2))
      .join('')}

  </div>
`;

/* PAGE 3 — DAY 5 + COST & COVERAGE */

const p3=`

  <h2 class="heading">
    Departure &amp; <em>Package Summary</em>
  </h2>

  <div class="lastday">
    ${card(DAYS[4],4)}
  </div>

  <div class="price">

    <div class="total">

      <small>STARTING PACKAGE PRICE</small>

      <strong>₹21,999</strong>

      <span>Price basis to be confirmed</span>

    </div>

    <div class="snapshot">

      <div>🌙 4 Nights / 5 Days</div>

      <div>🏨 3★ Hotels</div>

      <div>🍳 Daily Breakfast</div>

      <div>🏝️ Bangkok & Pattaya Tours</div>

    </div>

  </div>

  <div class="coverage">

    <div class="panel y">

      <h4>✅ Package Inclusions</h4>

      <div class="cells">

        <div>🏨 Four nights in 3★ hotels</div>

        <div>🍳 Daily breakfast</div>

        <div>🏙️ Bangkok City Tour</div>

        <div>🎭 Alcazar Show ticket*</div>

        <div>🏝️ Coral Island Tour</div>

        <div>🚘 Airport & intercity transfers*</div>

        <div>🎟️ Listed attraction tickets</div>

        <div>🧾 Applicable tour/service taxes</div>

      </div>

    </div>

    <div class="panel n">

      <h4>❌ Package Exclusions</h4>

      <div class="cells">

        <div>✈️ International flights</div>

        <div>🛂 Visa, if applicable</div>

        <div>🍽️ Lunch & dinner</div>

        <div>🧳 Travel insurance</div>

        <div>💳 Personal expenses & tips</div>

        <div>🚤 Optional watersports</div>

        <div>🎟️ Unlisted sightseeing & extras</div>

        <div>🛎️ Hotel upgrades & other extras</div>

      </div>

    </div>

  </div>

 
`;

/* RENDER EXACTLY THREE PAGES */

document.getElementById('pages').innerHTML=
  page(1,p1)+
  page(2,p2)+
  page(3,p3);

/* IMAGE CAROUSEL CONTROLS */

function move(i,delta){

  const t=document.getElementById('g'+i);

  if(!t)return;

  const n=t.querySelectorAll('.frame').length;

  if(!n)return;

  const k=
    (Number(t.dataset.index||0)+delta+n)%n;

  t.dataset.index=String(k);

  t.style.transform=
    `translateX(-${k*100}%)`;

  document.getElementById('c'+i).textContent=
    `${k+1} / ${n}`;

}

</script>
</body>
</html>
