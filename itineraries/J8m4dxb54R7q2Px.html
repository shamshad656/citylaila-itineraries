/* =====================================
   CAROUSEL NEXT / PREVIOUS CONTROLS
===================================== */

function moveSlide(day,delta){

  let track=document.getElementById('d'+day);

  if(!track)return;

  let count=track.querySelectorAll('.frame').length;

  if(!count)return;

  let next=
    (Number(track.dataset.index||0)+delta+count)%count;

  track.dataset.index=String(next);

  track.style.transform=
    `translateX(-${next*100}%)`;

  document.getElementById('c'+day).textContent=
    `${next+1} / ${count}`;

}
