/* ===== DESIGN: CITYLAILA SAMPLE FORMAT ===== */
:root {
  --blue:#0066cc;
  --orange:#ff6600;
  --navy:#0A192F;
  --text:#293e53;
  --muted:#62758b;
  --border:#dfe7f0;
  --light:#f8fafc;
}

* { box-sizing:border-box; }

html,body { margin:0; }

body {
  padding:14px 0;
  background:#edf2f7;
  color:var(--text);
  font-family:Montserrat,"Segoe UI Emoji",Arial,sans-serif;
}

.page {
  position:relative;
  width:297mm;
  height:210mm;
  margin:0 auto 16px;
  padding:17px 30px 45px;
  display:flex;
  flex-direction:column;
  background:#fff;
  overflow:hidden;
  box-shadow:0 5px 18px #0a192f18;
  break-after:page;
}

.header {
  height:43px;
  flex:0 0 43px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  border-bottom:1px solid var(--border);
}

.logo {
  max-width:158px;
  max-height:39px;
  object-fit:contain;
  background:transparent;
  border:0;
  padding:0;
  box-shadow:none;
}

.tagline {
  color:#718096;
  font-size:10px;
  letter-spacing:1px;
  font-weight:850;
}

.content {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.footer {
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:34px;
  padding:0 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--light);
  border-top:1px solid var(--border);
  color:#718096;
  font-size:10px;
  font-weight:800;
}

/* ===== COMPACT COVER ===== */
.hero {
  height:111px;
  flex:0 0 111px;
  margin-bottom:11px;
  padding:13px 19px;
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:13px;
  align-items:center;
  border-radius:13px;
  color:#fff;
  overflow:hidden;
  background:
    linear-gradient(105deg,#0a192ff2,#16395ac9),
    url("https://ulduztourism.az/wp-content/uploads/2021/04/baku-old-city-1.jpg")
    center/cover;
}

.hero small {
  color:#ffc078;
  font-size:10px;
  letter-spacing:1.1px;
  font-weight:900;
}

.hero h1 {
  margin:5px 0 6px;
  font-size:29px;
  line-height:1.1;
  font-weight:900;
}

.hero p {
  margin:0;
  font-size:11px;
  line-height:1.4;
  font-weight:750;
}

.hero-facts {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.hero-facts div {
  padding:8px 9px;
  border-radius:7px;
  background:#061b36bc;
  border:1px solid #ffffff46;
  font-size:10px;
  line-height:1.35;
  font-weight:850;
}

.hero-facts .wide { grid-column:1/-1; }

.heading {
  margin:0 0 8px;
  color:var(--navy);
  font-size:24px;
  font-weight:900;
  line-height:1.2;
}

.heading span { color:var(--blue); }

.subheading {
  margin:0 0 12px;
  color:var(--muted);
  font-size:11.5px;
  line-height:1.45;
  font-weight:700;
}

/* ===== TWO DAY CARDS PER PAGE ===== */
.day-cards {
  flex:1;
  min-height:0;
  display:grid;
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:11px;
}

.day-card {
  min-height:0;
  display:grid;
  grid-template-columns:1.12fr .88fr;
  gap:12px;
  padding:11px;
  border:1px solid var(--border);
  border-radius:13px;
  background:white;
  box-shadow:0 2px 10px #0a192f08;
}

.day-text {
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.day-badge {
  padding:5px 10px;
  background:var(--orange);
  border-radius:5px;
  color:white;
  font-size:10px;
  font-weight:900;
}

.day-text h3 {
  margin:7px 0 6px;
  color:var(--navy);
  font-size:17.5px;
  line-height:1.18;
  font-weight:900;
}

.day-desc {
  margin:0 0 8px;
  color:#52677e;
  font-size:11px;
  line-height:1.42;
  font-weight:680;
}

.highlights {
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  list-style:none;
  margin:0;
  padding:0;
}

.highlights li {
  padding:7px 8px;
  border:1px solid var(--border);
  border-radius:7px;
  background:var(--light);
  font-size:10.15px;
  line-height:1.35;
  font-weight:750;
  overflow-wrap:anywhere;
}

.day-note {
  margin-top:8px;
  padding:7px 9px;
  border:1px solid #f0d5a1;
  border-radius:7px;
  background:#fff8ed;
  color:#8c5d1c;
  font-size:9.8px;
  line-height:1.4;
  font-weight:750;
}

/* ===== FUNCTION: CAROUSEL ===== */
.gallery {
  position:relative;
  width:100%;
  height:100%;
  min-height:0;
  overflow:hidden;
  border-radius:10px;
  background:var(--navy);
  isolation:isolate;
}

.gallery-track {
  width:100%;
  height:100%;
  display:flex;
  transition:transform .35s ease;
}

.gallery-frame {
  flex:0 0 100%;
  width:100%;
  min-width:100%;
  height:100%;
}

.gallery-frame img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

.gallery-arrow {
  position:absolute;
  top:50%;
  z-index:3;
  transform:translateY(-50%);
  width:31px;
  height:31px;
  border:1px solid #ffffff6c;
  border-radius:50%;
  background:#0a192fcd;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.gallery-prev { left:8px; }
.gallery-next { right:8px; }

.gallery-caption {
  position:absolute;
  bottom:10px;
  left:10px;
  z-index:3;
  max-width:70%;
  color:white;
  font-size:10.5px;
  font-weight:850;
  line-height:1.3;
  text-shadow:0 1px 5px #000,0 2px 8px #000;
  pointer-events:none;
}

.gallery-counter {
  position:absolute;
  bottom:9px;
  right:9px;
  z-index:3;
  padding:5px 9px;
  border-radius:15px;
  background:#0a192fdc;
  color:white;
  font-size:10px;
  font-weight:900;
}

.gallery.single .gallery-arrow,
.gallery.single .gallery-counter {
  display:none;
}

/* ===== DEPARTURE PAGE ===== */
.departure-layout {
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:15px;
  border:1px solid var(--border);
  border-radius:14px;
}

.departure-layout .day-text h3 {
  font-size:23px;
  margin:12px 0;
}

.departure-layout .day-desc {
  font-size:13px;
  line-height:1.55;
  margin-bottom:16px;
}

.departure-layout .highlights {

}

.departure-layout .highlights li {

  font-size:12px;

.departure-layout .day-note {

  margin-top:15px;
  font-size:11px;
}

.departure-steps {
  width:100%;

  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:auto;

.departure-steps div {

  font-size:11px;
  font-weight:850;
  line-height:1.5;
}

  grid-template-columns:1fr 1fr;
  gap:14px;
  min-height:155px;
  margin-bottom:13px;
}

.price-box {
  display:flex;

  align-items:center;
  justify-content:center;
  padding:16px;
  border-radius:14px;

  text-align:center;
}

  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
}

.price-box strong {

  font-size:30px;
  line-height:1.2;
}

.price-box span {
  color:#e5efff;
  font-size:12px;
  font-weight:800;
}

.snapshot {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  align-content:center;
  padding:11px;
  background:var(--light);
  border:1px solid var(--border);
  border-left:5px solid var(--blue);
  border-radius:12px;
}

.snapshot div {
  padding:11px;
  border:1px solid var(--border);
  border-radius:8px;
  background:white;
  font-size:11px;
  line-height:1.45;
  font-weight:750;
}

.snapshot b { color:var(--navy); }

.coverage {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.panel {
  padding:14px;
  border:1px solid var(--border);
  border-radius:12px;
}

.panel.green { border-top:4px solid #38a169; }
.panel.amber {
  border-top:4px solid #daa437;
  background:#fffdf7;
}

.panel h3 {
  margin:0 0 10px;
  color:var(--navy);
  font-size:15px;
  font-weight:900;
}

.info-list {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.info-list div {
  padding:9px;
  border:1px solid var(--border);
  border-radius:7px;
  background:var(--light);
  font-size:10.5px;
  font-weight:730;
  line-height:1.4;
}

.panel.amber .info-list div { background:white; }

.important {
  margin-top:12px;
  padding:12px;
  border:1px solid #f0cf9d;
  border-radius:9px;
  background:#fff8ed;
  color:#86591f;
  font-size:11px;
  line-height:1.5;
  font-weight:750;
}

.contact-bar {
  margin-top:auto;
  padding:13px 16px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  border-radius:10px;
  background:var(--navy);
  color:white;
  font-size:10.5px;
  font-weight:850;
}

</style>

/* ==================================================

const TOTAL_PAGES = 4;

/* ==================================================
   FUNCTION: BUILD CAROUSEL FROM EDITABLE IMAGE ARRAYS
================================================== */
function gallery(day,index) {
  const images = day.images;
  const single = images.length <= 1;

  return `
    <div class="gallery ${single?"single":""}" id="gallery-${index}">
      <div class="gallery-track" id="track-${index}" data-current="0">
        ${images.map(image=>`
          <div class="gallery-frame">
            <img
              src="${image.url.replace(/&/g,"&amp;")}"
              alt="${image.caption}"
              loading="eager">
          </div>
        `).join("")}
      </div>

      ${!single?`
        <button class="gallery-arrow gallery-prev"
          onclick="moveSlide(${index},-1)"
          aria-label="Previous photo">❮</button>

        <button class="gallery-arrow gallery-next"
          onclick="moveSlide(${index},1)"
          aria-label="Next photo">❯</button>
      `:""}

      <span class="gallery-caption" id="caption-${index}">
        ${images[0]?.caption || ""}
      </span>

      <span class="gallery-counter" id="counter-${index}">
        1 / ${images.length}
      </span>
    </div>
  `;
}

function dayCard(day,index) {
  return `
    <article class="day-card">
      <div class="day-text">
        <span class="day-badge">DAY ${index+1}</span>
        <h3>${day.title}</h3>
        <p class="day-desc">${day.desc}</p>

        <ul class="highlights">
          ${day.items.map(item=>`<li>${item}</li>`).join("")}
        </ul>

        ${day.note?`<div class="day-note">📌 ${day.note}</div>`:""}
      </div>

      ${gallery(day,index)}
    </article>
  `;
}

/* ==================================================
   FUNCTION: CAROUSEL NAVIGATION
================================================== */
function moveSlide(index,direction) {
  const track = document.getElementById(`track-${index}`);
  if(!track) return;

  const images = DAYS[index].images;
  const count = images.length;
  if(count <= 1) return;

  const current = Number(track.dataset.current || 0);
  const next = (current + direction + count) % count;

  track.dataset.current = next;
  track.style.transform = `translateX(-${next*100}%)`;

  document.getElementById(`caption-${index}`).textContent =
    images[next].caption;

  document.getElementById(`counter-${index}`).textContent =
    `${next+1} / ${count}`;
}
