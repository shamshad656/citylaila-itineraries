const TOTAL_PAGES=14;

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

/* FUNCTION: CAROUSEL - COUNTERS AND CAPTIONS AUTO-UPDATE */
function galleryHTML(d,index){
  const images=d.images||[];
  if(!images.length)return `<div class="gallery"></div>`;

  const frames=images.map((im,j)=>`
    <div class="gallery-frame">
      <img
        src="${escapeHTML(im.url)}"
        alt="${escapeHTML(im.caption)}"
        loading="${j===0?"eager":"lazy"}">
      <span class="image-caption">${escapeHTML(im.caption)}</span>
    </div>
  `).join("");

  return `
    <div class="gallery" data-gallery="${index}">
      <div class="gallery-track" id="gallery-track-${index}" data-index="0">
        ${frames}
      </div>
      ${images.length>1?`
        <button class="gallery-btn prev" type="button"
          onclick="moveGallery(${index},-1)"
          aria-label="Previous image">❮</button>
        <button class="gallery-btn next" type="button"
          onclick="moveGallery(${index},1)"
          aria-label="Next image">❯</button>
        <span class="gallery-counter" id="gallery-count-${index}">
          1 / ${images.length}
        </span>
      `:""}
    </div>`;
}

  `);
}

function moveGallery(id,delta){
  const track=document.getElementById(`gallery-track-${id}`);
  if(!track)return;

  const frames=track.querySelectorAll(".gallery-frame");
  const count=frames.length;
  if(count<=1)return;

  let index=Number(track.dataset.index||0);
  index=(index+delta+count)%count;

  track.dataset.index=index;
  track.style.transform=`translateX(-${index*100}%)`;

  const counter=document.getElementById(`gallery-count-${id}`);
  if(counter)counter.textContent=`${index+1} / ${count}`;
}

}
