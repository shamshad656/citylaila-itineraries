/* WORKING IMAGE CAROUSEL */
function moveSlide(n,delta){
 const track=document.getElementById('g'+n);
 if(!track)return;

 const slides=track.querySelectorAll('.slideimg');
 const total=slides.length;
 if(!total)return;

 let index=Number(track.dataset.index||0);
 index=(index+delta+total)%total;

 track.dataset.index=String(index);
 track.style.transform=`translateX(-${index*100}%)`;

 const counter=document.getElementById('c'+n);
 if(counter){
  counter.textContent=`${index+1} / ${total}`;
 }
}
</script>
