
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<!-- CITYLAILA SAMPLE | Lead ID-0204 | 01–06 December 2026 -->
<title>CityLaila | Georgia Holiday Escape – 5N/6D | Lead ID-0204</title>
<meta property="og:title" content="CityLaila | Georgia Holiday Escape – 5N/6D | Lead ID-0204">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A192F;--blue:#0066cc;--orange:#ff6600;--paper:#f8fafc;--line:#dfe7f0;--ink:#293e53}
*{box-sizing:border-box}html,body{margin:0}
body{background:#edf2f7;padding:14px 0;font-family:Montserrat,'Segoe UI Emoji',Arial,sans-serif;color:var(--ink)}
.page{position:relative;width:297mm;height:210mm;margin:0 auto 16px;padding:18px 31px 47px;display:flex;flex-direction:column;background:#fff;overflow:hidden;box-shadow:0 4px 18px #0a192f18;break-after:page;page-break-after:always}
.header{height:43px;flex:0 0 43px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:11px}
.header img{max-width:164px;max-height:39px;object-fit:contain}
.tagline{font-size:10.5px;color:#718096;letter-spacing:1.05px;font-weight:850}
.content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start}
.footer{position:absolute;bottom:0;left:0;right:0;height:35px;background:var(--paper);border-top:1px solid var(--line);padding:0 31px;display:flex;align-items:center;justify-content:space-between;color:#718096;font-size:10.5px;font-weight:800}
.heading{font-size:24px;line-height:1.18;font-weight:900;color:var(--navy);margin:0 0 9px}.heading em{font-style:normal;color:var(--blue)}
.sub{font-size:12px;color:#60758c;font-weight:700;line-height:1.45;margin:0 0 12px}

/* SAMPLE COVER */
.hero{height:112px;flex:0 0 112px;border-radius:14px;margin-bottom:12px;padding:14px 19px;display:grid;grid-template-columns:1.24fr .76fr;gap:13px;align-items:center;background:linear-gradient(100deg,#0a192fe8,#174269b8),url('https://packageimage.s3.ap-south-1.amazonaws.com/Georgia/image_1752671312.jpg') center/cover;color:#fff}
.hero small{font-size:9.6px;letter-spacing:1.2px;color:#ffcc88;font-weight:900}.hero h1{font-size:28px;line-height:1.12;margin:5px 0 6px}.hero p{font-size:11px;line-height:1.36;margin:0;font-weight:750}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.facts div{background:#061b36b9;border:1px solid #ffffff4a;border-radius:7px;padding:7px 9px;font-size:10px;line-height:1.3;font-weight:830}.facts .wide{grid-column:1/-1}

/* DAY CARDS: NO FIXED LINE OR FONT SHRINK TRICKS */
.cards{flex:1;min-height:0;display:grid;grid-template-rows:repeat(2,minmax(0,1fr));gap:11px}
.card{min-height:0;display:grid;grid-template-columns:1.12fr .88fr;gap:12px;padding:11px;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 2px 10px #0a192f08}
.copy{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.daytag{display:inline-block;background:var(--orange);color:#fff;border-radius:5px;padding:5px 10px;font-size:10.5px;font-weight:900}
.copy h3{font-size:17.8px;line-height:1.16;margin:6px 0 5px;color:var(--navy);font-weight:900}
.desc{margin:0 0 8px;font-size:11.35px;line-height:1.34;color:#52677e;font-weight:680;overflow-wrap:anywhere;white-space:normal}
.points{list-style:none;margin:0;padding:0;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.points li{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:7px 8px;font-size:10.65px;line-height:1.31;font-weight:750;overflow-wrap:anywhere}
.gallery{position:relative;width:100%;height:100%;min-height:0;overflow:hidden;background:var(--navy);border-radius:10px}
.track{display:flex;width:100%;height:100%;transition:transform .3s ease}.frame{flex:0 0 100%;width:100%;height:100%}.frame img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:1px solid #ffffff74;background:#0a192fdc;color:#fff;font-size:16px;font-weight:900;cursor:pointer;z-index:2}.prev{left:7px}.next{right:7px}
.count{position:absolute;bottom:9px;right:9px;border-radius:16px;background:#0a192fe8;padding:5px 10px;color:#fff;font-size:10.5px;font-weight:900;z-index:2}

/* FINAL PRICE PAGE: NO HIGHLIGHT IMAGE STRIP */
.pricegrid{display:grid;grid-template-columns:1.04fr .96fr;gap:14px;min-height:155px;margin-bottom:13px}
.total{background:linear-gradient(135deg,var(--navy),#1c4789);border-radius:14px;color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px}
.total small{color:#ffd071;font-size:11px;letter-spacing:1px;font-weight:900}.total strong{font-size:41px;margin:7px 0 3px;line-height:1.2}.total span{font-size:13px;font-weight:850;color:#ffefb3}
.snapshot{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;background:var(--paper);padding:11px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:center}
.snapshot div{padding:10px;background:white;border:1px solid var(--line);border-radius:8px;font-size:11.6px;font-weight:780;line-height:1.35}
.coverage{display:grid;grid-template-columns:1.1fr .9fr;gap:13px;min-height:0}
.panel{padding:14px;border:1px solid var(--line);border-radius:12px;background:white}.panel.good{border-top:4px solid #38a169}.panel.warn{border-top:4px solid #d6a138;background:#fffdf7}.panel h4{margin:0 0 11px;font-size:15px;font-weight:900;color:var(--navy)}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:7px}.cells div{border-radius:7px;border:1px solid var(--line);background:var(--paper);padding:9px;font-size:11.3px;font-weight:730;line-height:1.35;overflow-wrap:anywhere}.warn .cells div{background:#fff;border-color:#f1e0ba}
.note{margin-top:12px;border:1px solid #f1c987;border-radius:9px;padding:12px 13px;background:#fff8ed;font-size:11.5px;color:#88571c;font-weight:740;line-height:1.45}
.last-contact{margin-top:auto;padding:12px 15px;background:var(--navy);color:#fff;border-radius:10px;display:flex;justify-content:space-around;gap:12px;font-size:11.2px;font-weight:850}

/* PRINT: EXACT A4 LANDSCAPE, NO AUTO SCALE OR WHITE MARGINS */
@page{size:A4 landscape;margin:0}
@media print{
html,body{width:297mm!important;margin:0!important;padding:0!important;background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:297mm!important;height:210mm!important;margin:0!important;box-shadow:none!important;break-after:page;page-break-after:always}
.page:last-child{break-after:auto;page-break-after:auto}
.arrow{display:none!important}
}
</style>
</head>
<body>
<main id="pages"></main>
<script>
const LOGO='https://shamshad656.github.io/citylaila-itineraries/images/logo.png';

const DAYS=[
{
title:'Arrival in Tbilisi',
desc:'Arrive at Tbilisi International Airport. Meet your driver and transfer by sedan to the hotel for check-in and relaxation.',
items:[
'🛬 Tbilisi International Airport arrival',
'🤝 Meet the English-speaking driver',
'🚘 Sedan transfer to Sole Hotel Tbilisi',
'🏨 Overnight in Tbilisi'
],
photos:[
['https://eurasianet.org/sites/default/files/styles/article/public/2023-06/tav%20tbilisi%20airport.jpg?h=3f560db1&itok=A_Aetqrf','Tbilisi Airport'],
['https://dynamic-media.tacdn.com/media/photo-o/2e/d3/a7/93/caption.jpg?w=1100&h=800&s=1','Hotel Transfer'],
['https://images.trvl-media.com/place/6108462/67b224c1-3d2a-47c8-9f38-bfdbae2492fd.jpg','Tbilisi Skyline']
]
},
{
title:'Tbilisi City Tour',
desc:'Explore Tbilisi’s Old Town, churches, historic baths, lively streets and iconic viewpoints, including Narikala Fortress.',
items:[
'⛪ Metekhi, Sioni, Anchiskhati & Sameba',
'♨️ Old Baths, Meidani Square & Shardeni',
'🌉 Gabriadze Clock Tower & Peace Bridge',
'🏰 Narikala Fortress (2-way cable car extra)'
],
photos:[
['https://commons.wikimedia.org/wiki/Special:FilePath/Narikala%20fortress%20in%20Tbilisi.jpg','Narikala Fortress'],
['https://i.pinimg.com/1200x/82/f5/48/82f548bd38fd4a7b8f48614d85c23f87.jpg','Old Tbilisi'],
['https://georgianjournal.ge/media/images/georgianews/2018/April/society/img_8918.jpg','Historic Tbilisi']
]
},
{
title:'Zhinvali – Ananuri – Gudauri',
desc:'Travel along the Georgian Military Highway, stopping at Zhinvali Reservoir, Ananuri Castle and the Black & White Aragvi confluence.',
items:[
'🏞️ Zhinvali Reservoir scenic stop',
'🏰 Ananuri Castle & Aragvi confluence',
'🏔️ Gudauri Panorama / Friendship Wall',
'🏨 Overnight at Gudauri Inn'
],
photos:[
['https://cdn.georgiantravelguide.com/storage/files/ananuris-kompleksi-ananuri-fortress.jpg','Ananuri Fortress'],
['https://www.advantour.com/img/georgia/tours/georgia-winter-tour/ananuri_winter.jpg','Mountain Route'],
['https://i.pinimg.com/736x/d5/0d/d50dd00fc01abf86c4bfa862edfc8bca.jpg','Gudauri Mountains']
]
},
{
title:'Kazbegi & Gergeti Trinity',
desc:'Discover Kazbegi Village and travel by local 4×4 Jeep to the spectacular Gergeti Trinity Church, then return to Gudauri.',
items:[
'🏔️ Kazbegi / Stepantsminda village',
'🚙 Local 4×4 Jeep to Gergeti (extra)',
'⛪ Gergeti Trinity Church & views',
'🏨 Return to Gudauri Inn'
],
photos:[
['https://tourguide.ge/wp-content/uploads/2019/03/Seeing-from-Gergeti.jpg','Gergeti Trinity Church'],
['https://i.pinimg.com/736x/d5/0d/d50dd00fc01abf86c4bfa862edfc8bca.jpg','Gudauri Mountains'],
['https://www.advantour.com/img/georgia/tours/georgia-winter-tour/ananuri_winter.jpg','Caucasus Route']
]
},
{
title:'Gudauri – Mtskheta – Tbilisi',
desc:'Return from Gudauri to Tbilisi via Mtskheta, visiting Svetitskhoveli Cathedral and Jvari Monastery along the way.',
items:[
'🧳 Check-out from Gudauri Inn',
'⛪ Svetitskhoveli Cathedral, Mtskheta',
'🏛️ Jvari Monastery & panoramic views',
'🏨 Overnight at Sole Hotel Tbilisi'
],
photos:[
['https://i.pinimg.com/1200x/42/3b/7c/423b7c479943a8ebef61e876e482dcd5.jpg','Mtskheta'],
['https://i.assetzen.net/i/2bo0M13WhjoN/w%3A1200/h%3A/q%3A70.jpg','Jvari Monastery'],
['https://images.trvl-media.com/place/6108462/67b224c1-3d2a-47c8-9f38-bfdbae2492fd.jpg','Tbilisi Return']
]
},
{
title:'Departure from Tbilisi',
desc:'Enjoy your final hotel breakfast, complete check-out formalities and take the sedan transfer to Tbilisi International Airport.',
items:[
'🍳 Breakfast at the hotel',
'🧳 Hotel check-out',
'🚘 Sedan transfer to the airport',
'🛫 Departure from Tbilisi'
],
photos:[
['https://static.toiimg.com/thumb/106057438/Hotel-checkout.jpg?width=1200&height=900','Hotel Checkout'],
['https://dynamic-media.tacdn.com/media/photo-o/2e/d3/a7/93/caption.jpg?w=1100&h=800&s=1','Airport Transfer'],
['https://m.media-amazon.com/images/I/71nXbtmuQlL.jpg','Departure']
]
}
];

function page(n,content){
return `<section class="page">
<header class="header">
<img src="${LOGO}" alt="CityLaila">
<span class="tagline">WHERE LUXURY MEETS AFFORDABILITY</span>
</header>
<div class="content">${content}</div>
<footer class="footer">
<span>www.citylaila.com • info@citylaila.com</span>
<span>Page ${String(n).padStart(2,'0')} / 04</span>
</footer>
</section>`;
}

function card(d,i){
return `<article class="card">
<div class="copy">
<span class="daytag">DAY ${i+1}</span>
<h3>${d.title}</h3>
<p class="desc">${d.desc}</p>
<ul class="points">${d.items.map(x=>`<li>${x}</li>`).join('')}</ul>
</div>
<div class="gallery">
<div class="track" id="g${i}" data-index="0">
${d.photos.map(([url,alt])=>`
<div class="frame">
<img src="${url.replace(/&/g,'&amp;')}" alt="${alt}" loading="eager">
</div>`).join('')}
</div>
<button class="arrow prev" type="button" onclick="move(${i},-1)" aria-label="Previous image">❮</button>
<button class="arrow next" type="button" onclick="move(${i},1)" aria-label="Next image">❯</button>
<span class="count" id="c${i}">1 / ${d.photos.length}</span>
</div>
</article>`;
}

const hero=`
<div class="hero">
<div>
<small>GEORGIA HOLIDAY PACKAGE • 5 NIGHTS / 6 DAYS</small>
<h1>🇬🇪 Georgia Holiday Escape</h1>
<p>01–06 December 2026 • Ashpak Sheikh
<br>Tbilisi • Gudauri • Kazbegi • Mtskheta</p>
</div>
<div class="facts">
<div>👥 2 Adults</div>
<div>🚘 Sedan</div>
<div>🏨 Sole Hotel Tbilisi • 3N</div>
<div>🏔️ Gudauri Inn • 2N</div>
<div class="wide">🍳 Daily Breakfast • Driver (not a guide) • Lead ID-0204</div>
</div>
</div>`;

const first=hero+`
<div class="cards">
${card(DAYS[0],0)}
${card(DAYS[1],1)}
</div>`;

const second=`
<h2 class="heading">Caucasus Highlights <em>• Days 3–4</em></h2>
<p class="sub">Zhinvali, Ananuri and Gudauri viewpoints followed by Kazbegi and Gergeti.</p>
<div class="cards">
${card(DAYS[2],2)}
${card(DAYS[3],3)}
</div>`;

const third=`
<h2 class="heading">Mtskheta & Departure <em>• Days 5–6</em></h2>
<p class="sub">Historic heritage sites on the way to Tbilisi, followed by the airport departure transfer.</p>
<div class="cards">
${card(DAYS[4],4)}
${card(DAYS[5],5)}
</div>`;

const inc=[
'🏨 5 nights accommodation (BB)',
'🏨 Sole Hotel Tbilisi – 3 Nights',
'🏔️ Gudauri Inn – 2 Nights',
'🍳 Daily hotel breakfast',
'🚘 Sedan transportation as per program',
'🗣️ English-speaking driver (NOT a guide)',
'💧 2 water bottles per guest per day',
'🛬 Arrival airport transfer',
'🛫 Departure airport transfer',
'🚐 All listed transfers'
];

const clar=[
'🎟️ Tbilisi cable car, 2 ways – extra',
'🚙 Gergeti 4×4 Jeep – extra',
'💵 Combined quoted entry/activity charge: USD 20 per person',
'🍽️ Lunches and dinners not listed as included',
'✈️ Flights, visas and insurance not listed as included',
'🌦️ Mountain access depends on weather and road conditions'
];

const fourth=`
<h2 class="heading">Package Price <em>& Coverage</em></h2>
<div class="pricegrid">
<div class="total">
<small>TOTAL COST IN DOUBLE</small>
<strong>AED 2,999.00</strong>
<span>AED 1,499.50 Per Adult</span>
</div>
<div class="snapshot">
<div>👤 Ashpak Sheikh</div>
<div>🆔 Lead ID-0204</div>
<div>🌙 5 Nights / 6 Days</div>
<div>👥 2 Adults</div>
<div>🏨 3N Tbilisi + 2N Gudauri</div>
<div>🚘 Sedan • Breakfast</div>
</div>
</div>

<div class="coverage">
<section class="panel good">
<h4>✅ Package Inclusions</h4>
<div class="cells">
${inc.map(x=>`<div>${x}</div>`).join('')}
</div>
</section>
<section class="panel warn">
<h4>ℹ️ Separate Charges & Conditions</h4>
<div class="cells">
${clar.map(x=>`<div>${x}</div>`).join('')}
</div>
</section>
</div>

<div class="note">
<b>Important:</b> AED 2,999 is the total double-occupancy package for 2 adults.
The quoted USD 20 per person for two-way Tbilisi cable car and 4×4 Jeep to
Gergeti is separate from the land package. Hotel bookings, mountain
excursions and other services require confirmation.
</div>

<div class="last-contact">
<span>🌍 CITYLAILA TRAVEL</span>
<span>📞 +971 55 536 5508</span>
<span>✉️ info@citylaila.com</span>
<span>www.citylaila.com</span>
</div>`;

document.getElementById('pages').innerHTML=
page(1,first)+page(2,second)+page(3,third)+page(4,fourth);

function move(i,delta){
const t=document.getElementById('g'+i);
if(!t)return;
const n=t.children.length;
if(n<2)return;
const k=(Number(t.dataset.index||0)+delta+n)%n;
t.dataset.index=String(k);
t.style.transform=`translateX(-${k*100}%)`;
document.getElementById('c'+i).textContent=`${k+1} / ${n}`;
}
</script>
</body>
</html>
