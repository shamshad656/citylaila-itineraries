/* =====================================================
   FUNCTION: SAFE HTML
===================================================== */

function esc(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

      <div class="header-date">

  return `

      ℹ️ Accommodation covers 2 nights at Fairway,
      Yas World Resort, Abu Dhabi, and 7 nights at
      Elite Byblos Hotel, Dubai. Both properties have
      2 rooms on a Bed & Breakfast basis.
      Final room occupancy and children's ages
      remain subject to confirmation.
    </div>
  `,3);
}

/* =====================================================
   FUNCTION: DYNAMIC CAROUSEL
===================================================== */

function gallery(day,index){
  const images=day.images||[];

  if(!images.length){
    return `<div class="gallery"></div>`;
  }

  const frames=images.map((im,i)=>`
    <div class="gallery-frame">
      <img
        src="${esc(im.url)}"
        alt="${esc(im.caption)}"
        loading="${i===0?"eager":"lazy"}">

      <span class="gallery-caption">
        ${esc(im.caption)}
      </span>
    </div>
  `).join("");

  return `
    <div class="gallery">
      <div class="gallery-track"
        id="gallery-${index}"
        data-index="0">
        ${frames}
      </div>

      ${images.length>1?`
        <button type="button"
          class="gallery-btn prev"
          onclick="moveGallery(${index},-1)"
          aria-label="Previous image">❮</button>

        <button type="button"
          class="gallery-btn next"
          onclick="moveGallery(${index},1)"
          aria-label="Next image">❯</button>

        <span class="gallery-counter"
          id="counter-${index}">
          1 / ${images.length}
        </span>
      `:""}
    </div>`;
}

function moveGallery(index,direction){
  const track=document.getElementById(`gallery-${index}`);

  if(!track)return;

  const count=track.querySelectorAll(".gallery-frame").length;

  if(count<=1)return;

  const current=Number(track.dataset.index||0);
  const next=(current+direction+count)%count;

  track.dataset.index=next;
  track.style.transform=`translateX(-${next*100}%)`;

  const counter=document.getElementById(`counter-${index}`);

  if(counter){
    counter.textContent=`${next+1} / ${count}`;
  }
}

/* =====================================================
   PAGES 04–13: DAY-WISE ITINERARY
===================================================== */

function dayPage(day,index){
  return page(`
    <div class="day-layout">
      <div class="day-text">
        <span class="day-badge">
          DAY ${index+1} • ${day.weekday.toUpperCase()},
          ${day.date.toUpperCase()}
        </span>

        <h2>${esc(day.title)}</h2>

        <p class="day-description">
          ${esc(day.description)}
        </p>

        <div class="day-highlights">
          <h3>✨ Today's Highlights</h3>

          <ul>
            ${day.highlights.map(item=>`
              <li>${esc(item)}</li>
            `).join("")}
          </ul>
        </div>

        ${day.note?`
          <div class="day-note">
            ℹ️ ${esc(day.note)}
          </div>
        `:""}
      </div>

      ${gallery(day,index)}
    </div>
  `,index+4);
}

/* =====================================================
   PAGE 14: MEAL SUMMARY
===================================================== */

function mealsPage(){
  const rows=MEALS.map(m=>`
    <tr>
      <td><strong>Day ${m.day}</strong></td>
      <td>${esc(m.date)}</td>
      <td>${esc(m.experience)}</td>
      <td>
        ${m.meal.includes("Breakfast")
          ?'<span class="meal-yes">'+esc(m.meal)+'</span>'
          :esc(m.meal)}
      </td>
    </tr>
  `).join("");

  return page(`
    <h2 class="page-title">
      Meal Plan <span>Summary</span>
    </h2>

    <p class="subtitle">
      Daily hotel breakfast is included throughout
      the nine-night stay in Abu Dhabi and Dubai.
    </p>

    <table class="meal-table">
      <thead>
        <tr>
          <th>Day</th>
          <th>Date</th>
          <th>Programme</th>
          <th>Meal Arrangement</th>
        </tr>
      </thead>

      <tbody>${rows}</tbody>
    </table>

    <div class="meal-note">
      🍳 Hotel breakfast applies from Day 2 through
      Day 10. Day 8 includes a Desert Safari BBQ
      buffet dinner. On Day 7, the Ocean Empress
      Dinner Cruise and Lotus Yacht are alternative
      experiences; meals depend on the selected option.
      Other lunches and dinners are not confirmed.
    </div>
  `,14);
}

/* =====================================================
   PAGE 15: PROGRAMME & CLARIFICATIONS
===================================================== */

function coveragePage(){
  return page(`
    <h2 class="page-title">
      Holiday Programme <span>& Clarifications</span>
    </h2>

    <div class="coverage">
      <div class="coverage-panel good">
        <h3>✅ Planned Holiday Programme</h3>

        <div class="coverage-items">
          ${PROGRAMME.map(item=>`
            <div>${esc(item)}</div>
          `).join("")}
        </div>
      </div>

      <div class="coverage-panel warn">
        <h3>ℹ️ Important Clarifications</h3>

        <div class="coverage-items">
          ${CLARIFICATIONS.map(item=>`
            <div>${esc(item)}</div>
          `).join("")}
        </div>
      </div>
    </div>

    <div class="coverage-note">
      <strong>Booking clarification:</strong>
      The programme reflects the requested activities
      and hotel arrangements. Final ticket inclusions,
      entry slots, selected evening cruise/yacht option,
      transportation details and pricing require
      confirmation before booking.
    </div>
  `,15);
}

/* =====================================================
   PAGE 16: PACKAGE COST
===================================================== */

function pricePage(){
  const amount=PRICE.amount===null
    ?PRICE.status
    :`${PRICE.currency} ${PRICE.amount}`;

  return page(`
    <h2 class="cost-title">
      Package Cost <span>& Grand Total</span>
    </h2>

    <div class="cost-card">
      <div class="cost-label">
        TOTAL PACKAGE PRICE
      </div>

      <div class="cost-amount">
        ${esc(amount)}
      </div>

      <div class="cost-basis">
        4 ADULTS + 2 CHILDREN
      </div>

      <div class="cost-facts">
        <div>
          🌙 Duration
          <strong>9 Nights / 10 Days</strong>
        </div>

        <div>
          🏨 Destinations
          <strong>Abu Dhabi 2N + Dubai 7N</strong>
        </div>

        <div>
          📅 Travel Dates
          <strong>24 Feb – 05 Mar 2027</strong>
        </div>
      </div>
    </div>

    <div class="price-note">
      <strong>Final package amount has not been provided.</strong>
      <br>
      Price confirmation should reflect the selected
      Ocean Empress Dinner Cruise or Lotus Yacht,
      accommodation occupancy, children's ages,
      attraction ticket categories and transport
      arrangements. No estimated package amount
      has been added.
    </div>
  `,16,false,"cost-page");
}

/* =====================================================
   FUNCTION: RENDER COMPLETE UNBRANDED ITINERARY
===================================================== */

function renderItinerary(){
  const pages=[
    coverPage(),
    overviewPage(),
    hotelPage(),

    ...DAYS.map((day,index)=>dayPage(day,index)),

    mealsPage(),
    coveragePage(),
    pricePage()
  ];

  document.getElementById("app").innerHTML=pages.join("");
}

renderItinerary();
</script>
