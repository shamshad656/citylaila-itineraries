<body>

<script>

const LOGO=BASE+'images/logo.png';

const IMG={

}

function day(n,date,title,desc,stay,img,caption){
 return `

html.push(page(1,`

`));

html.push(page(3,`

 <p class="deck">

 '🏨 5 Nights accommodation • BB',

 '🏨 Gudauri Inn • 2 Nights',

 '🗣️ English-speaking driver (NOT a guide)',
 '💧 2 water bottles per person, per day',
 '🛬 Arrival airport transfer',
 '🛫 Departure airport transfer',
 '🗺️ Sightseeing transport as listed',
 '👨‍👩‍👧‍👦 Family of 2 adults + 2 children'
];

 </h2>

    <span style="font-size:10.5px">

  if(b && b.scrollHeight>b.clientHeight+2){
