<meta name="description" content="Amazing Georgia sample holiday: 3 nights Tbilisi, private sightseeing, Caucasus mountains, Mtskheta, Gori and Uplistsikhe. AED 2,400 total for 2 adults.">

<meta property="og:title" content="CityLaila | Amazing Georgia – 3N/4D | Sample Package">

<style>
:root {
  --b:#0066cc;
  --o:#ff6600;
  --n:#0A192F;
  --p:#F8FAFC;
  --line:#E2E8F0;
  --muted:#718096;
}

* {
  box-sizing:border-box;
}

html,body {
  margin:0;
}

body {
  background:#edf1f5;
  color:#2D3748;
  font-family:Montserrat,"Segoe UI Emoji","Apple Color Emoji",sans-serif;
  padding:14px 0;
}

/* ===== A4 LANDSCAPE MASTER ===== */

.page {
  position:relative;
  width:297mm;
  height:210mm;
  margin:0 auto 18px;
  background:#fff;
  padding:26px 39px 59px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  page-break-after:always;
  break-after:page;
  box-shadow:0 5px 16px #0a192f16;
}

.header {
  height:50px;
  flex:0 0 50px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid var(--line);
  margin-bottom:14px;
}

.header img {
  max-height:42px;
  max-width:165px;
  object-fit:contain;
}

.tagline {
  font-size:11px;
  letter-spacing:1px;
  font-weight:800;
  color:var(--muted);
}

.main {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
}

.footer {
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:43px;
  background:var(--p);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 39px;
  font-size:11px;
  font-weight:800;
  color:#66788f;
}

.h {
  font-size:29px;
  line-height:1.2;
  font-weight:900;
  color:var(--n);
  margin:0 0 18px;
}

.h span {
  color:var(--b);
}

/* ===== PREMIUM COVER ===== */

.cover {
  background:
    linear-gradient(#0a192f77,#0a192fd6),
    url('https://packageimage.s3.ap-south-1.amazonaws.com/Georgia/image_1752671312.jpg')
    center/cover;
  justify-content:center;
  align-items:center;
  color:#fff;
}

.cover .main {
  width:100%;
  justify-content:center;
  align-items:center;
}

.coverbox {
  background:#0a192fc2;
  border:1px solid #ffffff55;
  border-radius:18px;
  width:88%;
  text-align:center;
  padding:26px 36px;
}

.coverbox img {
  height:85px;
  max-width:220px;
  object-fit:contain;
}

.cover h1 {
  font-size:35px;
  margin:12px 0 8px;
  line-height:1.22;
}

.cover-sub {
  font-size:15px;
  color:#ffb26d;
  font-weight:800;
}

.chips {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  margin:18px 0;
}

.chip {
  border:1px solid #ffa95f;
  background:#ff66003d;
  border-radius:20px;
  padding:8px 12px;
  font-size:12px;
  font-weight:800;
}

.strip {
  display:inline-block;
  background:var(--o);
  padding:9px 21px;
  border-radius:24px;
  font-size:13px;
  font-weight:900;
}

.covmeta {
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid #ffffff44;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  font-size:15px;
  font-weight:800;
}

/* ===== WHY BOOK WITH US ===== */

.why {
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ===== ITINERARY OVERVIEW ===== */

.overview {
  display:flex;
  flex-direction:column;
  gap:12px;
}

.overview-row {
  border:1px solid var(--line);
  border-radius:10px;
  padding:17px;
  display:grid;
  grid-template-columns:95px 1fr 120px;
  gap:12px;
  align-items:center;
  font-weight:800;
}

.overview-row:nth-child(even) {
  background:var(--p);
}

.daynum {
  font-size:15px;
  color:var(--b);
  font-weight:900;
}

.pill {
  background:#E6FFFA;
  border:1px solid #99F6E4;
  color:#234e52;
  border-radius:7px;
  padding:8px 11px;
  font-size:14px;
}

.city {
  text-align:right;
  font-size:13px;
}

/* ===== HOTEL DETAILS ===== */

.staygrid {
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:20px;
}

.card {
  border:1px solid var(--line);
  border-radius:16px;
  padding:21px;
  box-shadow:0 5px 18px #0a192f0b;
}

.card h3 {
  font-size:20px;
  color:var(--n);
  margin:0 0 13px;
}

.info {
  padding:12px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--p);
  font-size:14px;
  font-weight:800;
  margin-bottom:10px;
}

.info strong {
  display:block;
  font-size:16px;
  margin-top:4px;
  color:var(--n);
}

.hotelbanner {
  background:linear-gradient(135deg,#0a192f,#1e3a8a);
  border-radius:12px;
  color:#fff;
  padding:20px;
  margin-bottom:12px;
}

.hotelbanner h3 {
  color:#fff;
  margin:5px 0;
  font-size:24px;
}

.hotelgrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.hotelgrid div {
  padding:12px;
  border-radius:9px;
  background:var(--p);
  border:1px solid var(--line);
  font-size:13px;
  font-weight:800;
}

/* ===== DAY-WISE ITINERARY ===== */
/* All day content begins TOP-LEFT */

.daygrid {
  flex:1;
  min-height:0;
  height:100%;
  display:grid;
  grid-template-columns:.87fr 1.13fr;
  gap:24px;
}

.daycopy {
  min-height:0;
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:flex-start;
}

.daybadge {
  background:var(--o);
  color:#fff;
  border-radius:7px;
  padding:9px 16px;
  font-size:14px;
  font-weight:900;
  margin-bottom:12px;
}

.daytitle {
  font-size:25px;
  line-height:1.19;
  font-weight:900;
  color:var(--n);
  margin:0 0 11px;
}

.desc {
  font-size:15.5px;
  line-height:1.4;
  font-weight:600;
  margin:0 0 14px;
}

.highlights {
  width:100%;
  background:var(--p);
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px 13px;
}

.highlights h4 {
  margin:0 0 9px;
  font-size:15px;
  color:#004499;
}

.highlights ul {
  margin:0;
  padding:0;
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.highlights li {
  background:#fff;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px 11px;
  font-size:14px;
  font-weight:700;
  line-height:1.29;
  overflow-wrap:break-word;
}

/* ===== WORKING IMAGE CAROUSEL ===== */

.imgbox {
  position:relative;
  width:100%;
  height:100%;
  min-height:0;
  border-radius:17px;
  overflow:hidden;
  border:1px solid var(--line);
  background:var(--n);
  box-shadow:0 10px 25px #0a192f1b;
}

.track {
  display:flex;
  width:100%;
  height:100%;
  transition:transform .35s ease;
}

.photo {
  flex:0 0 100%;
  width:100%;
  height:100%;
  min-width:0;
}

.photo img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.arrow {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:39px;
  height:39px;
  border:1px solid #ffffff55;
  border-radius:50%;
  background:#0a192fca;
  color:#fff;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
  z-index:2;
}

.prev {left:12px}
.next {right:12px}

.counter {
  position:absolute;
  right:17px;
  bottom:17px;
  border-radius:22px;
  background:#0a192fee;
  color:#fff;
  font-size:12px;
  line-height:1.2;
  font-weight:900;
  padding:7px 12px;
  z-index:2;
}

/* ===== MEAL SUMMARY ===== */

.meals {
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  border:2px solid var(--line);
  border-radius:13px;
  overflow:hidden;
}

.meals th {
  background:var(--n);
  color:#fff;
  text-align:left;
  padding:13px 16px;
  font-size:14px;
}

.meals td {
  padding:13px 16px;
  border-bottom:1px solid var(--line);
  font-weight:800;
  font-size:14px;
}

.meals tr:nth-child(even) td {
  background:var(--p);
}

.note {
  background:#EBF8FF;
  border:1px solid #BEE3F8;
  color:#2B6CB0;
  border-radius:9px;
  padding:12px 14px;
  font-size:13px;
  line-height:1.4;
  font-weight:700;
  margin-top:15px;
}

/* ===== INCLUSIONS / EXCLUSIONS ===== */

.coverage {
  display:grid;
  grid-template-columns:1.16fr .84fr;
  gap:20px;
}

.panel {
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;
}

.panel.good {
  border-top:6px solid #38A169;
}

.panel.warn {
  border-top:6px solid #D69E2E;
  background:#FFFDF5;
}

.panel h3 {
  font-size:19px;
  margin:0 0 12px;
}

.services {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.service {
  background:var(--p);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 11px;
  font-size:12.5px;
  line-height:1.32;
  font-weight:800;
}

.caution {
  border:1px solid #F6E05E;
  border-radius:8px;
  padding:9px 11px;
  background:white;
  font-size:12.5px;
  line-height:1.35;
  font-weight:700;
  margin-bottom:8px;
}

/* ===== LOCKED PACKAGE COST DESIGN ===== */

.price {
  height:350px;
  flex:none;
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:27px;
}

.total {
  background:linear-gradient(135deg,var(--n),#1e3a8a);
  color:#fff;
  border-radius:17px;
  padding:26px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  box-shadow:0 12px 30px #0a192f21;
}

.total .kicker {
  color:#FBBF24;
  font-size:14px;
  letter-spacing:1.4px;
  font-weight:800;
}

.total .amount {
  font-size:49px;
  font-weight:900;
  margin:15px 0 8px;
}

.total .pp {
  color:#FDE047;
  font-weight:800;
  font-size:18px;
}

.snapshot {
  border:1px solid var(--line);
  border-left:5px solid var(--b);
  border-radius:16px;
  padding:22px;
  background:var(--p);
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:11px;
}

.snap {
  background:white;
  border:1px solid var(--line);
  border-radius:9px;
  padding:11px 13px;
  font-weight:800;
  font-size:13.5px;
}

.price-note {
  border:1px solid #FBD38D;
  border-radius:10px;
  padding:11px 14px;
  background:#FFF7ED;
  color:#9C4221;
  font-weight:800;
  line-height:1.37;
  font-size:12.8px;
  margin-top:12px;
}

/* ===== GLOBAL CONTACT ===== */

.global {
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:0;
  gap:12px;
}

.globalmain {
  display:grid;
  grid-template-columns:2.1fr 1fr;
  gap:16px;
  flex:1;
  min-height:0;
}

.locations {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:12px;
  background:var(--p);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
}

.location {
  position:relative;
  overflow:hidden;
  border-radius:11px;
  background:#21354d center/cover;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:14px;
  color:white;
}

.location:before {
  position:absolute;
  inset:0;
  content:"";
  background:linear-gradient(#0a192f66,#0a192fdd);
}

.location strong,
.location small {
  position:relative;
  z-index:1;
}

.location strong {
  font-size:14px;
}

.location small {
  font-size:11.5px;
  font-weight:800;
  margin-top:5px;
}

.concierge {
  background:var(--n);
  color:white;
  border-radius:14px;
  padding:17px;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  font-size:12.7px;
}

.concierge b {
  color:#90cdf4;
}

.features {
  display:flex;
  justify-content:space-around;
  border-radius:9px;
  background:var(--n);
  color:#fff;
  padding:11px;
  font-size:11.5px;
  font-weight:800;
}

/* ===== PRINT ===== */

@media print {
  @page {
    size:A4 landscape;
    margin:0;
  }

  body {
    padding:0;
    background:#fff;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  .page {
    margin:0;
    box-shadow:none;
  }

  .arrow {
    display:none;
  }
}
</style>
</head>

<main id="pages"></main>

<script>

/* ===== CITYLAILA BRAND ASSETS ===== */

const R = 'https://shamshad656.github.io/citylaila-itineraries/images/';

/* ===== APPROVED REFERENCE IMAGES ===== */
/* EDIT: Only replace images when necessary */

const photo = {

  1: [
    [
      'https://eurasianet.org/sites/default/files/styles/article/public/2023-06/tav%20tbilisi%20airport.jpg?h=3f560db1&itok=A_Aetqrf',

    ],
    [

    ],
    [
      'https://i.pinimg.com/1200x/82/f5/48/82f548bd38fd4a7b8f48614d85c23f87.jpg',

    [
      'https://i.pinimg.com/1200x/c7/20/72/c720727eada5edb51fdb44b1468fcbc6.jpg',

    ]
  ],
  

  2: [

      'https://cdn.georgiantravelguide.com/storage/files/ananuris-kompleksi-ananuri-fortress.jpg',

    ],
    [
      'https://www.advantour.com/img/georgia/tours/georgia-winter-tour/ananuri_winter.jpg',

    [
      'https://i.pinimg.com/736x/d5/0d/d0/d50dd00fc01abf86c4bfa862edfc8bca.jpg',

    ],

  3: [

      'Jvari Monastery'
    ],
    [
      'https://commons.wikimedia.org/wiki/Special:FilePath/Uplistsikhe%20cave%20town.jpg',
      'Uplistsikhe Cave Town'
    ],
    [
      'https://commons.wikimedia.org/wiki/Special:FilePath/Caves%20and%20church%20Uplistsikhe%20Cave%20City.jpg',
      'Uplistsikhe Cave City'
    ]
  ],

  4: [
    [
      'https://static.toiimg.com/thumb/106057438/Hotel-checkout.jpg?width=1200&height=900',
      'Hotel Checkout'
    ],
    [
      'https://dynamic-media.tacdn.com/media/photo-o/2e/d3/a7/93/caption.jpg?w=1100&h=800&s=1',
      'Airport Transfer'
    ],
    [
      'https://m.media-amazon.com/images/I/71nXbtmuQlL.jpg',
      'Departure'
    ]
  ]

};

/* ===== DAY-WISE TOUR CONTENT ===== */
/* EDIT: Day descriptions and highlights */

const info = [

  {
    name:'Arrival in Tbilisi & City Tour',
    desc:'Welcome to Georgia! After airport arrival and hotel transfer, explore the atmospheric streets, landmark squares and historic neighbourhoods of Tbilisi.',
    h:[
      '🛬 Airport meet & greet and transfer to the hotel',
      '⛪ Old Tbilisi, Metekhi Church area and Europe Square',
      '🌉 Bridge of Peace, Rike Park and Narikala Fortress area',
      '♨️ Abanotubani Sulphur Bath District; overnight in Tbilisi'
    ]
  },

  {
    name:'Gudauri & Kazbegi Mountain Tour',
    desc:'Travel through the picturesque Caucasus region, discovering historic fortresses, mountain viewpoints and the scenic surroundings of Kazbegi.',
    h:[
      '🍳 Hotel breakfast; Zhinvali Reservoir and Ananuri Fortress',
      '🏔️ Scenic Caucasus drive and Gudauri Friendship Monument',
      '🏞️ Explore Stepantsminda (Kazbegi) and mountain viewpoints',
      '⛪ Gergeti Trinity Church; 4×4 access may cost extra; return to Tbilisi'
    ]
  },

  {
    name:'Mtskheta, Gori & Uplistsikhe Tour',
    desc:'Discover Georgia’s ancient heritage on a cultural journey through a historic town, an iconic hilltop monastery and the fascinating rock-hewn caves.',
    h:[
      '🍳 Hotel breakfast and drive towards historic Mtskheta',
      '⛪ Explore Jvari Monastery and panoramic surroundings',
      '🏰 Continue to Gori for its historical attractions',
      '🪨 Discover Uplistsikhe Ancient Cave Town; return to Tbilisi'
    ]
  },

  {
    name:'Departure from Tbilisi',
    desc:'Enjoy breakfast before checking out and travelling comfortably to the airport, bringing your Georgia escape to a memorable close.',
    h:[
      '🍳 Breakfast at the hotel',
      '🧳 Hotel check-out and departure preparations',
      '🚘 Private transfer to Tbilisi International Airport',
      '🛫 Departure with wonderful memories of Georgia'
    ]
  }

];

/* ===== REUSABLE BRAND HEADER & FOOTER ===== */

const footer = n => `
  <footer class="footer">
    <span>www.citylaila.com</span>
    <span>Page ${String(n).padStart(2,'0')}</span>
  </footer>
`;

const head = `
  <header class="header">
    <img src="${R}logo.png" alt="CityLaila logo">
    <span class="tagline">
      WHERE LUXURY MEETS AFFORDABILITY
    </span>
  </header>
`;

const pg = (n,inner,klass='') => `
  <section class="page ${klass}">
    ${klass==='cover' ? '' : head}
    <div class="main">${inner}</div>
    ${footer(n)}
  </section>
`;

/* ===== CAROUSEL BUILDER ===== */

const carousel = n => `
  <div class="imgbox">

    <div class="track" id="d${n}" data-index="0">

      ${photo[n].map(([src,alt]) => `
        <div class="photo">
          <img
            src="${src.replaceAll('&','&amp;')}"
            alt="${alt}">
        </div>
      `).join('')}

    </div>

    <button class="arrow prev" type="button"
      aria-label="Previous image"
      onclick="moveSlide(${n},-1)">❮</button>

    <button class="arrow next" type="button"
      aria-label="Next image"
      onclick="moveSlide(${n},1)">❯</button>

    <div class="counter" id="c${n}">
      1 / ${photo[n].length}
    </div>

  </div>
`;

/* ===== PAGE 01: PREMIUM COVER ===== */

let pages = [];

pages.push(pg(1,`

  <div class="coverbox">

    <img src="${R}logo.png" alt="CityLaila">

    <h1>🇬🇪 Amazing Georgia</h1>

    <div class="cover-sub">
      Tbilisi • Gudauri • Kazbegi • Mtskheta • Uplistsikhe
    </div>

    <div class="chips">
      <span class="chip">🏙️ Historic Tbilisi</span>

/* ===== WORKING CAROUSEL CONTROLS ===== */

function moveSlide(day,step) {

  const t = document.getElementById('d'+day);

  if (!t) return;

  const count = t.querySelectorAll('.photo').length;

  const i = (Number(t.dataset.index||0)+step+count)%count;

  t.dataset.index = String(i);

  t.style.transform = 'translateX(-'+(i*100)+'%)';

  document.getElementById('c'+day).textContent =
    (i+1)+' / '+count;

}
